<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hukamnama Audio Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #0D0D0F;
            color: #fff;
        }
        h1 {
            color: #C9A84C;
            border-bottom: 2px solid #C9A84C;
            padding-bottom: 10px;
        }
        .test-section {
            background: #1C1C1E;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            border: 1px solid rgba(201, 168, 76, 0.2);
        }
        .test-section h2 {
            margin-top: 0;
            color: #C9A84C;
            font-size: 1.2rem;
        }
        button {
            background: #C9A84C;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #D4AF37;
        }
        button:active {
            transform: scale(0.98);
        }
        .log {
            background: #000;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        .log div {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid transparent;
        }
        .log .success {
            color: #4ade80;
            border-left-color: #4ade80;
        }
        .log .error {
            color: #ef4444;
            border-left-color: #ef4444;
        }
        .log .info {
            color: #60a5fa;
            border-left-color: #60a5fa;
        }
        .log .warn {
            color: #fbbf24;
            border-left-color: #fbbf24;
        }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-left: 10px;
        }
        .status.pending { background: #444; color: #aaa; }
        .status.testing { background: #fbbf24; color: #000; }
        .status.success { background: #4ade80; color: #000; }
        .status.failed { background: #ef4444; color: #fff; }
        .controls {
            margin-top: 15px;
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
        .env-info {
            background: #2d2d30;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-size: 0.9rem;
        }
        .env-info strong {
            color: #C9A84C;
        }
    </style>
</head>
<body>
    <h1>🎧 Hukamnama Audio Deployment Test</h1>
    
    <div class="test-section">
        <h2>Environment Detection</h2>
        <div class="env-info">
            <div><strong>Host:</strong> <span id="host"></span></div>
            <div><strong>Port:</strong> <span id="port"></span></div>
            <div><strong>Protocol:</strong> <span id="protocol"></span></div>
            <div><strong>Is Capacitor:</strong> <span id="isCapacitor"></span></div>
            <div><strong>Detected API Base:</strong> <span id="apiBase"></span></div>
        </div>
    </div>

    <div class="test-section">
        <h2>Backend API Test <span class="status pending" id="backendStatus">Pending</span></h2>
        <button onclick="testBackendAPI()">Test Backend Endpoint</button>
        <button onclick="testDirectSGPC()">Test Direct SGPC URL</button>
        <div class="log" id="backendLog"></div>
    </div>

    <div class="test-section">
        <h2>Audio Player Test <span class="status pending" id="audioStatus">Pending</span></h2>
        <button onclick="testAudioPlayback()">Test Audio Playback</button>
        <button onclick="stopAudio()">Stop Audio</button>
        <div class="log" id="audioLog"></div>
        <audio id="testAudio" controls style="display:none;"></audio>
    </div>

    <div class="test-section">
        <h2>Full Integration Test <span class="status pending" id="integrationStatus">Pending</span></h2>
        <button onclick="runFullTest()">Run All Tests</button>
        <div class="log" id="integrationLog"></div>
    </div>

    <script>
        // Detect environment
        const host = window.location.hostname;
        const port = window.location.port;
        const protocol = window.location.protocol;
        const isCapacitor = !!(window.Capacitor);

        // Determine API base (same logic as fixed code)
        let apiBase;
        try {
            if (isCapacitor) {
                apiBase = 'https://anhad-final.onrender.com';
            } else if (port === '3000' || port === '3001') {
                apiBase = '';
            } else if (host === 'localhost' || host === '127.0.0.1') {
                apiBase = 'http://localhost:3000';
            } else if (host.match(/^\d+\.\d+\.\d+\.\d+$/)) {
                apiBase = `http://${host}:3000`;
            } else {
                apiBase = 'https://anhad-final.onrender.com';
            }
        } catch (e) {
            apiBase = 'https://anhad-final.onrender.com';
        }

        // Display environment info
        document.getElementById('host').textContent = host || 'N/A';
        document.getElementById('port').textContent = port || 'N/A';
        document.getElementById('protocol').textContent = protocol;
        document.getElementById('isCapacitor').textContent = isCapacitor ? 'Yes' : 'No';
        document.getElementById('apiBase').textContent = apiBase;

        function log(logId, message, type = 'info') {
            const logDiv = document.getElementById(logId);
            const entry = document.createElement('div');
            entry.className = type;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus(statusId, status) {
            const statusEl = document.getElementById(statusId);
            statusEl.className = `status ${status}`;
            statusEl.textContent = status.charAt(0).toUpperCase() + status.slice(1);
        }

        async function testBackendAPI() {
            const logId = 'backendLog';
            const statusId = 'backendStatus';
            updateStatus(statusId, 'testing');
            log(logId, '🔍 Testing backend API endpoint...', 'info');
            
            const url = `${apiBase}/api/hukamnama/audio`;
            log(logId, `URL: ${url}`, 'info');

            try {
                const response = await fetch(url, { method: 'HEAD' });
                log(logId, `Response status: ${response.status}`, 'info');
                log(logId, `Content-Type: ${response.headers.get('Content-Type')}`, 'info');
                
                if (response.ok) {
                    log(logId, '✅ Backend API is working!', 'success');
                    updateStatus(statusId, 'success');
                } else {
                    log(logId, `❌ Backend returned ${response.status}`, 'error');
                    updateStatus(statusId, 'failed');
                }
            } catch (error) {
                log(logId, `❌ Error: ${error.message}`, 'error');
                updateStatus(statusId, 'failed');
            }
        }

        async function testDirectSGPC() {
            const logId = 'backendLog';
            log(logId, '🔍 Testing direct SGPC URL...', 'info');
            
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const url = `https://www.sgpc.net/hukamnama/${y}/${m}/${day}/hukamnama.mp3`;
            
            log(logId, `URL: ${url}`, 'info');

            try {
                const response = await fetch(url, { method: 'HEAD', mode: 'no-cors' });
                log(logId, '✅ SGPC URL is accessible (no-cors mode)', 'success');
            } catch (error) {
                log(logId, `⚠️ SGPC test inconclusive: ${error.message}`, 'warn');
            }
        }

        async function testAudioPlayback() {
            const logId = 'audioLog';
            const statusId = 'audioStatus';
            updateStatus(statusId, 'testing');
            log(logId, '🎵 Testing audio playback...', 'info');

            const audio = document.getElementById('testAudio');
            audio.style.display = 'block';
            
            const urls = [
                `${apiBase}/api/hukamnama/audio`,
                `https://www.sgpc.net/hukamnama/hukamnama.mp3`
            ];

            log(logId, `Will try ${urls.length} URLs...`, 'info');

            for (const url of urls) {
                log(logId, `Attempting: ${url}`, 'info');
                
                try {
                    audio.src = url;
                    audio.load();
                    
                    await new Promise((resolve, reject) => {
                        const timeout = setTimeout(() => {
                            cleanup();
                            reject(new Error('Timeout'));
                        }, 8000);

                        const cleanup = () => {
                            audio.removeEventListener('canplay', onSuccess);
                            audio.removeEventListener('error', onError);
                            clearTimeout(timeout);
                        };

                        const onSuccess = () => {
                            cleanup();
                            resolve();
                        };

                        const onError = () => {
                            cleanup();
                            reject(new Error('Load failed'));
                        };

                        audio.addEventListener('canplay', onSuccess, { once: true });
                        audio.addEventListener('error', onError, { once: true });
                    });

                    await audio.play();
                    log(logId, `✅ SUCCESS! Playing from: ${url}`, 'success');
                    updateStatus(statusId, 'success');
                    return;
                } catch (error) {
                    log(logId, `❌ Failed: ${error.message}`, 'error');
                }
            }

            log(logId, '❌ All URLs failed', 'error');
            updateStatus(statusId, 'failed');
        }

        function stopAudio() {
            const audio = document.getElementById('testAudio');
            audio.pause();
            audio.src = '';
            audio.style.display = 'none';
            log('audioLog', '⏹️ Audio stopped', 'info');
        }

        async function runFullTest() {
            const logId = 'integrationLog';
            updateStatus('integrationStatus', 'testing');
            log(logId, '🚀 Running full integration test...', 'info');

            // Test 1: Backend API
            log(logId, 'Test 1: Backend API endpoint...', 'info');
            try {
                const response = await fetch(`${apiBase}/api/hukamnama/audio`, { method: 'HEAD' });
                if (response.ok) {
                    log(logId, '✅ Backend API: PASS', 'success');
                } else {
                    log(logId, `⚠️ Backend API: ${response.status}`, 'warn');
                }
            } catch (error) {
                log(logId, `❌ Backend API: FAIL - ${error.message}`, 'error');
            }

            // Test 2: Environment detection
            log(logId, 'Test 2: Environment detection...', 'info');
            log(logId, `✅ Detected API base: ${apiBase}`, 'success');
            log(logId, `✅ Capacitor: ${isCapacitor}`, 'success');

            // Test 3: URL generation
            log(logId, 'Test 3: URL generation...', 'info');
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const urls = [
                `${apiBase}/api/hukamnama/audio`,
                `https://www.sgpc.net/hukamnama/${y}/${m}/${day}/hukamnama.mp3`,
                `https://www.sgpc.net/hukamnama/hukamnama.mp3`
            ];
            log(logId, `✅ Generated ${urls.length} fallback URLs`, 'success');

            log(logId, '✅ Full test complete! Check individual sections above.', 'success');
            updateStatus('integrationStatus', 'success');
        }
    </script>
</body>
</html>
