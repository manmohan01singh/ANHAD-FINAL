  <!-- CRITICAL: Theme blocker - MUST run before paint -->
  <script>
(function() {
  try {
    const theme = localStorage.getItem('anhad_theme') || 'light';
    if (theme === 'dark') {
      document.documentElement.classList.add('dark');
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.classList.remove('dark');
      document.documentElement.setAttribute('data-theme', 'light');
    }
  } catch (e) {}
})();
  </script>

<body>
    <!-- AMBIENT BACKGROUND -->
    <div class="bg-container">
        <img class="bg-image" src="../assets/HERO CARD IMAGES/new-night-bg.webp" alt="" id="bgDarbar">
        <script>
            (function() {

                    document.getElementById('bgDarbar').src = img;

    <!-- PLAYER -->

    <!-- STATUS PILL -->

    <!-- CONNECTION OVERLAY - DISABLED -->

    <!-- UNIFIED AUDIO SINGLETON -->
    <script src="../lib/anhad-audio-singleton.js?v=2.1.7-proxy"></script>
    <!-- REMOVED: Inline audio elements - singleton handles audio -->

    <script>
    // ═══════════════════════════════════════════════════════════════════════════════
    // EXTREME GURBANI RADIO - MAIN CONTROLLER
    // ═══════════════════════════════════════════════════════════════════════════════
    
    const STATE = {
        currentStream: 'darbar', // 'darbar' | 'amritvela' | 'simran'
        isPlaying: false,
        isConnecting: false,
        volume: 0.7,
        currentTrackIndex: 0,
        totalTracks: 40,
        lastTrackSyncAt: 0,
        retryCount: 0,
        maxRetries: 5,
        lastError: null
    };

    const LIVE_UI = {
        anchorWallTime: 0,
        anchorAudioTime: 0,
        pausedAt: 0,
        isBehind: false,
        pendingAnchor: false
    };

    const STREAMS = {
        darbar: {
            name: 'Darbar Sahib',
            url: 'https://live.sgpc.net:8443/;nocache=1',
            type: 'live',
            image: '../assets/HERO CARD IMAGES/new-night-bg.webp',
            lightImage: '../assets/darbar-sahib-day.webp',
            title: 'Live Kirtan',
            artist: 'Sri Harmandir Sahib',
            color: 'gold'
        },
        amritvela: {
            name: 'Amritvela Kirtan',
            baseUrl: 'https://pub-525228169e0c44e38a67c306ba1a458c.r2.dev',
            // Smart URL resolution to fix mobile app CORS and localhost issues
            syncUrl: (() => {
                // For Capacitor apps, always use production URL
                if (window.Capacitor) return 'https://anhad-final.onrender.com/api/radio/live';
                
                const host = window.location.hostname;
                const port = window.location.port;
                if (port === '3000' || port === '3001') return '/api/radio/live';
                if (host === 'localhost' || host === '127.0.0.1') return 'http://localhost:3000/api/radio/live';
                if (host.match(/^[0-9]+(\.[0-9]+){3}$/)) return `http://${host}:3000/api/radio/live`;
                return 'https://anhad-final.onrender.com/api/radio/live';
            })(),
            type: 'playlist',
            image: '../assets/HERO CARD IMAGES/new-night-bg.webp',
            lightImage: '../assets/darbar-sahib-day.webp',
            title: 'Amritvela Kirtan',
            artist: 'Divine Shabad',
            color: 'orange'
        },
        simran: {
            name: 'Waheguru Simran',
            baseUrl: 'https://pub-8bf31fc1f2a44451b40a3ded7e07fac2.r2.dev',
            syncUrl: (() => {
                if (window.Capacitor) return 'https://anhad-final.onrender.com/api/simran/live';

                const host = window.location.hostname;
                const port = window.location.port;
                if (port === '3000' || port === '3001') return '/api/simran/live';
                if (host === 'localhost' || host === '127.0.0.1') return 'http://localhost:3000/api/simran/live';
                if (host.match(/^[0-9]+(\.[0-9]+){3}$/)) return `http://${host}:3000/api/simran/live`;
                return 'https://anhad-final.onrender.com/api/simran/live';
            })(),
            type: 'playlist',
            image: '../guruimages/gurunanakdevsahebji.jpeg',
            title: 'Waheguru Simran',
            artist: 'Amritvela Trust',
            color: 'simran',
            totalTracks: 38
        }
    };

    const legacyAudioEvents = { addEventListener: () => {}, load: () => {} };

    // DOM Elements
    const dom = {
        player: document.getElementById('player'),
        // REMOVED: audioDarbar, audioAmritvela - singleton handles audio
        audioDarbar: legacyAudioEvents,
        audioAmritvela: legacyAudioEvents,

        // Stream switcher
        streamPill: document.getElementById('streamPill'),
        btnDarbar: document.getElementById('btnDarbar'),
        btnAmritvela: document.getElementById('btnAmritvela'),
        btnSimran: document.getElementById('btnSimran'),
        simranSwitch: document.getElementById('simranSwitch'),
        simranSwitchState: document.getElementById('simranSwitchState'),
        
        // Artwork
        artworkContainer: document.getElementById('artworkContainer'),
        artworkImg: document.getElementById('artworkImg'),
        bgDarbar: document.getElementById('bgDarbar'),
        bgAmritvela: document.getElementById('bgAmritvela'),
        liveBadge: document.getElementById('liveBadge'),
        liveLabel: document.getElementById('liveLabel'),
        liveJumpBtn: document.getElementById('liveJumpBtn'),
        liveBehindText: document.getElementById('liveBehindText'),
        
        // Track info
        trackTitle: document.getElementById('trackTitle'),
        trackArtist: document.getElementById('trackArtist'),
        trackInfo: document.getElementById('trackInfo'),
        
        // Controls
        playBtn: document.getElementById('playBtn'),
        playIcon: document.getElementById('playIcon'),
        prevBtn: document.getElementById('prevBtn'),
        nextBtn: document.getElementById('nextBtn'),
        
        // Volume
        volumeInput: document.getElementById('volumeInput'),
        volumeFill: document.getElementById('volumeFill'),
        
        // Progress
        elapsedTime: document.getElementById('elapsedTime'),
        
        // Status
        statusPill: document.getElementById('statusPill'),
        statusText: document.getElementById('statusText'),
        statusDot: document.getElementById('statusDot'),
        
        // Error
        errorToast: document.getElementById('errorToast'),
        errorTitle: document.getElementById('errorTitle'),
        errorMessage: document.getElementById('errorMessage'),
        errorRetryBtn: document.getElementById('errorRetryBtn'),
        
        // Connection overlay
        connectionOverlay: document.getElementById('connectionOverlay'),
        connectingStream: document.getElementById('connectingStream'),
        
        // Theme
        themeBtn: document.getElementById('themeBtn'),
        themeIcon: document.getElementById('themeIcon')
    };

    // Get singleton audio element
    function getAudio() {
        return window.AnhadAudio ? window.AnhadAudio.getAudio() : null;
    }

    function isVirtualStream(streamType = STATE.currentStream) {
        return streamType === 'amritvela' || streamType === 'simran';
    }

    function markLiveAnchor() {
        const audio = getAudio();
        LIVE_UI.anchorWallTime = Date.now();
        LIVE_UI.anchorAudioTime = audio ? Number(audio.currentTime) || 0 : 0;
        LIVE_UI.pausedAt = 0;
        LIVE_UI.isBehind = false;
        LIVE_UI.pendingAnchor = false;
        updateLiveButtonState(true);
    }

    function requestLiveAnchor() {
        LIVE_UI.pendingAnchor = true;
    }

    function getBehindLiveSeconds() {
        if (!isVirtualStream() || !LIVE_UI.anchorWallTime) return 0;
        const audio = getAudio();
        if (!audio) return 0;
        const expected = LIVE_UI.anchorAudioTime + ((Date.now() - LIVE_UI.anchorWallTime) / 1000);
        return Math.max(0, expected - (Number(audio.currentTime) || 0));
    }

    function updateLiveButtonState() {
        if (!dom.liveJumpBtn || !window.AnhadAudio) return;
        
        const state = window.AnhadAudio.getState();
        const isBehind = isVirtualStream() && state.isBehind;
        const offset = state.liveOffset || 0;

        dom.liveJumpBtn.classList.toggle('is-behind', isBehind);
        dom.liveJumpBtn.classList.toggle('is-synced', !isBehind);
        
        // ═══ ENHANCED LIVE UI: Dynamic pill text ═══
        const textSpan = dom.liveJumpBtn.querySelector('span:nth-child(2)');
        if (textSpan) {
            textSpan.textContent = isBehind ? 'Jump to Live' : 'LIVE';
        }
        
        if (dom.liveBehindText) {
            if (isBehind) {
                const totalSecs = Math.round(offset);
                if (totalSecs >= 3600) {
                    const h = Math.floor(totalSecs / 3600);
                    const m = Math.floor((totalSecs % 3600) / 60);
                    const s = totalSecs % 60;
                    dom.liveBehindText.textContent = `-${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                } else if (totalSecs >= 60) {
                    const m = Math.floor(totalSecs / 60);
                    const s = totalSecs % 60;
                    dom.liveBehindText.textContent = `-${m}:${s.toString().padStart(2,'0')}`;
                } else {
                    dom.liveBehindText.textContent = `-${totalSecs}s`;
                }
            } else {
                dom.liveBehindText.textContent = '';
            }
        }
        
        const dot = dom.liveJumpBtn.querySelector('.live-jump-dot');
        if (dot) dot.classList.toggle('pulsing', isBehind);
        LIVE_UI.isBehind = isBehind;
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // STREAM SWITCHING
    // ═══════════════════════════════════════════════════════════════════════════════
    
    async function switchStream(streamType) {
        if (STATE.currentStream === streamType || STATE.isConnecting) return;

        const prevStream = STATE.currentStream;
        STATE.currentStream = streamType;
        const wasPlaying = STATE.isPlaying;
        LIVE_UI.anchorWallTime = 0;
        LIVE_UI.anchorAudioTime = 0;
        LIVE_UI.pausedAt = 0;
        LIVE_UI.pendingAnchor = false;

        // Update UI
        updateStreamUI(streamType);

        // Use singleton to switch streams
        if (wasPlaying) {
            STATE.isConnecting = true;
            updateUI();
            await window.AnhadAudio.play(streamType);
            STATE.isPlaying = true;
            STATE.isConnecting = false;
            updateUI();
        } else {
            // Just update state, don't auto-play
            updateUI();
        }

        saveState();
        hapticFeedback();
    }

    function updateStreamUI(streamType) {
        const stream = STREAMS[streamType];
        const isAmritvela = streamType === 'amritvela';
        const isSimran = streamType === 'simran';
        const showSimranSwitch = false;
        STATE.totalTracks = stream.totalTracks || (isSimran ? 38 : 40);
        
        // Update pill
        dom.streamPill.className = 'stream-pill ' + streamType;
        
        // Update buttons
        dom.btnDarbar.classList.toggle('active', streamType === 'darbar');
        dom.btnAmritvela.classList.toggle('active', isAmritvela);
        dom.btnSimran.classList.toggle('active', isSimran);
        
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
        const displayImage = (currentTheme === 'light' && stream.lightImage) ? stream.lightImage : stream.image;

        // Update artwork
        dom.artworkImg.src = displayImage;
        dom.artworkImg.alt = stream.name;
        dom.artworkContainer.classList.toggle('simran', isSimran);
        
        // Match background with artwork
        if (dom.bgDarbar) {
            dom.bgDarbar.src = displayImage;
        }
        
        // Update track info
        dom.trackTitle.textContent = stream.title;
        dom.trackArtist.textContent = stream.artist;
        
        // Update play button color
        dom.playBtn.className = 'control-btn primary ' + streamType;
        
        // Update volume fill color
        dom.volumeFill.className = 'volume-fill ' + streamType;
        
        // Show/hide live label and badge
        dom.liveBadge.style.display = streamType === 'darbar' ? 'flex' : 'none';
        if (dom.liveLabel) {
            dom.liveLabel.style.display = streamType === 'darbar' ? 'inline-flex' : 'none';
        }

        // Show/hide LIVE jump button (explicit jump-to-live control for all streams)
        if (dom.liveJumpBtn) {
            dom.liveJumpBtn.style.display = 'inline-flex';
            updateLiveButtonState(!isVirtualStream(streamType));
        }

        // Show/hide track subtitle
        const trackSubtitle = document.getElementById('trackSubtitle');
        if (trackSubtitle) {
            trackSubtitle.style.display = streamType === 'simran' ? 'block' : 'none';
        }

        // Magical Simran switch
        if (dom.simranSwitch) {
            dom.simranSwitch.classList.toggle('visible', showSimranSwitch);
            dom.simranSwitch.classList.toggle('active', isSimran);
            dom.simranSwitch.setAttribute('aria-pressed', String(isSimran));
        }
        if (dom.simranSwitchState) {
            dom.simranSwitchState.textContent = isSimran ? 'Simran is on' : 'Tap to turn on';
        }
        
        // Update connecting text
        dom.connectingStream.textContent = stream.name;
    }

    function toggleSimranSwitch() {
        const targetStream = STATE.currentStream === 'simran' ? 'amritvela' : 'simran';
        switchStream(targetStream);
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // AMRITVELA / SIMRAN — virtual live sync lives in ../lib/anhad-audio-singleton.js
    // ═══════════════════════════════════════════════════════════════════════════════

    // REMOVED: syncAmritvelaPosition - singleton handles server sync
    async function syncAmritvelaPosition() {
        // Singleton handles all server sync logic
        return true;
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // PLAYBACK CONTROL
    // ═══════════════════════════════════════════════════════════════════════════════
    
    async function play() {
        if (!window.AnhadAudio) return;
        // Guard: don't re-trigger if singleton is already loading/connecting
        if (STATE.isConnecting) {
            console.log('[GR] play() ignored — already connecting');
            return;
        }

        STATE.isConnecting = true;
        dom.playBtn.classList.add('loading');

        try {
            await window.AnhadAudio.play(STATE.currentStream);
            STATE.isPlaying = true;
            STATE.isConnecting = false;
            STATE.retryCount = 0;
            updateUI();
            saveState();
            hapticFeedback(50);
        } catch (err) {
            console.error('[GR] Play error:', err);
            STATE.isConnecting = false;
            dom.playBtn.classList.remove('loading');
            // Only show error toast — singleton auto-retries internally, don't double-retry
            showError('Connecting...', 'Establishing connection to stream', true);
        } finally {
            STATE.isConnecting = false;
            dom.playBtn.classList.remove('loading');
        }

        saveState();
    }

    function pause() {
        if (!window.AnhadAudio) return;
        window.AnhadAudio.pause();
        STATE.isPlaying = false;
        STATE.isConnecting = false;
        updateUI();
        saveState();
        hapticFeedback(30);
    }

    function togglePlay() {
        if (STATE.isConnecting) return; // Block double-taps during connection
        if (!window.AnhadAudio) return;

        if (STATE.isPlaying) {
            // Currently playing → pause in-place
            STATE.isPlaying = false;
            STATE.isConnecting = false;
            LIVE_UI.pausedAt = isVirtualStream() ? Date.now() : 0;
            updateUI();
            window.AnhadAudio.pause();
            hapticFeedback(30);
        } else {
            // Paused → resume in-place (NO re-sync to live position)
            // Use resumeInPlace() so Play/Pause feels instant and doesn't jump position.
            // The separate LIVE button is responsible for re-syncing to live.
            const audio = getAudio();
            const st = window.AnhadAudio.getState?.();
            if (!audio || !audio.src || st?.currentStream !== STATE.currentStream) {
                window.AnhadAudio.play(STATE.currentStream);
            } else {
                window.AnhadAudio.resumeInPlace();
            }
            hapticFeedback(50);
        }
    }

    function nextTrack() {
        if (!window.AnhadAudio) return;
        if (STATE.currentStream === 'darbar') {
            window.AnhadAudio.jumpToLive();
        } else {
            window.AnhadAudio.playNextTrack();
        }
        hapticFeedback(40);
    }

    function prevTrack() {
        if (!window.AnhadAudio) return;
        if (STATE.currentStream === 'darbar') {
            window.AnhadAudio.jumpToLive();
        } else {
            // For Amritvela, just re-sync to live (singleton handles track navigation)
            window.AnhadAudio.jumpToLive();
        }
        hapticFeedback(40);
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // ERROR HANDLING - Improved with R2 unavailable detection
    // ═══════════════════════════════════════════════════════════════════════════════
    
    function handlePlaybackError(err) {
        STATE.lastError = err;
        STATE.retryCount++;
        
        let title = 'Connection Error';
        let message = 'Unable to connect to stream';
        let retryDelay = Math.min(3000 * STATE.retryCount, 15000);
        let isFatal = false;
        
        if (err.name === 'NotAllowedError') {
            title = 'Tap to Play';
            message = 'Please tap the play button to start audio';
            retryDelay = 0;
        } else if (err.name === 'NotSupportedError' || err.message?.includes('no supported source')) {
            // Audio format not supported or file unavailable
            title = 'Audio Unavailable';
            message = 'The audio files are temporarily unavailable. Please try again later.';
            isFatal = true;
            retryDelay = 0;
        } else if (err.message?.includes('503') || err.message?.includes('NetworkError')) {
            title = 'Server Unavailable';
            message = 'The audio service is temporarily down. Please try again later.';
            isFatal = true;
            retryDelay = 0;
        } else if (STATE.retryCount > 3) {
            // Stop retrying after 3 attempts
            title = 'Connection Failed';
            message = 'Unable to connect after multiple attempts. Please check your connection and try again.';
            isFatal = true;
            retryDelay = 0;
        }
        
        showError(title, message, !isFatal);
        
        // Only retry if not fatal and within retry limit
        if (retryDelay > 0 && STATE.retryCount <= STATE.maxRetries && !isFatal) {
            showStatus(`Retrying in ${Math.ceil(retryDelay/1000)}s...`);
            setTimeout(() => {
                if (!STATE.isPlaying && STATE.retryCount <= STATE.maxRetries) {
                    play();
                }
            }, retryDelay);
        } else if (isFatal) {
            // Reset retry count so user can manually retry later
            STATE.retryCount = 0;
            showStatus('Tap Retry to try again');
        }
        
        updateUI();
    }

    function showError(title, message, showRetry = true) {
        dom.errorTitle.textContent = title;
        dom.errorMessage.textContent = message;
        dom.errorRetryBtn.style.display = showRetry ? 'block' : 'none';
        dom.errorToast.classList.add('visible');
        dom.statusDot.classList.add('error');
        
        setTimeout(() => hideError(), 8000);
    }

    function hideError() {
        dom.errorToast.classList.remove('visible');
        dom.statusDot.classList.remove('error');
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // UI UPDATES
    // ═══════════════════════════════════════════════════════════════════════════════
    
    function updateUI() {
        // Play button
        if (STATE.isPlaying) {
            dom.playIcon.classList.remove('fa-play');
            dom.playIcon.classList.add('fa-pause');
            dom.artworkContainer.classList.add('playing');
            dom.player.classList.remove('paused');
            
            // Make Darbar live badge blink when playing
            if (STATE.currentStream === 'darbar') {
                const dot = document.getElementById('liveLabelDot');
                if (dot) dot.classList.add('pulsing');
            }
            if (isVirtualStream() && !LIVE_UI.anchorWallTime) markLiveAnchor();
        } else {
            dom.playIcon.classList.remove('fa-pause');
            dom.playIcon.classList.add('fa-play');
            dom.artworkContainer.classList.remove('playing');
            dom.player.classList.add('paused');
            
            // Stop blinking when paused
            if (STATE.currentStream === 'darbar') {
                const dot = document.getElementById('liveLabelDot');
                if (dot) dot.classList.remove('pulsing');
            }
        }
        
        // Volume
        const audio = getAudio();
        if (audio) audio.volume = STATE.volume;
        dom.volumeFill.style.width = (STATE.volume * 100) + '%';
        dom.volumeInput.value = STATE.volume * 100;
    }

    function showStatus(text) {
        dom.statusText.textContent = text;
        dom.statusPill.classList.add('visible');
    }

    function hideStatus() {
        dom.statusPill.classList.remove('visible');
    }

    function updateElapsedTime() {
        const audio = getAudio();
        if (!audio || !STATE.isPlaying) return;
        
        const elapsed = Math.floor(audio.currentTime);
        const mins = Math.floor(elapsed / 60);
        const secs = elapsed % 60;
        dom.elapsedTime.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // THEME
    // ═══════════════════════════════════════════════════════════════════════════════
    
    function initTheme() {
        // Use global AnhadTheme system - applies theme from localStorage
        const theme = AnhadTheme.get();
        updateThemeUI(theme);
        
        // Listen for theme changes from other pages
        window.addEventListener('themechange', (e) => {
            updateThemeUI(e.detail.theme);
        });
    }

    function updateThemeUI(theme) {
        if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            document.body.classList.add('light-theme');
            dom.themeIcon.className = 'fas fa-moon';
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.body.classList.remove('light-theme');
            dom.themeIcon.className = 'fas fa-sun';
        }
        
        // Re-render stream UI to instantly swap images
        if (STATE && STATE.currentStream) {
            updateStreamUI(STATE.currentStream);
        }
    }

    function toggleTheme() {
        const newTheme = AnhadTheme.toggle();
        updateThemeUI(newTheme);
        hapticFeedback(30);
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // HAPTIC FEEDBACK
    // ═══════════════════════════════════════════════════════════════════════════════
    
    function hapticFeedback(pattern) {
        if (navigator.vibrate) {
            navigator.vibrate(pattern);
        }
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // STATE PERSISTENCE
    // ═══════════════════════════════════════════════════════════════════════════════
    
    function saveState() {
        try {
            localStorage.setItem('gurbani_radio_state', JSON.stringify({
                stream: STATE.currentStream,
                isPlaying: STATE.isPlaying,
                volume: STATE.volume,
                trackIndex: STATE.currentTrackIndex,
                timestamp: Date.now()
            }));
        } catch (e) {}
    }

    function loadState() {
        try {
            const saved = localStorage.getItem('gurbani_radio_state');
            if (saved) {
                const state = JSON.parse(saved);
                STATE.volume = state.volume || 0.7;
                if (state.stream && STREAMS[state.stream]) {
                    STATE.currentStream = state.stream;
                    STATE.currentTrackIndex = state.trackIndex || 0;
                    STATE.isPlaying = false;
                }
            }
        } catch (e) {}
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // EVENT LISTENERS
    // ═══════════════════════════════════════════════════════════════════════════════
    
    function initEventListeners() {
        // Stream switcher
        dom.btnDarbar.addEventListener('click', () => switchStream('darbar'));
        dom.btnAmritvela.addEventListener('click', () => switchStream('amritvela'));
        dom.btnSimran.addEventListener('click', () => switchStream('simran'));
        dom.simranSwitch.addEventListener('click', toggleSimranSwitch);
        
        // Controls
        dom.playBtn.addEventListener('click', togglePlay);

        // LIVE button — jumps to live server position (re-sync)
        if (dom.liveJumpBtn) {
            dom.liveJumpBtn.addEventListener('click', () => {
                if (!window.AnhadAudio) return;
                hapticFeedback(40);
                const dot = dom.liveJumpBtn.querySelector('.live-jump-dot');
                dom.liveJumpBtn.classList.add('pulsing');
                if (dot) dot.classList.add('pulsing');
                window.AnhadAudio.jumpToLive().then(() => {
                    requestLiveAnchor();
                    updateLiveButtonState(true);
                    dom.liveJumpBtn.classList.remove('pulsing');
                    if (dot) dot.classList.remove('pulsing');
                }).catch(() => {
                    dom.liveJumpBtn.classList.remove('pulsing');
                    if (dot) dot.classList.remove('pulsing');
                });
                showStatus('Syncing to live position...');
                setTimeout(hideStatus, 3000);
            });
        }
        
        // Listen for live position sync status
        window.addEventListener('anhadLiveSyncStatus', (e) => {
            const { isAtLiveEdge } = e.detail;
            if (dom.liveJumpBtn) {
                if (isAtLiveEdge) {
                    requestLiveAnchor();
                    updateLiveButtonState(true);
                } else {
                    updateLiveButtonState();
                }
            }
        });
        
        // Volume
        dom.volumeInput.addEventListener('input', (e) => {
            STATE.volume = e.target.value / 100;
            if (window.AnhadAudio) window.AnhadAudio.setVolume(STATE.volume);
            updateUI();
            saveState();
        });
        
        // Theme
        dom.themeBtn.addEventListener('click', toggleTheme);
        
        // Back button is auto-wired by smart-back.js to ../index.html
        
        // Error retry
        dom.errorRetryBtn.addEventListener('click', () => {
            hideError();
            STATE.retryCount = 0;
            play();
        });
        
        // ── Audio Singleton UI Sync ──
        window.addEventListener('anhadAudioStateChange', (e) => {
            STATE.isPlaying = e.detail.isPlaying;
            if (e.detail.stream) STATE.currentStream = e.detail.stream;
            updateUI();
            
            if (STATE.isPlaying) {
                if (STATE.currentStream === 'darbar') {
                    showStatus('Connected • Darbar Sahib Live');
                } else {
                    showStatus(`Playing • ${STATE.currentStream === 'amritvela' ? 'Amritvela' : 'Simran'}`);
                }
                setTimeout(hideStatus, 3000);
            }
        });

        // ── Track title/subtitle update (Simran actual track name) ──
        window.addEventListener('anhadTrackChanged', (e) => {
            const { stream, trackTitle, trackArtist } = e.detail;
            if (stream !== STATE.currentStream) return;
            const sub = document.getElementById('trackSubtitle');

            if (stream === 'simran') {
                dom.trackTitle.textContent = 'Waheguru Simran';
                if (sub) {
                    sub.textContent = trackTitle || '';
                    sub.style.display = trackTitle ? 'block' : 'none';
                }
                dom.trackArtist.textContent = trackArtist || 'Amritvela Trust';
            } else if (stream === 'amritvela') {
                dom.trackTitle.textContent = 'Amritvela Kirtan';
                if (sub) sub.style.display = 'none';
                dom.trackArtist.textContent = trackArtist || 'Divine Shabad';
            }
        });

        // Use global AnhadAudio methods for time/error if available
        if (window.AnhadAudio) {
            window.AnhadAudio.on('loading', (e) => {
                if (e.isLoading) showStatus('Buffering...');
                else hideStatus();
            });
            window.AnhadAudio.on('error', (e) => {
                handlePlaybackError(new Error(e.message || 'Stream error'));
            });
            window.AnhadAudio.on('timeupdate', (e) => {
                if (!STATE.isPlaying) return;
                const mins = Math.floor(e.currentTime / 60);
                const secs = Math.floor(e.currentTime % 60);
                dom.elapsedTime.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            });
        }
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                STATE.volume = Math.min(1, STATE.volume + 0.1);
                updateUI();
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                STATE.volume = Math.max(0, STATE.volume - 0.1);
                updateUI();
            } else if (e.key === 'l' || e.key === 'L') {
                window.AnhadAudio?.jumpToLive?.();
            }
        });
        
        // Visibility change - DON'T resync on return, just update UI
        // The audio singleton continues playing in background automatically
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && STATE.isPlaying) {
                // Just refresh the UI state from the singleton
                const st = window.AnhadAudio?.getState?.();
                if (st) {
                    STATE.isPlaying = st.isPlaying;
                    STATE.currentTrackIndex = st.currentTrackIndex;
                    updateUI();
                }
            }
        });
        
        // Before unload
        window.addEventListener('beforeunload', saveState);
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // LIGHTWEIGHT TRACK-ONLY SYNC (for polling - no position jumps during playback)
    // ═══════════════════════════════════════════════════════════════════════════════
    
    async function checkTrackSync() {
        // Lightweight check — only update UI metadata, never restart playback
        // The audio singleton handles track transitions internally
        const st = window.AnhadAudio?.getState?.();
        if (!st || !STATE.isPlaying) return;
        
        // Just sync UI state with singleton
        if (st.currentTrackIndex !== STATE.currentTrackIndex) {
            STATE.currentTrackIndex = st.currentTrackIndex;
            console.log(`[GR] UI track sync: now showing track ${STATE.currentTrackIndex + 1}`);
        }
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════════════════════════
    
    function init() {
        loadState();
        try { localStorage.setItem('anhad_gurbani_radio_last_opened', String(Date.now())); } catch (e) {}
        initTheme();
        initEventListeners();

        // REMOVED: AudioCoordinator registration - singleton handles coordination

        // Subscribe to singleton events for UI sync
        if (window.AnhadAudio) {
            window.AnhadAudio.on('statechange', (audioState) => {
                // Synchronize playing state immediately to avoid icon mismatch
                STATE.isPlaying = audioState.isPlaying;
                if (audioState.currentStream && STREAMS[audioState.currentStream]) {
                    STATE.currentStream = audioState.currentStream;
                    updateStreamUI(STATE.currentStream);
                }
                STATE.currentTrackIndex = audioState.currentTrackIndex;
                if (audioState.isPlaying) STATE.isConnecting = false;
                if (audioState.isPlaying && isVirtualStream(audioState.currentStream)) {
                    if (!LIVE_UI.anchorWallTime) {
                        requestLiveAnchor();
                    }
                    if (LIVE_UI.pausedAt) {
                        LIVE_UI.pausedAt = 0;
                    }
                }
                updateUI();
            });

            window.AnhadAudio.on('loading', (data) => {
                STATE.isConnecting = data.isLoading;
                if (dom.playBtn) {
                    dom.playBtn.classList.toggle('loading', data.isLoading);
                }
            });

            window.AnhadAudio.on('timeupdate', (data) => {
                if (data && data.currentTime !== undefined) {
                    const mins = Math.floor(data.currentTime / 60);
                    const secs = Math.floor(data.currentTime % 60);
                    dom.elapsedTime.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
                    if (LIVE_UI.pendingAnchor && isVirtualStream() && STATE.isPlaying) {
                        markLiveAnchor();
                    }
                    updateLiveButtonState();
                }
            });

            window.AnhadAudio.on('error', (data) => {
                // Singleton already auto-retries errors internally (up to 3 times).
                // DO NOT call play() or handlePlaybackError here — that would cause a reload loop.
                // Just update the UI to show the error state.
                const msg = data?.message || 'Audio playback error';
                console.warn('[Gurbani Radio] Audio error (singleton):', msg);
                STATE.isPlaying = false;
                STATE.isConnecting = false;
                updateUI();
                // Only show error if singleton has given up retrying
                if (msg.toLowerCase().includes('code 2') || msg.toLowerCase().includes('code 3') || msg.toLowerCase().includes('code 4')) {
                    showError('Stream Unavailable', 'Please check your connection and tap Retry', true);
                }
            });

            console.log('[Gurbani Radio] Subscribed to AnhadAudio events');
        }
        
        // Force show mini player on this page
        setTimeout(() => {
            const gmpElement = document.getElementById('gmp');
            console.log('[Gurbani Radio] Mini player element exists:', !!gmpElement);
            if (gmpElement) {
                console.log('[Gurbani Radio] Mini player classes:', gmpElement.className);
                gmpElement.classList.add('gmp--visible');
                console.log('[Gurbani Radio] Forced mini player to show');
            } else {
                console.log('[Gurbani Radio] Mini player element not found in DOM');
            }
            
            if (window.GlobalMiniPlayer) {
                console.log('[Gurbani Radio] GlobalMiniPlayer available, stream:', window.GlobalMiniPlayer.getStream());
                window.GlobalMiniPlayer.show();
            } else {
                console.log('[Gurbani Radio] GlobalMiniPlayer not available');
            }
        }, 1500);
        
        // Continuous polling - only check for track changes, not position
        // Position only jumps when user explicitly plays (pure virtual live)
        setInterval(() => {
            if (STATE.isPlaying && (STATE.currentStream === 'amritvela' || STATE.currentStream === 'simran') && !document.hidden && Date.now() - STATE.lastTrackSyncAt > 30000) {
                STATE.lastTrackSyncAt = Date.now();
                checkTrackSync(); // Lightweight track-only check
            }
            updateLiveButtonState();
        }, 1000); // Keep LIVE state and track metadata fresh without resyncing
        
        // Check URL params for stream selection
        const urlParams = new URLSearchParams(window.location.search);
        const streamParam = urlParams.get('stream');
        if (streamParam && STREAMS[streamParam]) {
            STATE.currentStream = streamParam;
        }
        
        // Apply initial stream UI
        updateStreamUI(STATE.currentStream);
        updateUI();
        
        // Initial connection overlay text
        dom.connectingStream.textContent = STREAMS[STATE.currentStream].name;
        
        // Auto-resume or Autoplay
        const autoplay = urlParams.get('autoplay') === 'true';
        if (autoplay) {
            console.log('[Gurbani Radio] Autoplay requested via URL param');
            STATE.isPlaying = true; // Set playing state
            updateUI();
            // Short delay to ensure everything is ready
            setTimeout(() => {
                play();
            }, 600);
        } else if (streamParam || STATE.isPlaying) {
            const reason = streamParam ? `stream param (${STATE.currentStream})` : 'previous session';
            console.log('[Gurbani Radio] Ready for user tap, pre-loaded for', reason);
            // UI is already set up correctly — user just needs to tap ▶ to play
            STATE.isPlaying = false;
            updateUI();
        } else {
            console.log('[Gurbani Radio] Waiting for user to press play');
        }


        
        console.log('🪯 Gurbani Radio - Extreme Claymorphism Edition');
        console.log('💡 Space=Play/Pause, ↑↓=Volume, L=Live/Resync');
    }

    // Start
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
    </script>

    <!-- iOS Ambient Color Engine -->
    <script>
    (function() {
        'use strict';

        const canvas = document.getElementById('colorCanvas');
        const ctx = canvas ? canvas.getContext('2d',{willReadFrequently:true}) : null;
        const o1 = document.getElementById('bloomO1');
        const o2 = document.getElementById('bloomO2');
        const o3 = document.getElementById('bloomO3');
        const glow = document.getElementById('artworkGlow');
        const miniEq = document.getElementById('miniEq');
        const bgNight = document.getElementById('bgDarbar');
        const bgDay = document.getElementById('bgDay');

        // ── Color extraction from artwork ──
        function extractPalette(imgEl) {
            if (!ctx || !imgEl || !imgEl.complete || !imgEl.naturalWidth) return null;
            try {
                canvas.width = 12; canvas.height = 12;
                ctx.drawImage(imgEl, 0, 0, 12, 12);
                const d = ctx.getImageData(0, 0, 12, 12).data;
                function px(x,y){ const i=(y*12+x)*4; return [d[i],d[i+1],d[i+2]]; }
                // vivid top-left, mid-right, bottom-center
                const c1 = px(2,2), c2 = px(9,6), c3 = px(5,10);
                // boost saturation slightly
                function boost(c){ return c.map((v,i)=> i<3?Math.min(255,v*1.15|0):v); }
                return [boost(c1), boost(c2), boost(c3)];
            } catch(e){ return null; }
        }

        function applyPalette(imgEl) {
            const pal = extractPalette(imgEl);
            if (!pal) return;
            const [c1,c2,c3] = pal;
            const b1 = `rgba(${c1[0]},${c1[1]},${c1[2]},.65)`;
            const b2 = `rgba(${c2[0]},${c2[1]},${c2[2]},.55)`;
            const b3 = `rgba(${c3[0]},${c3[1]},${c3[2]},.45)`;
            document.documentElement.style.setProperty('--bloom1',b1);
            document.documentElement.style.setProperty('--bloom2',b2);
            document.documentElement.style.setProperty('--bloom3',b3);
            if(o1) o1.style.background=b1;
            if(o2) o2.style.background=b2;
            if(o3) o3.style.background=b3;
            if(glow) glow.style.background=b1;
        }

        // ── Background crossfade on stream/theme change ──
        function swapBg(src) {
            if (!bgNight) return;
            bgNight.style.transition='opacity .9s ease';
            bgNight.style.opacity='0';
            setTimeout(()=>{
                bgNight.src = src;
                bgNight.onload = ()=>{ bgNight.style.opacity='1'; };
                bgNight.style.opacity='1';
            }, 350);
        }

        // ── Theme-aware bg: disabled old opacity toggling, now relying on displayImage ──
        function applyThemeBg() {
            if (bgDay) bgDay.style.display = 'none';
            if (bgNight) {
                bgNight.style.opacity = '1';
            }
        }

        // ── Artwork crossfade + color update on stream switch ──
        function updateAmbient(imgSrc) {
            const artImg = document.getElementById('artworkImg');
            if (!artImg) return;
            
            // Only crossfade if the image is actually changing
            if (artImg.src.endsWith(imgSrc.replace('../', '')) || artImg.getAttribute('src') === imgSrc) {
                applyPalette(artImg); // Just apply palette if image hasn't changed
                return;
            }

            artImg.classList.add('xfade');
            setTimeout(()=>{
                artImg.src = imgSrc;
                swapBg(imgSrc);
                artImg.onload = ()=>{
                    artImg.classList.remove('xfade');
                    applyPalette(artImg);
                };
                artImg.onerror = ()=> artImg.classList.remove('xfade');
            }, 220);
        }

        // ── Hook updateStreamUI (defined in inline script above) ──
        function patchStreamUI() {
            if (typeof updateStreamUI === 'function') {
                const _orig = updateStreamUI;
                window.updateStreamUI = function(st) {
                    _orig(st);
                    if (typeof STREAMS!=='undefined' && STREAMS[st]) {
                        const stream = STREAMS[st];
                        const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
                        const displayImage = (currentTheme === 'light' && stream.lightImage) ? stream.lightImage : stream.image;
                        updateAmbient(displayImage);
                    }
                };
                return true;
            }
            return false;
        }

        // ── Mini EQ sync with play state ──
        function syncMiniEq() {
            if (!miniEq) return;
            const paused = document.getElementById('player')?.classList.contains('paused');
            miniEq.classList.toggle('playing', !paused);
        }

        // Observe player class
        const playerEl = document.getElementById('player');
        if (playerEl && window.MutationObserver) {
            new MutationObserver(syncMiniEq).observe(playerEl,{attributes:true,attributeFilter:['class']});
        }
        document.getElementById('playBtn')?.addEventListener('click',()=>setTimeout(syncMiniEq,250));

        // Observe theme changes
        if (window.MutationObserver) {
            new MutationObserver(applyThemeBg).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
        }

        function init() {
            applyThemeBg();
            const artImg = document.getElementById('artworkImg');
            if (artImg?.complete && artImg.naturalWidth) applyPalette(artImg);
            else artImg?.addEventListener('load',()=>applyPalette(artImg),{once:true});
            if (!patchStreamUI()) {
                let t=0; const p=setInterval(()=>{ if(patchStreamUI()||++t>25) clearInterval(p); },200);
            }
        }

        if (document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
        else init();
    })();
    </script>
</body>
</html>
