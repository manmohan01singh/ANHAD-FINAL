<!DOCTYPE html>
<html lang="pa">
<head>
  <script src="../lib/global-theme.js"></script>
  <!-- Force latest SW to take control immediately -->
  <script>
  (function() {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistration().then(function(reg) {
        if (!reg) return;
        // If a new SW is waiting, send SKIP_WAITING to activate it now
        if (reg.waiting) {
          reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        }
        // Also trigger an update check so new SW downloads
        reg.update().catch(function(){});
        // When controllerchange fires (new SW took over), reload to get fresh files
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          window.location.reload();
        });
      }).catch(function(){});
    }
  })();
  </script>
  <script>
  (function() {
    try {
      var isDark = window.AnhadTheme ? window.AnhadTheme.isDark() : false;
      var theme = isDark ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.backgroundColor = isDark ? '#0A0A0C' : '#FAF8F5';
    } catch(e) {}
  })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FAF8F5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Gurbani Radio — Live Kirtan, Nitnem & Simran. ANHAD App.">
  <title>ਗੁਰਬਾਣੀ ਰੇਡੀਓ | Gurbani Radio — ANHAD</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+Gurmukhi:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="../css/anhad-core.css">
  <link rel="stylesheet" href="gurbani-radio.css">

  <!-- Core Scripts -->
  <script src="../lib/smart-back.js"></script>
  <script src="../lib/naam-abhyas-manager.js"></script>
  <script src="../lib/anhad-audio-singleton.js"></script>
</head>
<body>

<div class="app" id="radioApp">
  <!-- Top Navigation Bar -->
  <nav class="gr-nav">
    <button class="gr-icon-btn back-btn" id="grBackBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <div class="gr-title">
      <div class="gr-ik-onkar">ੴ</div>
      <div class="gr-title-main">Gurbani Radio</div>
    </div>
    <button class="gr-icon-btn settings-btn" id="grSettingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </nav>

  <!-- Stream Selector Tabs -->
  <div class="gr-tabs" data-active="0">
    <div class="gr-tabs-slider" id="grTabsSlider"></div>
    <button class="gr-tab active" data-stream="darbar" id="tabLive">
      <svg class="gr-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="2"/>
        <path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/>
      </svg>
      Live
    </button>
    <button class="gr-tab" data-stream="amritvela" id="tabKirtan">
      <svg class="gr-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
      </svg>
      Kirtan
    </button>
    <button class="gr-tab" data-stream="simran" id="tabSimran">
      <svg class="gr-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
      </svg>
      Simran
    </button>
  </div>

  <!-- Main Player Card -->
  <div class="gr-card-wrapper">
    <div class="gr-card">
      <div class="gr-card-media">
        <img id="grCoverImg" src="../assets/darbar-sahib-evening.webp" alt="Darbar Sahib" class="gr-cover-img">
        <div class="gr-badge-live" id="grBadgeLive">
          <span class="gr-live-dot"></span>
          LIVE
        </div>
        <button class="gr-favorite-btn" id="grFavoriteBtn" aria-label="Favorite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </button>
      </div>

      <div class="gr-info">
        <div class="gr-info-title-row">
          <h2 class="gr-track-title" id="grTrackTitle">Darbar Sahib Live</h2>
          <!-- Audio Wave Visualizer icon -->
          <div class="gr-wave-icon" id="grWaveIcon">
            <span class="bar bar-1"></span>
            <span class="bar bar-2"></span>
            <span class="bar bar-3"></span>
          </div>
        </div>
        <p class="gr-track-artist" id="grTrackArtist">Sri Harmandir Sahib Ji, Amritsar</p>
        <div class="gr-pill-location" id="grPillLocation">
          <span class="gr-pill-dot"></span>
          <span id="grPillLocationText">Live from Amritsar</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Audio Playback Info Banner -->
  <div class="gr-listening-banner">
    <div class="gr-listening-status">
      <svg class="gr-listening-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
      </svg>
      <span>You are listening</span>
      <span class="gr-listening-dot"></span>
      <span class="gr-listening-live" id="grListeningLiveText">LIVE</span>
    </div>
    <div class="gr-listening-time-badge" id="grListeningTimeBadge">00:00</div>
  </div>

  <!-- Playback Control Center -->
  <div class="gr-controls-section">
    <!-- Slider Timeline -->
    <div class="gr-timeline">
      <span class="gr-time-current" id="grTimeCurrent">00:00</span>
      <div class="gr-slider-container" id="grSliderContainer">
        <div class="gr-slider-track">
          <div class="gr-slider-fill" id="grSliderFill"></div>
        </div>
        <div class="gr-slider-handle" id="grSliderHandle"></div>
      </div>
      <span class="gr-time-total" id="grTimeTotal">LIVE</span>
    </div>

    <!-- Conditional Jump to Live Button -->
    <div style="text-align: center; margin-top: -6px; margin-bottom: 2px;">
      <button class="gr-btn-jump-live" id="grBtnJumpLive" style="display: none;"></button>
    </div>

    <!-- Buttons Panel -->
    <div class="gr-controls-row">
      <!-- Skip Back 15s -->
      <button class="gr-ctrl-btn gr-btn-skip-back" id="grBtnSkipBack" aria-label="Rewind 15 seconds">
        <svg class="gr-ctrl-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        <span class="gr-skip-num">15</span>
      </button>

      <!-- Previous -->
      <button class="gr-ctrl-btn gr-btn-prev" id="grBtnPrev" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <polygon points="19 20 9 12 19 4 19 20"/>
          <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Main Play/Pause -->
      <button class="gr-play-btn" id="grPlayBtn" aria-label="Play">
        <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
          <rect x="6" y="4" width="4" height="16"/>
          <rect x="14" y="4" width="4" height="16"/>
        </svg>
      </button>

      <!-- Next -->
      <button class="gr-ctrl-btn gr-btn-next" id="grBtnNext" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 4 15 12 5 20 5 4"/>
          <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Skip Forward 15s -->
      <button class="gr-ctrl-btn gr-btn-skip-fwd" id="grBtnSkipFwd" aria-label="Fast forward 15 seconds">
        <svg class="gr-ctrl-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
        </svg>
        <span class="gr-skip-num">15</span>
      </button>
    </div>
  </div>

  <!-- Bottom Utility Panel -->
  <div class="gr-utility-panel">
    <button class="gr-util-item" id="btnSleepTimer">
      <div class="gr-util-icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </div>
      <span class="gr-util-label">Sleep Timer</span>
    </button>
    <button class="gr-util-item" id="btnAlarm">
      <div class="gr-util-icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9zm-4.27 13a2 2 0 0 1-3.46 0"/>
        </svg>
      </div>
      <span class="gr-util-label">Alarm</span>
    </button>
    <button class="gr-util-item" id="btnShare">
      <div class="gr-util-icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8m-4-6l-4-4-4 4m4-4v13"/>
        </svg>
      </div>
      <span class="gr-util-label">Share</span>
    </button>
    <!-- Gurbani Recorder Button -->
    <button class="gr-util-item" id="btnRecord">
      <div class="gr-util-icon-circle gr-record-circle" id="grRecordCircle">
        <span class="gr-record-dot"></span>
      </div>
      <span class="gr-util-label" id="grRecordLabel">Record</span>
    </button>
  </div>

  <!-- Sleep Timer overlay bottom sheet -->
  <div class="gr-sheet-overlay" id="sleepTimerSheet" style="display:none;">
    <div class="gr-sheet-backdrop" id="sleepTimerBackdrop"></div>
    <div class="gr-sheet">
      <div class="gr-sheet-handle"></div>
      <h3 class="gr-sheet-title">Sleep Timer</h3>
      <div class="gr-sheet-options">
        <button class="gr-sheet-opt" data-mins="15">15 Minutes</button>
        <button class="gr-sheet-opt" data-mins="30">30 Minutes</button>
        <button class="gr-sheet-opt" data-mins="45">45 Minutes</button>
        <button class="gr-sheet-opt" data-mins="60">1 Hour</button>
        <button class="gr-sheet-opt active" data-mins="0">Off</button>
      </div>
    </div>
  </div>

  <!-- Alarm Sheet overlay bottom sheet -->
  <div class="gr-sheet-overlay" id="alarmSheet" style="display:none;">
    <div class="gr-sheet-backdrop" id="alarmBackdrop"></div>
    <div class="gr-sheet">
      <div class="gr-sheet-handle"></div>
      <h3 class="gr-sheet-title">Set Daily Gurbani Alarm</h3>
      <div style="padding: 16px 20px 28px 20px; display: flex; flex-direction: column; gap: 18px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-weight: 600; font-size: 15px; color: var(--text-prime);">Enable Alarm</span>
          <input type="checkbox" id="alarmEnabled" style="width: 22px; height: 22px; accent-color: var(--accent-gold); cursor: pointer;">
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-weight: 600; font-size: 15px; color: var(--text-prime);">Alarm Time</span>
          <input type="time" id="alarmTime" value="04:30" style="padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-color); font-family: inherit; font-size: 16px; font-weight: 600; background: var(--bg-card); color: var(--text-prime); outline: none;">
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-weight: 600; font-size: 15px; color: var(--text-prime);">Select Stream</span>
          <select id="alarmStream" style="padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-color); font-family: inherit; font-size: 15px; font-weight: 600; background: var(--bg-card); color: var(--text-prime); outline: none; cursor: pointer;">
            <option value="darbar">Darbar Sahib Live</option>
            <option value="amritvela">Amritvela Kirtan</option>
            <option value="simran">Waheguru Simran</option>
          </select>
        </div>
        <button class="gr-sheet-opt active" id="btnSaveAlarm" style="width: 100%; border-radius: 20px; margin-top: 14px; padding: 12px 0; border: none; font-size: 15px; font-weight: 700; cursor: pointer; text-align: center;">Save Alarm</button>
      </div>
    </div>
  </div>

  <!-- Toast system -->
  <div class="gr-toast" id="grToast"></div>
</div>

<!-- Global Notification Engine -->
<script src="../lib/capacitor-notifications-global.js" defer></script>

<!-- Gurbani Radio Logic -->
<script src="gurbani-radio.js"></script>

<!-- Stream Library (custom slots + all streams) -->
<script src="stream-library.js"></script>

</body>
</html>
