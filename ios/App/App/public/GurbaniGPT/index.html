<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <title>ANHAD — Gurbani Companion</title>
  <meta name="description" content="ANHAD Gurbani Companion — a spiritual AI companion for Naam Simran and Gurmat practice.">
  <meta name="theme-color" content="#0c0a09">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="../favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gurmukhi:wght@400;500;600;700&display=optional" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<script>
(function(){
  var t = localStorage.getItem('gpt_theme');
  if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.body.classList.add(t === 'dark' ? 'dark' : 'light');
})();
</script>

<div class="wrapper">

  <div class="bg-texture"></div>
  <div class="net-badge" id="netBadge">No internet</div>
  <div class="toast" id="toast"></div>
  <div class="drawer-ov" id="drawOv"></div>

  <!-- ── WELCOME ── -->
  <div class="welcome" id="welcome">
    <div class="welcome-icon">&#x0F4A;</div>
    <h1 class="welcome-brand" id="welcomeBack"></h1>
    <p class="welcome-subtitle" id="welcomeSub">Ask anything about Naam Simran, Gurbani, or the spiritual path.</p>
    <div class="chips-grid">
      <button class="chip" data-prompt="What is Naam Simran?">What is Naam Simran?</button>
      <button class="chip" data-prompt="How do I control my mind?">How do I control my mind?</button>
      <button class="chip" data-prompt="Tell me about Hukam">Tell me about Hukam</button>
    </div>
  </div>

  <!-- ── MESSAGES ── -->
  <div class="msgs" id="msgs">
    <div class="msg-list" id="msgList"></div>
    <button class="scroll-nudge" id="scrollNudge">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
  </div>

  <!-- ── DIVIDER ── -->
  <div class="new-convo-row" id="newConvoRow">
    <div class="new-convo-inner">
      <span class="new-convo-line"></span>
      <span class="new-convo-label">Today</span>
      <span class="new-convo-line"></span>
    </div>
  </div>

  <!-- ── COMPOSER ── -->
  <div class="composer" id="composer">
    <div class="composer-inner">
      <div class="inp-wrap">
        <textarea class="composer-inp" id="inp" placeholder="Ask about Simran, Gurbani, the path..." rows="1" maxlength="2000" autofocus></textarea>
        <span class="char-count" id="charCount"></span>
      </div>
      <button class="composer-send" id="sendBtn" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
      <button class="composer-stop" id="stopBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      </button>
    </div>
  </div>

  <!-- ── DRAWER ── -->
  <div class="drawer" id="drawer">
    <div class="drawer-inner">
      <div class="drawer-hdr">
        <span class="drawer-symbol">&#x0F4A;</span>
        <span class="drawer-title">MENU</span>
        <button class="drawer-close" id="drawerClose">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div style="flex:1;overflow-y:auto;padding:4px 0">
        <!-- GROQ API key (advanced) -->
        <div class="drawer-section">
          <div class="drawer-label">API Key <span style="opacity:.4;font-size:11px">(optional — advanced)</span></div>
          <div class="api-key-row">
            <input class="drawer-api-input" id="apiKeyInput" type="password" placeholder="gsk_..." spellcheck="false" autocomplete="off">
            <button class="drawer-api-save" id="apiKeySaveBtn">Save</button>
          </div>
          <div class="drawer-api-status" id="apiKeyStatus"></div>
        </div>
        <!-- Memory stats -->
        <div class="drawer-section">
          <div class="drawer-label">Journey</div>
          <div class="drawer-memory-stats" id="memoryStats"></div>
          <div class="drawer-timeline" id="journeyTimeline"></div>
          <button class="drawer-memory-reset" id="memoryResetBtn" style="margin-top:8px;width:100%">Reset Memory</button>
        </div>
        <!-- New conversation -->
        <button class="drawer-new" id="drawerNew">New Conversation</button>
      </div>
    </div>
  </div>

  <!-- ── MISC ── -->
  <button class="hdr-btn" id="menuBtn" aria-label="Menu">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
  </button>
  <div class="hdr">
    <span class="hdr-symbol">&#x0F4A;</span>
    <span class="hdr-title">ANHAD</span>
  </div>

</div>

<script type="module" src="app.js?v=3"></script>
</body>
</html>
