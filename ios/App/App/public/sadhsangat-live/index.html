              </div>
              <div style="display:flex; align-items:center; gap:4px;">
                <span style="color:var(--text-muted);">Sleep:</span>
                <select id="playerSleepTimer" style="background:var(--card-bg); border:var(--card-border); border-radius:10px; padding:4px 6px; color:var(--text); font-weight:700; font-size:12px; outline:none; box-shadow:var(--card-shadow);">
                  <option value="0">Off</option>
                  <option value="15">15 mins</option>
                  <option value="30">30 mins</option>
                  <option value="45">45 mins</option>
                  <option value="60">60 mins</option>
                </select>
              </div>
            </div>
            
            <div style="display:flex; align-items:center; gap:6px;">
              <button id="playerAudioToggleBtn" style="background:var(--card-bg); border:var(--card-border); border-radius:12px; padding:6px 10px; color:var(--text); font-weight:700; display:flex; align-items:center; gap:4px; cursor:pointer; box-shadow:var(--card-shadow); font-size:12px;">
                🎧 Audio
              </button>
              <button id="playerFullscreenBtn" style="background:var(--card-bg); border:var(--card-border); border-radius:12px; padding:6px 10px; color:var(--text); font-weight:700; display:flex; align-items:center; gap:4px; cursor:pointer; box-shadow:var(--card-shadow); font-size:12px;">
                <svg id="fullscreenIconSvg" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                Full
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Mini player controls (Visible only when minimized) -->
      <div class="player-mini-controls" id="playerMiniControls" style="display:none; align-items:center; justify-content:space-between; width:100%; height:100%; padding-left:106px;">
        <div style="flex:1; min-width:0; padding-right:12px;">
          <div id="playerMiniTitle" style="font-size:13.5px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Video Title</div>
          <div id="playerMiniChannel" style="font-size:11.5px; font-weight:600; color:var(--gold); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;">Channel Name</div>
        </div>
        <div style="display:flex; align-items:center; gap:16px; flex-shrink:0;">
          <button id="playerMiniPlayPauseBtn" style="background:none; border:none; color:var(--text); font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center;">
            <svg id="playIconSvgMini" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <svg id="pauseIconSvgMini" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          </button>
          <button id="playerMiniCloseBtn" style="background:none; border:none; color:var(--red-live); font-size:22px; cursor:pointer; font-weight:700; display:flex; align-items:center; justify-content:center;">✕</button>
        </div>
      </div>

    </div>
  </div>

  <div class="toast" id="toastEl"></div>

<script>
(function(){
  'use strict';

  /* ── VIEW / DOM HELPERS ────────────────────────────── */
  const $ = id => document.getElementById(id);
  const CE = tag => document.createElement(tag);

  function showToast(msg, duration = 3000) {
    const el = $('toastEl');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), duration);
  }

  function getWatchUrl(ch) {
    if (ch.watchUrl && !ch.watchUrl.includes('dQw4w9WgXcQ')) return ch.watchUrl;
    if (ch.videoId) return `https://www.youtube.com/watch?v=${ch.videoId}`;
    if (ch.channelHandle) return `https://www.youtube.com/${ch.channelHandle}/live`;
    if (ch.channelId && !ch.channelId.startsWith('HANDLE_')) {
      return `https://www.youtube.com/channel/${ch.channelId}/live`;
    }
    return '#';
  }

  function getChannelBaseUrl(ch, section = '') {
    const base = ch.channelHandle
      ? `https://www.youtube.com/${ch.channelHandle}`
      : `https://www.youtube.com/channel/${ch.channelId}`;
    const mapping = { videos: '/videos', playlists: '/playlists', posts: '/community' };
    return base + (mapping[section] || '');
  }

  function getInitials(name) {
    return (name || '?').charAt(0).toUpperCase();
  }

  /* ── STATE MANAGEMENT ──────────────────────────────── */
  let State = {
    live: [],
    upcoming: [],
    myChannels: [],
    activeTab: 'live', // Tabs: 'live', 'videos', 'playlists', 'posts'
    videos: [],        // Cached unified video list
    loadingVideos: false,
    audioOnly: false,
    sleepTimerId: null,
    sleepTimeRemaining: 0,
    searchHistory: JSON.parse(localStorage.getItem('searchHistory') || '[]'),
    prevLiveState: {} // Track live status for changes to push live notifications
  };

  /* ── CAROUSEL CONTROLLER ───────────────────────────── */
  let carouselTimer = null;
  let currentSlideIndex = 0;

  function startCarouselAutoSwipe(slideCount) {
    if (carouselTimer) clearInterval(carouselTimer);
    if (slideCount <= 1) return;
    
    carouselTimer = setInterval(() => {
      currentSlideIndex = (currentSlideIndex + 1) % slideCount;
      updateCarouselPosition();
    }, 5000);
  }

  function updateCarouselPosition() {
    const track = $('carouselTrack');
    if (!track) return;
    track.style.transform = `translateX(-${currentSlideIndex * 100}%)`;
    
    // Update active dot indicator
    const dots = document.querySelectorAll('.carousel-dot');
    dots.forEach((dot, idx) => {
      if (idx === currentSlideIndex) {
        dot.classList.add('active');
      } else {
        dot.classList.remove('active');
      }
    });
  }

  /* ── EMBEDDED iOS YOUTUBE PLAYER CONTROLLER ────────── */
  let ytPlayer = null;
  let currentPlaying = null;
  let playerTimeInterval = null;

  function openPlayer(videoId, title, channelName, avatarUrl, isLive) {
    currentPlaying = { videoId, title, channelName, avatarUrl, isLive };
    
    // Populate controls & details UI
    $('playerChannelName').textContent = channelName;
    $('playerVideoTitle').textContent = title;
    $('playerDetailTitle').textContent = title;
    $('playerDetailChannel').textContent = channelName;
    if (avatarUrl) {
      $('playerChannelAvatar').src = avatarUrl;
      $('playerChannelAvatar').onerror = () => {
        $('playerChannelAvatar').src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="46" height="46" viewBox="0 0 46 46"><rect width="100%" height="100%" fill="%23D4AF37"/><text x="50%" y="55%" dom-anchor="middle" text-anchor="middle" fill="white" font-size="20" font-family="sans-serif" font-weight="bold">${getInitials(channelName)}</text></svg>`;
      };
      $('audioDiscSpin').style.backgroundImage = `url('${avatarUrl}')`;
    } else {
      const fallbackSvg = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="46" height="46" viewBox="0 0 46 46"><rect width="100%" height="100%" fill="%23D4AF37"/><text x="50%" y="55%" dom-anchor="middle" text-anchor="middle" fill="white" font-size="20" font-family="sans-serif" font-weight="bold">${getInitials(channelName)}</text></svg>`;
      $('playerChannelAvatar').src = fallbackSvg;
      $('audioDiscSpin').style.backgroundImage = `url('${fallbackSvg}')`;
    }
    
    // Reset Audio Only Mode
    State.audioOnly = false;
    $('audioOnlyOverlay').style.display = 'none';
    $('playerAudioToggleBtn').textContent = '🎧 Audio: Off';
    $('playerAudioToggleBtn').style.background = 'var(--card-bg)';
    
    // Reset Sleep Timer Select
    $('playerSleepTimer').value = '0';
    if (State.sleepTimerId) {
      clearTimeout(State.sleepTimerId);
      State.sleepTimerId = null;
    }
    
    // Mini controls details
    $('playerMiniTitle').textContent = title;
    $('playerMiniChannel').textContent = channelName;

    // Reset panel layout
    $('playerSheet').classList.remove('minimized');
    $('playerSheet').classList.add('open');
    $('playerFullControls').style.display = 'flex';
    $('playerMiniControls').style.display = 'none';
    
    if (isLive) {
      $('playerLiveBadgeRow').style.display = 'flex';
      $('playerLiveViewerCount').textContent = 'Streaming live now';
      $('playerProgressBar').style.display = 'block';
      $('playerProgressBar').value = 100;
      $('playerCurrentTime').textContent = 'LIVE';
      $('playerDuration').textContent = 'Live';
    } else {
      $('playerLiveBadgeRow').style.display = 'none';
      $('playerProgressBar').style.display = 'block';
      $('playerProgressBar').value = 0;
      $('playerCurrentTime').textContent = '00:00';
      $('playerDuration').textContent = '00:00';
    }
    
    // Display sheet container
    $('playerBackdrop').style.display = 'block';
    $('playerSheet').style.display = 'flex';
    setTimeout(() => {
      $('playerBackdrop').classList.add('visible');
    }, 10);
    
    // Display buffering spinner until YT API reports playing
    $('playerBufferingOverlay').style.display = 'flex';
    $('playerBufferingOverlay').style.opacity = '1';
    
    loadYtPlayer(videoId);
  }

  function minimizePlayer() {
    $('playerSheet').classList.remove('open');
    $('playerSheet').classList.add('minimized');
    $('playerBackdrop').classList.remove('visible');
    setTimeout(() => {
      $('playerBackdrop').style.display = 'none';
    }, 350);
    
    $('playerFullControls').style.display = 'none';
    $('playerMiniControls').style.display = 'flex';
    syncPlayPauseIcons();
  }

  function expandPlayer() {
    $('playerSheet').classList.remove('minimized');
    $('playerSheet').classList.add('open');
    $('playerBackdrop').style.display = 'block';
    setTimeout(() => {
      $('playerBackdrop').classList.add('visible');
    }, 10);
    
    $('playerFullControls').style.display = 'flex';
    $('playerMiniControls').style.display = 'none';
    syncPlayPauseIcons();
  }

  function stopAndClosePlayer() {
    if (ytPlayer && ytPlayer.pauseVideo) {
      try { ytPlayer.pauseVideo(); } catch(e) {}
    }
    stopVideoProgress();
    currentPlaying = null;
    
    $('playerSheet').classList.remove('minimized');
    $('playerSheet').classList.remove('open');
    $('playerBackdrop').classList.remove('visible');
    setTimeout(() => {
      $('playerSheet').style.display = 'none';
      $('playerBackdrop').style.display = 'none';
    }, 450);
  }

  function syncPlayPauseIcons() {
    if (ytPlayer && ytPlayer.getPlayerState) {
      try {
        const state = ytPlayer.getPlayerState();
        const isPlaying = (state === 1);
        
        $('playIconSvg').style.display = isPlaying ? 'none' : 'block';
        $('pauseIconSvg').style.display = isPlaying ? 'block' : 'none';
        
        $('playIconSvgMini').style.display = isPlaying ? 'none' : 'block';
        $('pauseIconSvgMini').style.display = isPlaying ? 'block' : 'none';
      } catch(e) {}
    }
  }

  function loadYtPlayer(videoId) {
    if (!window.YT || !window.YT.Player) {
      if (!window.ytAPIAdding) {
        window.ytAPIAdding = true;
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
      }
      
      const checkAPI = setInterval(() => {
        if (window.YT && window.YT.Player) {
          clearInterval(checkAPI);
          initPlayerObj(videoId);
        }
      }, 200);
    } else {
      initPlayerObj(videoId);
    }
  }

  function initPlayerObj(videoId) {
    if (ytPlayer && ytPlayer.loadVideoById) {
      try {
        ytPlayer.loadVideoById({ videoId: videoId });
        ytPlayer.setPlaybackRate(1.0);
        $('playerSpeedSelector').value = "1.0";
        ytPlayer.setVolume(parseInt($('playerVolumeSlider').value));
        playVideoProgress();
        return;
      } catch (e) {
        console.warn("Reusing existing player failed, creating new:", e);
      }
    }
    
    ytPlayer = new YT.Player('ytPlayerContainer', {
      height: '100%',
      width: '100%',
      videoId: videoId,
      playerVars: {
        autoplay: 1,
        controls: 0,
        rel: 0,
        showinfo: 0,
        modestbranding: 1,
        playsinline: 1,
        enablejsapi: 1
      },
      events: {
        onReady: (e) => {
          e.target.playVideo();
          e.target.setVolume(parseInt($('playerVolumeSlider').value));
          playVideoProgress();
        },
        onStateChange: (e) => {
          syncPlayPauseIcons();
          if (e.data === YT.PlayerState.PLAYING) {
            $('playerBufferingOverlay').style.opacity = '0';
            setTimeout(() => $('playerBufferingOverlay').style.display = 'none', 200);
            playVideoProgress();
          } else if (e.data === YT.PlayerState.PAUSED) {
            stopVideoProgress();
          } else if (e.data === YT.PlayerState.BUFFERING) {
            $('playerBufferingOverlay').style.display = 'flex';
            $('playerBufferingOverlay').style.opacity = '1';
          } else if (e.data === YT.PlayerState.ENDED) {
            stopVideoProgress();
          }
        }
      }
    });
  }

  function playVideoProgress() {
    if (playerTimeInterval) clearInterval(playerTimeInterval);
    playerTimeInterval = setInterval(() => {
      if (ytPlayer && ytPlayer.getCurrentTime && ytPlayer.getDuration) {
        const cur = ytPlayer.getCurrentTime();
        const dur = ytPlayer.getDuration();
        if (dur > 0) {
          if (!window.isPlayerSeeking) {
            $('playerProgressBar').value = (cur / dur) * 100;
          }
          $('playerCurrentTime').textContent = formatTime(cur);
          $('playerDuration').textContent = formatTime(dur);
        }
      }
    }, 500);
  }

  function stopVideoProgress() {
    if (playerTimeInterval) clearInterval(playerTimeInterval);
  }

  function formatTime(sec) {
    if (isNaN(sec) || sec === Infinity) return "00:00";
    const minutes = Math.floor(sec / 60);
    const seconds = Math.floor(sec % 60);
    return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }

  /* Register player controls event listeners */
  $('playerPlayPauseBtn').addEventListener('click', () => {
    if (ytPlayer && ytPlayer.getPlayerState) {
      const state = ytPlayer.getPlayerState();
      if (state === 1) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    }
  });

  $('playerSkipBackBtn').addEventListener('click', () => {
    if (ytPlayer && ytPlayer.getCurrentTime) {
      const cur = ytPlayer.getCurrentTime();
      ytPlayer.seekTo(Math.max(0, cur - 10), true);
    }
  });

  $('playerSkipForwardBtn').addEventListener('click', () => {
    if (ytPlayer && ytPlayer.getCurrentTime && ytPlayer.getDuration) {
      const cur = ytPlayer.getCurrentTime();
      const dur = ytPlayer.getDuration();
      ytPlayer.seekTo(Math.min(dur, cur + 10), true);
    }
  });

  $('playerProgressBar').addEventListener('input', () => {
    window.isPlayerSeeking = true;
  });

  $('playerProgressBar').addEventListener('change', () => {
    if (ytPlayer && ytPlayer.getDuration) {
      const dur = ytPlayer.getDuration();
      const pct = parseFloat($('playerProgressBar').value) / 100;
      ytPlayer.seekTo(dur * pct, true);
    }
    window.isPlayerSeeking = false;
  });

  $('playerVolumeSlider').addEventListener('input', () => {
    if (ytPlayer && ytPlayer.setVolume) {
      ytPlayer.setVolume(parseInt($('playerVolumeSlider').value));
    }
  });

  $('playerSpeedSelector').addEventListener('change', () => {
    if (ytPlayer && ytPlayer.setPlaybackRate) {
      const rate = parseFloat($('playerSpeedSelector').value);
      ytPlayer.setPlaybackRate(rate);
    }
  });

  $('playerFullscreenBtn').addEventListener('click', () => {
    const container = document.querySelector('.player-video-viewport');
    if (container) {
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => {
          console.warn("Fullscreen request failed", err);
        });
      } else {
        document.exitFullscreen();
      }
    }
  });

  // Fullscreen toggle event sync (for half screen label option)
  document.addEventListener('fullscreenchange', () => {
    const isFull = !!document.fullscreenElement;
    const btn = $('playerFullscreenBtn');
    if (btn) {
      if (isFull) {
        btn.innerHTML = `
          <svg id="fullscreenIconSvg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 14h6v6m10-6h-6v6M4 10h6V4m10 6h-6V4"/>
          </svg>
          Half Screen
        `;
      } else {
        btn.innerHTML = `
          <svg id="fullscreenIconSvg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
          Fullscreen
        `;
      }
    }
  });

  $('playerBackdrop').addEventListener('click', minimizePlayer);
  $('playerCloseBtn').addEventListener('click', minimizePlayer);

  // Mini Player actions
  $('playerMiniPlayPauseBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    if (ytPlayer && ytPlayer.getPlayerState) {
      const state = ytPlayer.getPlayerState();
      if (state === 1) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    }
  });

  $('playerMiniCloseBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    stopAndClosePlayer();
  });

  // Re-expand mini-player on container click
  $('playerSheet').addEventListener('click', (e) => {
    if ($('playerSheet').classList.contains('minimized')) {
      if (e.target.closest('#playerMiniPlayPauseBtn') || e.target.closest('#playerMiniCloseBtn')) {
        return;
      }
      expandPlayer();
    }
  });

  // Gestural drag close sheet (iOS native feeling)
  let dragStartY = 0;
  let dragCurrentY = 0;
  let isDragging = false;

  $('playerDragHeader').addEventListener('touchstart', (e) => {
    dragStartY = e.touches[0].clientY;
    isDragging = true;
    $('playerSheet').style.transition = 'none';
  });

  $('playerDragHeader').addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    dragCurrentY = e.touches[0].clientY;
    const deltaY = dragCurrentY - dragStartY;
    if (deltaY > 0) {
      $('playerSheet').style.transform = `translateX(-50%) translateY(${deltaY}px)`;
    }
  });

  $('playerDragHeader').addEventListener('touchend', (e) => {
    if (!isDragging) return;
    isDragging = false;
    $('playerSheet').style.transition = '';
    const deltaY = dragCurrentY - dragStartY;
    if (deltaY > 140) {
      minimizePlayer();
    } else {
      $('playerSheet').style.transform = 'translateX(-50%) translateY(0)';
    }
  });

  /* ── THEME MANAGER ─────────────────────────────────── */
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    $('themeBtn').textContent = theme === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('sl_theme', theme);
    document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0B0B0C' : '#F4F5F7';
  }
  applyTheme(localStorage.getItem('sl_theme') || 'light');
  $('themeBtn').addEventListener('click', () => {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });

  /* ── NAVIGATION BACK BUTTON ────────────────────────── */
  $('backBtn').addEventListener('click', e => {
    e.preventDefault();
    if (document.referrer && document.referrer.includes(window.location.host)) {
      history.back();
    } else {
      window.location.href = '../index.html';
    }
  });

  /* ── YOUTUBE-STYLE VIDEO CARD CREATOR ───────────────── */
  function createYtVideoCard(v, isLiveCard = false) {
    const card = CE('div');
    card.className = 'yt-video-card';
    
    const thumbWrap = CE('div');
    thumbWrap.className = 'yt-video-thumb-wrap';
    
    const img = CE('img');
    img.className = 'yt-video-thumb';
    img.src = `https://img.youtube.com/vi/${v.videoId}/mqdefault.jpg`;
    img.loading = 'lazy';
    thumbWrap.appendChild(img);
    
    if (isLiveCard) {
      const liveOverlay = CE('span');
      liveOverlay.className = 'yt-video-live-overlay';
      liveOverlay.textContent = 'LIVE';
      thumbWrap.appendChild(liveOverlay);
    } else if (v.duration) {
      const duration = CE('span');
      duration.className = 'yt-video-duration';
      duration.textContent = v.duration;
      thumbWrap.appendChild(duration);
    }
    card.appendChild(thumbWrap);
    
    const details = CE('div');
    details.className = 'yt-video-details';
    
    const avatar = CE('img');
    avatar.className = 'yt-video-avatar';
    if (v.channelThumbnail) {
      avatar.src = v.channelThumbnail;
      avatar.onerror = () => {
        avatar.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 38 38"><rect width="100%" height="100%" fill="%23D4AF37"/><text x="50%" y="55%" dom-anchor="middle" text-anchor="middle" fill="white" font-size="16" font-family="sans-serif" font-weight="bold">${getInitials(v.channelName)}</text></svg>`;
      };
    } else {
      avatar.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 38 38"><rect width="100%" height="100%" fill="%23D4AF37"/><text x="50%" y="55%" dom-anchor="middle" text-anchor="middle" fill="white" font-size="16" font-family="sans-serif" font-weight="bold">${getInitials(v.channelName)}</text></svg>`;
    }
    details.appendChild(avatar);
    
    const info = CE('div');
    info.className = 'yt-video-info';
    
    const title = CE('h4');
    title.className = 'yt-video-title';
    title.textContent = v.title;
    info.appendChild(title);
    
    const meta = CE('div');
    meta.className = 'yt-video-meta';
    meta.innerHTML = `
      <span class="channel-name">${v.channelName}</span>
      <span>•</span>
      <span>${v.views || 'No views'}</span>
      <span>•</span>
      <span>${v.publishedTime || ''}</span>
    `;
    info.appendChild(meta);
    details.appendChild(info);
    card.appendChild(details);
    
    card.addEventListener('click', () => {
      openPlayer(v.videoId, v.title, v.channelName, v.channelThumbnail, isLiveCard);
    });
    
    return card;
  }

  /* ── RENDER AUTO-SWIPING LIVE CAROUSEL SECTION ─────── */
  function renderCarouselSection() {
    if (!State.selectedChannelId) State.selectedChannelId = 'all';
    
    let liveChannels = State.live.filter(c => c.isLive === 1);
    let fallbackList = State.myChannels.length > 0 ? State.myChannels : State.live;
    
    if (State.selectedChannelId !== 'all') {
      liveChannels = liveChannels.filter(c => c.channelId === State.selectedChannelId);
      fallbackList = fallbackList.filter(c => c.channelId === State.selectedChannelId);
    }
    
    const itemsToRender = liveChannels.length > 0 ? liveChannels : fallbackList.slice(0, 3);
    
    if (itemsToRender.length === 0) return null;

    const container = CE('div');
    container.className = 'carousel-container';

    const track = CE('div');
    track.className = 'carousel-track';
    track.id = 'carouselTrack';
    track.style.width = `${itemsToRender.length * 100}%`;

    itemsToRender.forEach(ch => {
      const slide = CE('div');
      slide.className = 'carousel-slide';
      slide.style.width = `${100 / itemsToRender.length}%`;

      const bg = CE('div');
      bg.className = 'carousel-slide-bg';
      
      const isLive = ch.isLive === 1;
      if (isLive && ch.videoId) {
        bg.style.backgroundImage = `url('https://img.youtube.com/vi/${ch.videoId}/mqdefault.jpg')`;
      } else if (ch.thumbnail) {
        bg.style.backgroundImage = `url('${ch.thumbnail}')`;
        bg.style.filter = 'blur(15px)';
        bg.style.opacity = '0.35';
      }
      slide.appendChild(bg);

      const overlay = CE('div');
      overlay.className = 'carousel-overlay';
      slide.appendChild(overlay);

      const content = CE('div');
      content.className = 'carousel-content';

      const metaRow = CE('div');
      metaRow.className = 'hero-meta-row';

      const dp = CE('div');
      dp.className = 'hero-channel-dp';
      if (ch.thumbnail) {
        const img = CE('img');
        img.src = ch.thumbnail;
        img.onerror = () => {
          img.remove();
          dp.textContent = getInitials(ch.channelName);
        };
        dp.appendChild(img);
      } else {
        dp.textContent = getInitials(ch.channelName);
      }
      metaRow.appendChild(dp);

      const info = CE('div');
      info.className = 'hero-channel-info';
      info.innerHTML = `
        <div class="hero-channel-name" style="display:flex; align-items:center; gap:5px;">
          <span>${ch.channelName}</span>

      }
      content.appendChild(metaRow);

      const title = CE('div');
      title.className = 'hero-stream-title';
      title.textContent = isLive ? ch.liveTitle || 'Live Gurbani Kirtan' : 'Offline. Tap to browse videos & playlists.';
      content.appendChild(title);

      const btn = CE('button');
      btn.className = 'hero-btn';
      btn.innerHTML = isLive ? '<span>▶</span> Watch Live' : '<span>🛕</span> Visit Feed';
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isLive && ch.videoId) {
          openPlayer(ch.videoId, ch.liveTitle || 'Live Gurbani', ch.channelName, ch.thumbnail, true);
        } else {
          State.activeTab = 'videos';
          renderMainUI();
          loadVideosTab();
        }
      });
      content.appendChild(btn);

      slide.appendChild(content);
      slide.addEventListener('click', () => {
        if (isLive && ch.videoId) {
          openPlayer(ch.videoId, ch.liveTitle || 'Live Gurbani', ch.channelName, ch.thumbnail, true);
        } else {
          State.activeTab = 'videos';
          renderMainUI();
          loadVideosTab();
        }
      });

      track.appendChild(slide);
    });
    container.appendChild(track);

    const dotsContainer = CE('div');
    dotsContainer.className = 'carousel-dots';
    dotsContainer.id = 'carouselDots';

    for (let i = 0; i < itemsToRender.length; i++) {
      const dot = CE('div');
      dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
      dot.addEventListener('click', (e) => {
        e.stopPropagation();
        currentSlideIndex = i;
        updateCarouselPosition();
      });
      dotsContainer.appendChild(dot);
    }
    container.appendChild(dotsContainer);

    currentSlideIndex = 0;
    startCarouselAutoSwipe(itemsToRender.length);

    // Gestural finger swipe support
    let startX = 0;
    let deltaX = 0;
    
    container.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
      deltaX = 0;
    }, { passive: true });
    
    container.addEventListener('touchmove', (e) => {
      deltaX = e.touches[0].clientX - startX;
    }, { passive: true });
    
    container.addEventListener('touchend', () => {
      if (Math.abs(deltaX) > 50) {
        if (deltaX < 0) {
          // Swipe left -> Next slide
          currentSlideIndex = (currentSlideIndex + 1) % itemsToRender.length;
        } else {
          // Swipe right -> Prev slide
          currentSlideIndex = (currentSlideIndex - 1 + itemsToRender.length) % itemsToRender.length;
        }
        updateCarouselPosition();
        startCarouselAutoSwipe(itemsToRender.length);
      }
    });

    return container;
  }

  /* ── VIDEOS TAB LOADER (YOUTUBE CARDS WITH THUMBNAILS) ── */
  function getPersistentUserId() {
    let userId = localStorage.getItem('anhad_user_id');
    if (!userId) {
      if (window.crypto && window.crypto.randomUUID) {
        userId = window.crypto.randomUUID();
      } else {
        // Fallback UUID v4
        userId = '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, c =>
          (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
        );
      }
      localStorage.setItem('anhad_user_id', userId);
    }
    return userId;
  }

  function fetchWithUser(url, options = {}) {
    const userId = getPersistentUserId();
    if (!options.headers) {
      options.headers = {};
    }
    options.headers['X-User-ID'] = userId;
    return fetch(url, options);
  }

  async function fetchVideosForSelectedChannel(silent = false) {
    if (!silent) {
      State.loadingVideos = true;
      // Rerender the active tab to show shimmer/loading if appropriate
      if (State.activeTab === 'live') {
        const feedSec = $('tabContentSection');
        const titleLbl = document.querySelector('.section-title-label');
        if (feedSec && titleLbl) {
          renderLiveFeedContent(feedSec, titleLbl);
        }
      } else if (State.activeTab === 'videos') {
        const container = $('tabSubContainer');
        if (container) {
          container.innerHTML = `
            <div class="shimmer-card"></div>
            <div class="shimmer-card"></div>
            <div class="shimmer-card"></div>
          `;
        }
      }
    }
    
    try {
      const url = State.selectedChannelId === 'all'
        ? '/api/sadhsangat/videos'
        : `/api/sadhsangat/channel/${encodeURIComponent(State.selectedChannelId)}/videos`;
      const res = await fetchWithUser(url);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to fetch videos');
      
      State.videos = data.videos || [];
    } catch (e) {
      console.error('[Fetch Videos Error]', e);
      State.videos = [];
    } finally {
      if (!silent) {
        State.loadingVideos = false;
      }
      
      // Rerender tab content with new videos
      if (State.activeTab === 'live') {
        const feedSec = $('tabContentSection');
        const titleLbl = document.querySelector('.section-title-label');
        if (feedSec && titleLbl) {
          renderLiveFeedContent(feedSec, titleLbl);
        }
      } else if (State.activeTab === 'videos') {
        renderVideosList(State.videos);
      } else if (State.activeTab === 'playlists') {
        loadPlaylistsTab();
      } else if (State.activeTab === 'posts') {
        loadPostsTab();
      }
    }
  }

  async function loadVideosTab() {
    const container = $('tabSubContainer');
    if (!container) return;

    if (State.videos.length > 0) {
      renderVideosList(State.videos);
      return;
    }
    await fetchVideosForSelectedChannel(false);
  }

        </div>

    State.myChannels.forEach(ch => {

  /* ── CORE DATA LOADING & AUTO RE-LOAD ──────────────── */
  async function loadData() {
    try {
      const [liveRes, myChannelsRes] = await Promise.all([
        fetchWithUser('/api/sadhsangat/live').then(r => r.json()),
        fetchWithUser('/api/sadhsangat/my-channels').then(r => r.json())
      ]);

      const prevLive = [...State.live];
      State.live = liveRes.live || [];
      State.upcoming = liveRes.upcoming || [];
      State.myChannels = myChannelsRes.channels || [];

      // Dynamic Live Notification triggers
      State.live.forEach(ch => {
        if (ch.isLive === 1) {
          const wasLive = State.prevLiveState[ch.channelId] === 1;
          if (!wasLive && State.prevLiveState[ch.channelId] !== undefined) {
            // Channel just went live!
            showToast(`🔴 LIVE NOW: ${ch.channelName} has started streaming!`, 5000);
            try {
              // Play a soft notification sound
              const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5 note
              gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
              osc.start();
              osc.stop(audioCtx.currentTime + 0.35);
            } catch(e) {}
          }
        }
        State.prevLiveState[ch.channelId] = ch.isLive;
      });

      // Live status dots in header
      const liveCount = State.live.filter(c => c.isLive === 1).length;
      const totalCount = State.myChannels.length;

      if (liveCount > 0) {
        $('liveDot').className = 'hdr-status-dot live';
        $('liveStatusText').textContent = `${liveCount} channel${liveCount > 1 ? 's' : ''} live now`;
      } else {
        $('liveDot').className = 'hdr-status-dot';
        $('liveStatusText').textContent = `${totalCount} channel${totalCount !== 1 ? 's' : ''} monitored`;
      }

      // Load/refresh videos list silently in background
      if (!State.loadingVideos) {
        fetchVideosForSelectedChannel(true);
      }

      renderMainUI();
      
      if (State.activeTab === 'playlists') {
        loadPlaylistsTab();
      } else if (State.activeTab === 'posts') {
        loadPostsTab();
      }
    } catch (e) {
      $('mainContainer').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">⚠️</div>
          <div class="empty-heading">Connection Error</div>
          <div class="empty-desc">Could not reach the server. Please verify if the server is running on port 3000.</div>
        </div>
      `;
      $('liveDot').className = 'hdr-status-dot';
      $('liveStatusText').textContent = 'Offline';
      console.error('[Sadhsangat Live Loader]', e);
    }
  }

  /* ── CHANNEL DISPLAY REORDER LOGIC ── */
  async function moveChannel(channelId, direction) {
    const ids = State.myChannels.map(c => c.channelId);
    const idx = ids.indexOf(channelId);
    if (idx === -1) return;
    
    if (direction === 'up' && idx > 0) {
      [ids[idx], ids[idx-1]] = [ids[idx-1], ids[idx]];
    } else if (direction === 'down' && idx < ids.length - 1) {
      [ids[idx], ids[idx+1]] = [ids[idx+1], ids[idx]];
    } else {
      return; // Boundary limit
    }
    
    try {
      const res = await fetchWithUser('/api/sadhsangat/my-channels/reorder', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderedChannelIds: ids })
      });
      if (!res.ok) throw new Error('Reordering failed');
      showToast('↕️ Channel display order updated');
      await loadData();
    } catch(err) {
      showToast('⚠️ ' + err.message);
    }
  }


  /* ── SLEEP TIMER LOGIC ── */
  $('playerSleepTimer').addEventListener('change', () => {
    if (State.sleepTimerId) {
      clearTimeout(State.sleepTimerId);
      State.sleepTimerId = null;
    }
    
    const minutes = parseInt($('playerSleepTimer').value);
    if (minutes > 0) {
      showToast(`⏰ Sleep timer set for ${minutes} minutes`);
      State.sleepTimerId = setTimeout(() => {
        if (ytPlayer && ytPlayer.pauseVideo) {
          try {
            ytPlayer.pauseVideo();
            showToast('⏰ Sleep timer finished. Playback paused.');
          } catch(e) {}
        }
      }, minutes * 60 * 1000);
    }
  });


  /* ── AUDIO-ONLY TOGGLE LOGIC ── */
  $('playerAudioToggleBtn').addEventListener('click', () => {
    State.audioOnly = !State.audioOnly;
    const overlay = $('audioOnlyOverlay');
    const btn = $('playerAudioToggleBtn');
    
    if (State.audioOnly) {
      overlay.style.display = 'flex';
      btn.textContent = '🎧 Audio: On';
      btn.style.background = 'var(--gold)';
      btn.style.color = '#000';
    } else {
      overlay.style.display = 'none';
      btn.textContent = '🎧 Audio: Off';
      btn.style.background = 'var(--card-bg)';
      btn.style.color = 'var(--text)';
    }
  });


  /* ── INITIALIZATION ────────────────────────────────── */
  loadData();
  // Poll live statuses and cache feeds every 45 seconds for auto updates
  setInterval(loadData, 45 * 1000);

})();
</script>
</body>
</html>
