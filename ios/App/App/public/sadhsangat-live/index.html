<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Sadhsangat Live | ANHAD</title>
  
  <!-- Critical Early Theme Blocker -->
  <script>
    (function() {
      try {
        const theme = localStorage.getItem('anhad_theme') || 'auto';
        let effectiveTheme = theme;
        let timeOfDay = localStorage.getItem('anhad_forced_time_of_day');
        if (theme === 'auto') {
          if (timeOfDay && ['morning', 'day', 'evening', 'night'].includes(timeOfDay)) {
            effectiveTheme = (timeOfDay === 'night') ? 'dark' : 'light';
          } else {
            const hour = new Date().getHours();
            effectiveTheme = (hour >= 5 && hour < 20) ? 'light' : 'dark';
          }
        }
        document.documentElement.setAttribute('data-theme', effectiveTheme);
        document.documentElement.setAttribute('data-theme-mode', theme);
        document.documentElement.style.colorScheme = effectiveTheme;
        if (effectiveTheme === 'dark') {
          document.documentElement.classList.add('dark', 'dark-mode');
        } else {
          document.documentElement.classList.remove('dark', 'dark-mode');
        }
        document.documentElement.style.backgroundColor = (effectiveTheme === 'dark') ? '#0D0D0F' : '#FAF8F5';
        document.documentElement.classList.add('theme-loaded');
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Core Theme & Layout Styles -->
  <link rel="stylesheet" href="../css/theme-variables.css">
  <link rel="stylesheet" href="../css/claymorphism-system.css?v=1">
  <link rel="stylesheet" href="../css/desktop-responsive.css?v=26">
  <link rel="stylesheet" href="../css/nav-glass.css?v=4.1.9">

  <!-- Core Library Scripts -->
  <script src="../lib/global-theme.js"></script>
  <script src="../lib/page-lifecycle.js"></script>
  <script src="../lib/desktop-sidebar.js" defer></script>
  <script src="../lib/smooth-navigation.js?v=3"></script>

  <style>
    /* ═══════════════════════════════════════════════════════════════════════════
       SADH SANGAT LIVE — MODERN NOW-PLAYING UI
       Ultra-lightweight · Hardware Accelerated · 120 FPS
       ═══════════════════════════════════════════════════════════════════════════ */
    :root {
      --ss-gold: #D4A03A;
      --ss-gold-light: #F4C46A;
      --ss-gold-dark: #A6781E;
      --ss-red: #FF3B30;
      --ss-bg: #FAF8F5;
      --ss-card-bg: rgba(255, 255, 255, 0.85);
      --ss-card-border: rgba(212, 160, 58, 0.18);
      --ss-text: #1C1C1E;
      --ss-text-muted: #8E8E93;
      --ss-glass-blur: blur(20px);
      --ss-radius-lg: 24px;
      --ss-radius-md: 16px;
      --ss-radius-sm: 12px;
      --ss-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      --ss-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html.dark-mode {
      --ss-bg: #0D0D0F;
      --ss-card-bg: rgba(26, 26, 30, 0.85);
      --ss-card-border: rgba(212, 160, 58, 0.22);
      --ss-text: #F5F5F7;
      --ss-text-muted: #98989D;
      --ss-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--ss-bg);
      color: var(--ss-text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: calc(90px + env(safe-area-inset-bottom, 20px));
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient dynamic backdrop glow */
    .ambient-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 420px;
      background: radial-gradient(circle at 50% 10%, rgba(212, 160, 58, 0.18) 0%, rgba(212, 160, 58, 0) 70%);
      pointer-events: none;
      z-index: 0;
      transform: translateZ(0);
    }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ─── Top Header ─── */
    .ss-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0 10px;
      position: sticky;
      top: 0;
      z-index: 40;
      background: transparent;
    }

    .ss-header__back {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--ss-card-border);
      background: var(--ss-card-bg);
      backdrop-filter: var(--ss-glass-blur);
      -webkit-backdrop-filter: var(--ss-glass-blur);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ss-text);
      cursor: pointer;
      box-shadow: var(--ss-shadow);
      transition: transform 0.2s var(--ss-spring), background 0.2s;
    }

    .ss-header__back:active {
      transform: scale(0.92);
    }

    .ss-header__title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ss-header__title span.ik-onkar {
      font-family: 'Noto Sans Gurmukhi', sans-serif;
      color: var(--ss-gold);
      font-size: 20px;
    }

    .ss-header__actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ss-header__btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--ss-card-border);
      background: var(--ss-card-bg);
      backdrop-filter: var(--ss-glass-blur);
      -webkit-backdrop-filter: var(--ss-glass-blur);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ss-text);
      cursor: pointer;
      box-shadow: var(--ss-shadow);
      transition: transform 0.2s var(--ss-spring);
    }

    .ss-header__btn:active {
      transform: scale(0.92);
    }

    /* ─── Channel Filter Pills Bar ─── */
    .channels-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 6px 2px 14px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .channels-bar::-webkit-scrollbar {
      display: none;
    }

    .channel-pill {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px 6px 8px;
      border-radius: 999px;
      background: var(--ss-card-bg);
      border: 1px solid var(--ss-card-border);
      color: var(--ss-text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s var(--ss-spring);
      box-shadow: var(--ss-shadow);
    }

    .channel-pill.active {
      background: linear-gradient(135deg, var(--ss-gold) 0%, var(--ss-gold-dark) 100%);
      color: #000;
      border-color: var(--ss-gold);
      box-shadow: 0 4px 14px rgba(212, 160, 58, 0.35);
    }

    .channel-pill__avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .channel-pill__dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ss-red);
      box-shadow: 0 0 8px var(--ss-red);
      animation: livePulse 1.5s infinite ease-in-out;
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* ─── Main Player Card ─── */
    .player-card {
      background: var(--ss-card-bg);
      border: 1px solid var(--ss-card-border);
      border-radius: var(--ss-radius-lg);
      padding: 16px;
      box-shadow: var(--ss-shadow);
      margin-bottom: 24px;
      transform: translateZ(0);
    }

    .player-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: var(--ss-radius-md);
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .player-viewport iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .player-viewport__live-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 59, 48, 0.92);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 5px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(255, 59, 48, 0.4);
      z-index: 2;
    }

    .player-viewport__live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: livePulse 1.2s infinite;
    }

    /* Audio-Only Mode Overlay */
    .audio-only-view {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #1E1B18 0%, #0D0D0F 100%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 3;
    }

    .audio-only-view.active {
      display: flex;
    }

    .audio-disc {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 3px solid var(--ss-gold);
      background-size: cover;
      background-position: center;
      animation: discRotate 8s linear infinite;
      box-shadow: 0 0 30px rgba(212, 160, 58, 0.35);
    }

    @keyframes discRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ─── Now Playing Meta ─── */
    .player-meta {
      margin-top: 16px;
    }

    .player-meta__title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--ss-text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .player-meta__channel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }

    .player-meta__channel {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-meta__avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--ss-gold);
    }

    .player-meta__name {
      font-size: 13px;
      font-weight: 600;
      color: var(--ss-text);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .player-meta__name i.gold-check {
      color: var(--ss-gold);
      font-size: 13px;
    }

    .player-meta__watching {
      font-size: 12px;
      font-weight: 600;
      color: var(--ss-red);
      background: rgba(255, 59, 48, 0.1);
      padding: 3px 8px;
      border-radius: 6px;
    }

    /* ─── Timeline / Scrubber ─── */
    .player-timeline {
      margin-top: 14px;
    }

    .player-timeline__bar {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.08);
      position: relative;
      cursor: pointer;
    }

    html.dark-mode .player-timeline__bar {
      background: rgba(255, 255, 255, 0.12);
    }

    .player-timeline__progress {
      height: 100%;
      border-radius: 999px;
      background: var(--ss-gold);
      width: 0%;
      position: relative;
    }

    .player-timeline__times {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: var(--ss-text-muted);
      margin-top: 6px;
    }

    /* ─── Playback Controls ─── */
    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-top: 14px;
    }

    .control-btn {
      background: transparent;
      border: none;
      color: var(--ss-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s var(--ss-spring), color 0.2s;
    }

    .control-btn:active {
      transform: scale(0.88);
    }

    .control-btn--seek {
      font-size: 20px;
      color: var(--ss-text-muted);
    }

    .control-btn--play {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--ss-gold) 0%, var(--ss-gold-dark) 100%);
      color: #000;
      font-size: 22px;
      box-shadow: 0 6px 20px rgba(212, 160, 58, 0.4);
    }

    /* ─── Action Pills ─── */
    .player-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--ss-card-border);
    }

    .action-pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 4px;
      border-radius: var(--ss-radius-sm);
      background: rgba(0, 0, 0, 0.03);
      border: 1px solid transparent;
      color: var(--ss-text);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s var(--ss-spring);
    }

    html.dark-mode .action-pill {
      background: rgba(255, 255, 255, 0.04);
    }

    .action-pill i {
      font-size: 15px;
      color: var(--ss-gold);
    }

    .action-pill:active {
      transform: scale(0.94);
      background: rgba(212, 160, 58, 0.15);
      border-color: var(--ss-gold);
    }

    /* ─── Broadcasts List Section ─── */
    .section-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title span.badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--ss-gold);
      background: rgba(212, 160, 58, 0.12);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .broadcasts-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .broadcast-item {
      display: flex;
      gap: 12px;
      padding: 10px;
      border-radius: var(--ss-radius-md);
      background: var(--ss-card-bg);
      border: 1px solid var(--ss-card-border);
      box-shadow: var(--ss-shadow);
      cursor: pointer;
      transition: transform 0.2s var(--ss-spring), background 0.2s;
    }

    .broadcast-item:active {
      transform: scale(0.98);
    }

    .broadcast-item__thumb-wrap {
      width: 110px;
      aspect-ratio: 16 / 9;
      border-radius: var(--ss-radius-sm);
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
      background: #111;
    }

    .broadcast-item__thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .broadcast-item__badge {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 4px;
    }

    .broadcast-item__info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
    }

    .broadcast-item__title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--ss-text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .broadcast-item__meta {
      font-size: 11px;
      color: var(--ss-text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ─── Bottom Navigation Glass Bar ─── */
    .ss-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(64px + env(safe-area-inset-bottom, 16px));
      padding-bottom: env(safe-area-inset-bottom, 16px);
      background: var(--ss-card-bg);
      backdrop-filter: var(--ss-glass-blur);
      -webkit-backdrop-filter: var(--ss-glass-blur);
      border-top: 1px solid var(--ss-card-border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 50;
    }

    .ss-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-decoration: none;
      color: var(--ss-text-muted);
      font-size: 10px;
      font-weight: 600;
      transition: color 0.2s, transform 0.2s;
    }

    .ss-nav-item i {
      font-size: 18px;
    }

    .ss-nav-item.active {
      color: var(--ss-gold);
    }

    .ss-nav-item:active {
      transform: scale(0.9);
    }
  </style>
</head>
<body>
  <div class="ambient-backdrop"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="ss-header">
      <button class="ss-header__back" id="backBtn" aria-label="Go Back" onclick="if(window.navigateTo){window.navigateTo('../index.html');}else{window.location.href='../index.html';}">
        <i class="fas fa-chevron-left"></i>
      </button>
      <div class="ss-header__title">
        <span class="ik-onkar">ੴ</span> Sadhsangat Live
      </div>
      <div class="ss-header__actions">
        <button class="ss-header__btn" id="themeToggleBtn" aria-label="Toggle Theme" onclick="if(window.AnhadTheme){window.AnhadTheme.toggle();}">
          <i class="fas fa-moon" id="themeIcon"></i>
        </button>
      </div>
    </header>

    <!-- Channels Scroll Bar -->
    <div class="channels-bar" id="channelsBar">
      <button class="channel-pill active" data-channel="all">
        <img src="../assets/app-logo-384.avif" alt="All" class="channel-pill__avatar">
        <span>All Channels</span>
      </button>
      <button class="channel-pill" data-channel="sgpc">
        <span class="channel-pill__dot"></span>
        <img src="https://ui-avatars.com/api/?name=SGPC&background=D4A03A&color=000&bold=true" alt="SGPC" class="channel-pill__avatar">
        <span>SGPC Sri Amritsar</span>
      </button>
      <button class="channel-pill" data-channel="amritvela">
        <img src="https://ui-avatars.com/api/?name=AV&background=30D158&color=000&bold=true" alt="Amritvela" class="channel-pill__avatar">
        <span>Amritvela Trust</span>
      </button>
      <button class="channel-pill" data-channel="kirtan">
        <img src="https://ui-avatars.com/api/?name=KD&background=5856D6&color=fff&bold=true" alt="Kirtan Darbar" class="channel-pill__avatar">
        <span>Kirtan Darbar</span>
      </button>
    </div>

    <!-- Main Player Card -->
    <section class="player-card" id="mainPlayerCard">
      <div class="player-viewport" id="playerViewport">
        <span class="player-viewport__live-badge" id="liveBadge">
          <span class="player-viewport__live-dot"></span> LIVE
        </span>
        
        <!-- Audio Mode Overlay -->
        <div class="audio-only-view" id="audioOnlyView">
          <div class="audio-disc" id="audioDisc" style="background-image: url('https://img.youtube.com/vi/rmPdQerSv8k/hqdefault.jpg');"></div>
          <div style="font-size:13px; font-weight:700; color:var(--ss-gold);">🎧 Background Audio Stream</div>

        <iframe id="ytPlayerIframe" src="https://www.youtube.com/embed/rmPdQerSv8k?autoplay=1&enablejsapi=1&playsinline=1&rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>

      <!-- Meta info -->
      <div class="player-meta">
        <h2 class="player-meta__title" id="playerTitle">Official SGPC LIVE (Audio) | Gurbani Kirtan | Sachkhand Sri Harmandir Sahib, Sri Amritsar</h2>
        <div class="player-meta__channel-row">
          <div class="player-meta__channel">

      <!-- Scrubber -->

        <div class="player-timeline__times">
          <span id="currentTime">LIVE</span>
          <span id="totalDuration">Real-time broadcast</span>

      </div>

      <!-- Playback Controls -->
      <div class="player-controls">
        <button class="control-btn control-btn--seek" id="seekBackBtn" title="10s Back">
          <i class="fas fa-rotate-left"></i>
        </button>
        <button class="control-btn control-btn--play" id="playPauseBtn" title="Play/Pause">

        </button>
        <button class="control-btn control-btn--seek" id="seekForwardBtn" title="10s Forward">
          <i class="fas fa-rotate-right"></i>

      <!-- Action Pills -->
      <div class="player-actions">
        <button class="action-pill" id="audioToggleBtn">
          <i class="fas fa-headphones" id="audioToggleIcon"></i>
          <span id="audioToggleLabel">Audio Mode</span>
        </button>
        <button class="action-pill" id="shareBtn">
          <i class="fas fa-share-nodes"></i>
          <span>Share</span>
        </button>
        <button class="action-pill" id="sleepTimerBtn">
          <i class="fas fa-bed"></i>
          <span id="sleepTimerLabel">Timer</span>
        </button>
        <button class="action-pill" id="fullscreenBtn">
          <i class="fas fa-expand"></i>
          <span>Fullscreen</span>
        </button>
      </div>
    </section>

    <!-- Up Next / Previous Lives -->
    <div class="section-title">
      <span>Up Next & Previous Broadcasts</span>
      <span class="badge" id="broadcastCountBadge">8 Streams</span>
    </div>

    <div class="broadcasts-list" id="broadcastsList">
      <!-- Items populated by JavaScript -->
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="ss-bottom-nav">
    <a href="../index.html" class="ss-nav-item">
      <i class="fas fa-home"></i>
      <span>Home</span>
    </a>
    <a href="#" class="ss-nav-item active">
      <i class="fas fa-broadcast-tower"></i>
      <span>Live</span>
    </a>
    <a href="../Insights/insights.html" class="ss-nav-item">
      <i class="fas fa-book-open"></i>
      <span>Learning</span>
    </a>
    <a href="../Favorites/favorites.html" class="ss-nav-item">
      <i class="fas fa-heart"></i>
      <span>Favorites</span>
    </a>
  </nav>

  <script>
    (function() {
      'use strict';

      // Real Curated Gurbani Streams List
      const STREAMS = [
        {
          videoId: 'rmPdQerSv8k',
          title: 'Official SGPC LIVE | Gurbani Kirtan | Sachkhand Sri Harmandir Sahib, Sri Amritsar',
          channel: 'SGPC, Sri Amritsar',
          avatar: 'https://ui-avatars.com/api/?name=SGPC&background=D4A03A&color=000&bold=true',
          views: '12.5K watching',
          isLive: true,
          duration: 'LIVE'
        },
        {
          videoId: 'Zdw8mPolGYw',
          title: 'Morning Amritvela Gurbani Kirtan Live | Sachkhand Sri Harmandir Sahib',
          channel: 'SGPC, Sri Amritsar',
          avatar: 'https://ui-avatars.com/api/?name=SGPC&background=D4A03A&color=000&bold=true',
          views: '241K views',
          isLive: false,
          duration: '3:15:20'
        },
        {
          videoId: 'nktuzcyaOpc',
          title: 'Sodar Rehras Sahib Live Broadcast | Sri Harmandir Sahib Amritsar',
          channel: 'SGPC, Sri Amritsar',
          avatar: 'https://ui-avatars.com/api/?name=SGPC&background=D4A03A&color=000&bold=true',
          views: '66K views',
          isLive: false,
          duration: '1:42:10'
        },
        {
          videoId: 'sTMJ3e3ZIGE',
          title: 'Asa Di Var Kirtan Live | Sachkhand Sri Darbar Sahib',
          channel: 'SGPC, Sri Amritsar',
          avatar: 'https://ui-avatars.com/api/?name=SGPC&background=D4A03A&color=000&bold=true',
          views: '449K views',
          isLive: false,
          duration: '2:50:00'
        },
        {
          videoId: 'EegMTrQ777Y',
          title: 'Daily Hukamnama Sahib Katha Vichar | Sri Amritsar',
          channel: 'SGPC, Sri Amritsar',
          avatar: 'https://ui-avatars.com/api/?name=SGPC&background=D4A03A&color=000&bold=true',
          views: '126K views',
          isLive: false,
          duration: '45:18'
        },
        {
          videoId: 'PBWZVUwN8U4',
          title: 'Waheguru Simran & Amrit Vela Nitnem Kirtan',
          channel: 'AMRITVELA TRUST',
          avatar: 'https://ui-avatars.com/api/?name=AV&background=30D158&color=000&bold=true',
          views: '324K views',
          isLive: false,
          duration: '1:15:00'
        }
      ];

      let isPlaying = true;
      let isAudioOnly = false;
      let sleepTimerMinutes = 0;
      let sleepTimerId = null;

      const iframe = document.getElementById('ytPlayerIframe');
      const titleEl = document.getElementById('playerTitle');
      const channelAvatarEl = document.getElementById('channelAvatar');
      const channelNameEl = document.getElementById('channelName');
      const viewerCountEl = document.getElementById('viewerCount');
      const audioOnlyView = document.getElementById('audioOnlyView');
      const audioDisc = document.getElementById('audioDisc');
      const playPauseIcon = document.getElementById('playPauseIcon');
      const audioToggleLabel = document.getElementById('audioToggleLabel');
      const sleepTimerLabel = document.getElementById('sleepTimerLabel');
      const broadcastsList = document.getElementById('broadcastsList');

      // Render Broadcasts List
      function renderBroadcasts() {
        broadcastsList.innerHTML = '';
        STREAMS.forEach((item, index) => {
          const card = document.createElement('div');
          card.className = 'broadcast-item';
          card.innerHTML = `
            <div class="broadcast-item__thumb-wrap">
              <img src="https://img.youtube.com/vi/${item.videoId}/hqdefault.jpg" alt="" class="broadcast-item__thumb" loading="lazy">
              <span class="broadcast-item__badge" style="${item.isLive ? 'background:var(--ss-red);' : ''}">${item.isLive ? 'LIVE' : item.duration}</span>
            </div>
            <div class="broadcast-item__info">
              <div class="broadcast-item__title">${item.title}</div>
              <div class="broadcast-item__meta">${item.channel} • ${item.views}</div>
            </div>
          `;
          card.addEventListener('click', () => {
            loadStream(item);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
          broadcastsList.appendChild(card);
        });
      }

      // Load Stream into Player
      function loadStream(item) {
        titleEl.textContent = item.title;
        channelNameEl.innerHTML = `${item.channel} <i class="fas fa-check-circle gold-check"></i>`;
        channelAvatarEl.src = item.avatar;
        viewerCountEl.textContent = item.isLive ? `🔴 ${item.views}` : item.views;
        document.getElementById('liveBadge').style.display = item.isLive ? 'flex' : 'none';
        
        audioDisc.style.backgroundImage = `url('https://img.youtube.com/vi/${item.videoId}/hqdefault.jpg')`;
        iframe.src = `https://www.youtube.com/embed/${item.videoId}?autoplay=1&enablejsapi=1&playsinline=1&rel=0`;
        
        isPlaying = true;
        playPauseIcon.className = 'fas fa-pause';
      }

      // Play / Pause Toggle
      document.getElementById('playPauseBtn').addEventListener('click', () => {
        isPlaying = !isPlaying;
        if (isPlaying) {
          iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
          playPauseIcon.className = 'fas fa-pause';
        } else {
          iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
          playPauseIcon.className = 'fas fa-play';
        }
      });

      // Seek Back (-10s)
      document.getElementById('seekBackBtn').addEventListener('click', () => {
        iframe.contentWindow.postMessage('{"event":"command","func":"seekTo","args":[-10, false]}', '*');
      });

      // Seek Forward (+10s)
      document.getElementById('seekForwardBtn').addEventListener('click', () => {
        iframe.contentWindow.postMessage('{"event":"command","func":"seekTo","args":[10, false]}', '*');
      });

      // Audio Mode Toggle
      document.getElementById('audioToggleBtn').addEventListener('click', () => {
        isAudioOnly = !isAudioOnly;
        audioOnlyView.classList.toggle('active', isAudioOnly);
        audioToggleLabel.textContent = isAudioOnly ? 'Video Mode' : 'Audio Mode';
      });

      // Share Button
      document.getElementById('shareBtn').addEventListener('click', () => {
        if (navigator.share) {
          navigator.share({
            title: titleEl.textContent,
            url: window.location.href
          }).catch(() => {});
        } else {
          navigator.clipboard.writeText(window.location.href);
          alert('Link copied to clipboard!');
        }
      });

      // Sleep Timer Toggle
      document.getElementById('sleepTimerBtn').addEventListener('click', () => {
        const options = [0, 15, 30, 45, 60];
        const nextIdx = (options.indexOf(sleepTimerMinutes) + 1) % options.length;
        sleepTimerMinutes = options[nextIdx];
        
        if (sleepTimerId) clearTimeout(sleepTimerId);
        
        if (sleepTimerMinutes > 0) {
          sleepTimerLabel.textContent = `${sleepTimerMinutes}m`;
          sleepTimerId = setTimeout(() => {
            iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
            isPlaying = false;
            playPauseIcon.className = 'fas fa-play';
            sleepTimerMinutes = 0;
            sleepTimerLabel.textContent = 'Timer';
          }, sleepTimerMinutes * 60 * 1000);
        } else {
          sleepTimerLabel.textContent = 'Timer';
        }
      });

      // Fullscreen
      document.getElementById('fullscreenBtn').addEventListener('click', () => {
        const vp = document.getElementById('playerViewport');
        if (vp.requestFullscreen) {
          vp.requestFullscreen();
        } else if (vp.webkitRequestFullscreen) {
          vp.webkitRequestFullscreen();
        }
      });

      // Channel Filter Pills
      document.querySelectorAll('.channel-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          document.querySelectorAll('.channel-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
        });
      });

      // Initialize
      renderBroadcasts();

    })();
  </script>
</body>
