<!DOCTYPE html>
<html lang="en">

<head>
  <!-- CRITICAL: Theme blocker - MUST run before paint -->
  <script>
(function() {
  try {
    const theme = localStorage.getItem('anhad_theme') || 'light';
    const html = document.documentElement;
    let effectiveTheme = theme;
    if (theme === 'auto') {
      const hour = new Date().getHours();
      effectiveTheme = (hour >= 6 && hour < 18) ? 'light' : 'dark';
    }
    
    if (effectiveTheme === 'dark') {
      html.classList.add('dark', 'dark-mode');
      html.setAttribute('data-theme', 'dark');
      html.style.colorScheme = 'dark';
      html.style.backgroundColor = '#0D0D0F';
    } else {
      html.classList.remove('dark', 'dark-mode');
      html.setAttribute('data-theme', 'light');
      html.style.colorScheme = 'light';
      html.style.backgroundColor = '#F2F2F7';
    }
    
    // Sync to body as soon as it exists
    const observer = new MutationObserver(() => {
      if (document.body) {
        if (effectiveTheme === 'dark') document.body.classList.add('dark-mode');
        observer.disconnect();
      }
    });
    observer.observe(html, { childList: true, subtree: true });

    // TIME-OF-DAY LCP BACKGROUND DECLARATIVE PRELOAD
    try {
      const h = new Date().getHours();
      let tod = 'morning';
      if (h >= 2 && h < 6) tod = 'amritvela';
      else if (h >= 6 && h < 12) tod = 'morning';
      else if (h >= 12 && h < 17) tod = 'afternoon';
      else if (h >= 17 && h < 21) tod = 'evening';
      else tod = 'night';

      html.setAttribute('data-tod', tod);

      const imageMap = {
        amritvela: '../assets/Darbar-sahib-AMRITVELA.avif',
        morning: '../assets/darbar-sahib-day.avif',
        afternoon: '../assets/darbar-sahib-day.avif',
        evening: '../assets/darbar-sahib-evening.avif',
        night: '../assets/darbar-sahib-evening.avif'
      };
      const imgUrl = imageMap[tod] || imageMap.morning;

      const l = document.createElement('link');
      l.rel = 'preload';
      l.as = 'image';
      l.href = imgUrl;
      l.type = 'image/avif';
      l.setAttribute('fetchpriority', 'high');
      if (document.head) {
        document.head.appendChild(l);
      } else {
        document.documentElement.appendChild(l);
      }
    } catch (err) {}
  } catch (e) {}
})();
  </script>
  <meta name="color-scheme" content="light dark">
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="description" content="ANHAD — Immersive Gurbani experience with live Darbar Sahib Kirtan">
    <title>ANHAD — Sri Harmandir Sahib</title>

    <!-- Global Theme System -->
    <link rel="stylesheet" href="../css/mobile-lock.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="../css/theme-variables.css" media="print" onload="this.media='all'">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&display=optional"
        onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&display=optional"
        rel="stylesheet"></noscript>
    <link rel="stylesheet" href="ios-homepage.css">
</head>

<body>

    <!-- L0: Entry overlay (Removed) -->

    <!-- L1: Full-screen Darbar Sahib Background — Day image -->
    <div id="scene-bg"></div>

    <!-- L2: Color-grading overlay (time-of-day tint) -->
    <div id="color-grade"></div>

    <!-- L3: Vignette -->
    <div id="vignette"></div>

    <!-- L4: Soft celestial light source (sun glow / moon glow) -->
    <div id="light-source"></div>

    <!-- L5: Stars canvas (night only) -->
    <canvas id="stars-canvas" aria-hidden="true"></canvas>

    <!-- Fireworks Particle Canvas -->
    <canvas id="fireworks-canvas" aria-hidden="true"></canvas>

    <!-- L6: Ambient golden haze near the temple -->
    <div id="temple-glow"></div>

    <!-- Live Kirtan Audio -->
    <audio id="kirtan-audio" preload="none">
        <source src="https://live.sgpc.net:8443/;nocache=889869" type="audio/mpeg">
    </audio>

    <!-- L7: UI Layer -->
    <div id="ui">

        <!-- Handwritten "Anhad" SVG Animation (Removed) -->

        <!-- Top -->
        <header id="top-ui">
            <div id="live-badge" class="card-fade-in delay-0">
                <span class="dot"></span>
                <span class="label">LIVE KIRTAN</span>
            </div>
        </header>

        <!-- Center UI Removed for unobstructed Darbar Sahib view -->



        <!-- Bottom -->
        <footer id="bottom-ui">
            <a href="../index.html" id="enter-btn" class="card-fade-in delay-1" onclick="try{sessionStorage.setItem('anhad_welcomed','1');localStorage.setItem('anhad_welcome_seen','true');localStorage.setItem('anhad_session_active_ts',Date.now()+'');}catch(e){}">
                <span class="enter-btn-main">Enter ANHAD</span>
            </a>
            <p id="tap-hint" class="card-fade-in delay-4">Tap anywhere to start live kirtan</p>
        </footer>

    </div>

    <!-- Audio/stat engines are loaded by ios-homepage.js after first paint. -->
    <script src="ios-homepage.js" defer></script>
</body>

</html>
