<!DOCTYPE html>
<html lang="en">

<head>
      <!-- CRITICAL: Optimized Theme blocker - Cached and async-friendly -->
  <script>
    (function() {
      try {
        // Use cache from index.html if available
        if (window._anhadThemeCache) {
          const { theme, timeOfDay } = window._anhadThemeCache;
          let effectiveTheme = theme;
          let currentTimeOfDay = timeOfDay;
          
          if (theme === 'auto') {
            if (currentTimeOfDay && ['morning', 'day', 'evening', 'night'].includes(currentTimeOfDay)) {
              effectiveTheme = (currentTimeOfDay === 'night') ? 'dark' : 'light';
            } else {
              const hour = new Date().getHours();
              effectiveTheme = (hour >= 5 && hour < 20) ? 'light' : 'dark';
              
              if (hour >= 5 && hour < 9) currentTimeOfDay = 'morning';
              else if (hour >= 9 && hour < 16) currentTimeOfDay = 'day';
              else if (hour >= 16 && hour < 20) currentTimeOfDay = 'evening';
              else currentTimeOfDay = 'night';
              
              window._anhadThemeCache.timeOfDay = currentTimeOfDay;
            }
          }
          
          // Batch DOM operations
          const doc = document.documentElement;
          doc.setAttribute('data-theme', effectiveTheme);
          doc.setAttribute('data-theme-mode', theme);
          if (theme === 'auto') {
            doc.setAttribute('data-time-of-day', currentTimeOfDay);
          }
          doc.style.colorScheme = effectiveTheme;
          
          if (effectiveTheme === 'dark') {
            doc.classList.add('dark', 'dark-mode');
          } else {
            doc.classList.remove('dark', 'dark-mode');
          }
          
          let bg = (effectiveTheme === 'dark') ? '#0D0D0F' : '#FAF8F5';
          if (theme === 'auto') {
            if (currentTimeOfDay === 'morning') bg = '#FFF5EC';
            else if (currentTimeOfDay === 'day') bg = '#FFFDF9';
            else if (currentTimeOfDay === 'evening') bg = '#FFF8E7';
            else if (currentTimeOfDay === 'night') bg = '#0F0F12';
          }
          doc.style.backgroundColor = bg;
          doc.classList.add('theme-loaded');

          document.addEventListener('DOMContentLoaded', function() {
            if (effectiveTheme === 'dark') document.body.classList.add('dark-mode');
            document.body.classList.add('theme-loaded');
          }, { once: true });

          if (doc.hasAttribute('data-anhad-home')) {
            try { sessionStorage.removeItem('gurbaniKhoj_state'); } catch(e) {}
          }
          return; // Skip localStorage reads
        }
        
        // Fallback: Read from localStorage if cache not available
        const theme = localStorage.getItem('anhad_theme') || 'auto';
        let effectiveTheme = theme;
        let timeOfDay = localStorage.getItem('anhad_forced_time_of_day');
        
        // Initialize cache
        window._anhadThemeCache = { theme, timeOfDay };
        
        if (theme === 'auto') {
          if (timeOfDay && ['morning', 'day', 'evening', 'night'].includes(timeOfDay)) {
            effectiveTheme = (timeOfDay === 'night') ? 'dark' : 'light';
          } else {
            const hour = new Date().getHours();
            effectiveTheme = (hour >= 5 && hour < 20) ? 'light' : 'dark';
            
            if (hour >= 5 && hour < 9) timeOfDay = 'morning';
            else if (hour >= 9 && hour < 16) timeOfDay = 'day';
            else if (hour >= 16 && hour < 20) timeOfDay = 'evening';
            else timeOfDay = 'night';
            
            window._anhadThemeCache.timeOfDay = timeOfDay;
          }
        }
        
        // Batch DOM operations
        const doc = document.documentElement;
        doc.setAttribute('data-theme', effectiveTheme);
        doc.setAttribute('data-theme-mode', theme);
        if (theme === 'auto') {
          doc.setAttribute('data-time-of-day', timeOfDay);
        }
        doc.style.colorScheme = effectiveTheme;
        
        if (effectiveTheme === 'dark') {
          doc.classList.add('dark', 'dark-mode');
        } else {
          doc.classList.remove('dark', 'dark-mode');
        }
        
        let bg = (effectiveTheme === 'dark') ? '#0D0D0F' : '#FAF8F5';
        if (theme === 'auto') {
          if (timeOfDay === 'morning') bg = '#FFF5EC';
          else if (timeOfDay === 'day') bg = '#FFFDF9';
          else if (timeOfDay === 'evening') bg = '#FFF8E7';
          else if (timeOfDay === 'night') bg = '#0F0F12';
        }
        doc.style.backgroundColor = bg;
        doc.classList.add('theme-loaded');

        document.addEventListener('DOMContentLoaded', function() {
          if (effectiveTheme === 'dark') document.body.classList.add('dark-mode');
          document.body.classList.add('theme-loaded');
        }, { once: true });

        if (doc.hasAttribute('data-anhad-home')) {
          try { sessionStorage.removeItem('gurbaniKhoj_state'); } catch(e) {}
        }
      } catch (e) {}
    })();
  </script>
    <meta name="color-scheme" content="light dark">
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="description" content="ANHAD — Immersive Gurbani experience with live Darbar Sahib Kirtan">
    <title>ANHAD — Sri Harmandir Sahib</title>

    <!-- PERFORMANCE: Preconnect to critical domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Global Theme System - Async Loading -->
    <link rel="stylesheet" href="../css/mobile-lock.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="../css/theme-variables.css" media="print" onload="this.media='all'">
    
    <!-- Fonts - Async Loading -->
    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&display=optional"
        onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&display=optional"
        rel="stylesheet"></noscript>
    
    <!-- Main CSS - Critical -->
    <link rel="stylesheet" href="ios-homepage.css">
</head>

<body>

    <!-- L0: Entry overlay (Removed) -->

    <!-- L1: Full-screen Darbar Sahib Background — Day image -->
    <div id="scene-bg"></div>

    <!-- L2: Color-grading overlay (time-of-day tint) -->
    <div id="color-grade"></div>

    <!-- L3: Vignette -->
    <div id="vignette"></div>

    <!-- L4: Soft celestial light source (sun glow / moon glow) -->
    <div id="light-source"></div>

    <!-- L5: Stars canvas (night only) -->
    <canvas id="stars-canvas" aria-hidden="true"></canvas>

    <!-- Fireworks Particle Canvas -->
    <canvas id="fireworks-canvas" aria-hidden="true"></canvas>

    <!-- L6: Ambient golden haze near the temple -->
    <div id="temple-glow"></div>

    <!-- Live Kirtan Audio -->
    <audio id="kirtan-audio" preload="none">
        <source src="https://live.sgpc.net:8443/;nocache=889869" type="audio/mpeg">
    </audio>

    <!-- L7: UI Layer -->
    <div id="ui">

        <!-- Handwritten "Anhad" SVG Animation (Removed) -->

        <!-- Top -->
        <header id="top-ui">
            <div id="live-badge" class="card-fade-in delay-0">
                <span class="dot"></span>
                <span class="label">LIVE KIRTAN</span>
            </div>
        </header>

        <!-- Center UI Removed for unobstructed Darbar Sahib view -->



        <!-- Bottom -->
        <footer id="bottom-ui">
            <a href="../index.html" id="enter-btn" class="card-fade-in delay-1" onclick="try{sessionStorage.setItem('anhad_welcomed','1');localStorage.setItem('anhad_welcome_seen','true');localStorage.setItem('anhad_session_active_ts',Date.now()+'');}catch(e){}">
                <span class="enter-btn-main">Enter ANHAD</span>
            </a>
            <p id="tap-hint" class="card-fade-in delay-4">Tap anywhere to start live kirtan</p>
        </footer>

    </div>

    <!-- Audio/stat engines are loaded by ios-homepage.js after first paint. -->
    <script src="ios-homepage.js" defer></script>
</body>

</html>
