<!DOCTYPE html>
<html lang="en">

<head>
  <!-- CRITICAL: Theme blocker - MUST run before paint -->
  <script>
(function() {
  try {
    const theme = localStorage.getItem('anhad_theme') || 'light';
    const html = document.documentElement;
    let effectiveTheme = theme;
    if (theme === 'auto') {
      const hour = new Date().getHours();
      effectiveTheme = (hour >= 6 && hour < 18) ? 'light' : 'dark';
    }
    
    if (effectiveTheme === 'dark') {
      html.classList.add('dark', 'dark-mode');
      html.setAttribute('data-theme', 'dark');
      html.style.colorScheme = 'dark';
      html.style.backgroundColor = '#0D0D0F';
    } else {
      html.classList.remove('dark', 'dark-mode');
      html.setAttribute('data-theme', 'light');
      html.style.colorScheme = 'light';
      html.style.backgroundColor = '#F2F2F7';
    }
    
    // Sync to body as soon as it exists
    const observer = new MutationObserver(() => {
      if (document.body) {
        if (effectiveTheme === 'dark') document.body.classList.add('dark-mode');
        observer.disconnect();
      }
    });
    observer.observe(html, { childList: true, subtree: true });
  } catch (e) {}
})();
  </script>
