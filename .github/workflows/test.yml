name: Tests

# Without CI, "a bug is not fixed until a test protects it" cannot hold in
# practice — the suite only protects anything if something runs it. `npm test`
# is now green and deterministic (the deliberately-failing exploration suites
# live behind `npm run test:explore`), so it is safe to gate on.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      # Informational only. These suites document known-unfixed defects and are
      # EXPECTED to fail, so they must never gate a merge.
      - name: Exploration suites (non-blocking)
        run: npm run test:explore || true
