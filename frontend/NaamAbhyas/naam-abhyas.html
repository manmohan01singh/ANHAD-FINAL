<!DOCTYPE html>
<html lang="pa" data-theme="dark">
<head>
  <!-- ══ Instant dark flash prevention ══ -->
  <script>
  (function() {
    try {
      var theme = localStorage.getItem('anhad_theme') || 'auto';
      var effective = theme === 'auto'
        ? ((new Date().getHours() >= 5 && new Date().getHours() < 20) ? 'light' : 'dark')
        : theme;
      document.documentElement.setAttribute('data-theme', effective);
      document.documentElement.setAttribute('data-theme-mode', theme);
      document.documentElement.style.backgroundColor = effective === 'dark' ? '#08080F' : '#FAF8F5';
      if (effective === 'dark') document.documentElement.classList.add('dark', 'dark-mode');
      document.documentElement.classList.add('theme-loaded');
    } catch(e) {}
  })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#08080F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Naam Abhyas — Hourly Naam Simran meditation schedule. ANHAD Spiritual App.">
  <title>ਨਾਮ ਅਭਿਆਸ | Naam Abhyas — ANHAD</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Gurmukhi:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Page Styles -->
  <link rel="stylesheet" href="naam-abhyas.css">

  <!-- Naam Abhyas Manager — MUST load before page JS -->
  <script src="../lib/naam-abhyas-manager.js"></script>
</head>
<body>

<!-- ═══ ROOT APP SHELL ═══ -->
<div id="naamApp">

  <!-- ── Background ── -->
  <div class="na-bg">
    <div class="na-bg-gradient"></div>
  </div>

  <!-- ── Navigation Bar ── -->
  <nav class="na-nav">
    <button class="na-nav-btn" id="naBackBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <div class="na-nav-title">
      <div class="na-nav-title-main">Naam Abhyas</div>
      <div class="na-nav-title-gurmukhi">ਨਾਮ ਅਭਿਆਸ</div>
    </div>

    <button class="na-nav-btn" id="naSettingsBtn" aria-label="Schedule Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </nav>

  <!-- ══════════════════════════════════════════════
       MAIN SCHEDULE SCREEN
  ══════════════════════════════════════════════ -->
  <main class="na-main" id="naMainScreen">
    
    <!-- Today's Stats Card -->
    <div class="na-stats-card">
      <div class="na-stats-header">
        <div class="na-stats-icon">🙏</div>
        <div class="na-stats-info">
          <div class="na-stats-title">Today's Progress</div>
          <div class="na-stats-subtitle" id="naStatsDate">--</div>
        </div>
        <div class="na-stats-badge" id="naStatsPercent">0%</div>
      </div>
      <div class="na-stats-row">
        <div class="na-stat-item">
          <div class="na-stat-value" id="naStatCompleted">0</div>
          <div class="na-stat-label">Completed</div>
        </div>
        <div class="na-stat-divider"></div>
        <div class="na-stat-item">
          <div class="na-stat-value" id="naStatStreak">0</div>
          <div class="na-stat-label">Day Streak</div>
        </div>
        <div class="na-stat-divider"></div>
        <div class="na-stat-item">
          <div class="na-stat-value" id="naStatTotal">0</div>
          <div class="na-stat-label">Total This Week</div>
        </div>
      </div>
    </div>

    <!-- Hourly Schedule List -->
    <div class="na-schedule-header">
      <h2 class="na-schedule-title">Hourly Schedule</h2>
      <p class="na-schedule-subtitle">Tap any slot to start your 2-minute Simran</p>
    </div>

    <div class="na-schedule-list" id="naScheduleList">
      <!-- Schedule items will be dynamically generated by JS -->
    </div>

  </main>

  <!-- ══════════════════════════════════════════════
       SESSION POPUP (Duration Selection)
  ══════════════════════════════════════════════ -->
  <div class="na-popup-overlay" id="naPopupOverlay">
    <div class="na-popup-backdrop"></div>
    <div class="na-popup-card">
      <div class="na-popup-header">
        <div class="na-popup-icon">⏱️</div>
        <div class="na-popup-title">Select Duration</div>
        <div class="na-popup-subtitle" id="naPopupTime">--</div>
      </div>
      <div class="na-popup-options">
        <button class="na-popup-option" data-duration="120">
          <div class="na-popup-option-time">2 min</div>
          <div class="na-popup-option-label">Quick</div>
        </button>
        <button class="na-popup-option" data-duration="300">
          <div class="na-popup-option-time">5 min</div>
          <div class="na-popup-option-label">Standard</div>
        </button>
        <button class="na-popup-option" data-duration="600">
          <div class="na-popup-option-time">10 min</div>
          <div class="na-popup-option-label">Deep</div>
        </button>
      </div>
      <button class="na-popup-cancel" id="naPopupCancel">Cancel</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="na-toast" id="naToast" role="alert" aria-live="assertive"></div>

</div><!-- /#naamApp -->

<!-- ═══ Global Notification Engine ═══ -->
<script src="../lib/capacitor-notifications-global.js" defer></script>

<!-- ═══ Page Script ═══ -->
<script src="naam-abhyas.js"></script>

</body>
</html>
