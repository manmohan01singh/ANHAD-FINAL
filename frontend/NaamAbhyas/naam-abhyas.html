<!DOCTYPE html>
<html lang="pa" data-theme="dark">
<head>
  <!-- ══ Instant dark flash prevention ══ -->
  <script>
  (function() {
    try {
      var theme = localStorage.getItem('anhad_theme') || 'dark';
      var effective = theme === 'auto'
        ? ((new Date().getHours() >= 5 && new Date().getHours() < 20) ? 'light' : 'dark')
        : theme;
      // Naam Abhyas always stays dark for immersive experience
      document.documentElement.setAttribute('data-theme', 'dark');
      document.documentElement.style.backgroundColor = '#08080F';
    } catch(e) {}
  })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#08080F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Naam Abhyas — 2-minute Naam Simran meditation timer. ANHAD Spiritual App.">
  <title>ਨਾਮ ਅਭਿਆਸ | Naam Abhyas — ANHAD</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800&family=Noto+Sans+Gurmukhi:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Page Styles -->
  <link rel="stylesheet" href="naam-abhyas.css">

  <!-- Naam Abhyas Manager — MUST load before page JS -->
  <script src="../lib/naam-abhyas-manager.js"></script>
</head>
<body>

<!-- ═══ ROOT APP SHELL ═══ -->
<div id="naamApp">

  <!-- ── Background ── -->
  <div class="na-bg">
    <div class="na-bg-aurora"></div>
    <div class="na-bg-stars" id="naStars"></div>
  </div>

  <!-- ── Navigation Bar ── -->
  <nav class="na-nav">
    <button class="na-nav-btn" id="naBackBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <div class="na-nav-title">
      <div class="na-nav-title-main">Naam Abhyas</div>
      <div class="na-nav-title-gurmukhi">ਨਾਮ ਅਭਿਆਸ</div>
    </div>

    <!-- Placeholder spacer to keep title centred -->
    <div style="width:40px;"></div>
  </nav>

  <!-- ══════════════════════════════════════════════
       TIMER SCREEN
  ══════════════════════════════════════════════ -->
  <section id="naTimerScreen" class="na-screen">

    <!-- Breathing Orb -->
    <div class="na-orb-wrapper" aria-hidden="true">
      <!-- Pulse rings -->
      <div class="na-orb-ring"></div>
      <div class="na-orb-ring"></div>
      <div class="na-orb-ring"></div>

      <!-- Progress SVG ring overlaid on the orb -->
      <svg class="na-progress-ring" viewBox="0 0 168 168" aria-hidden="true">
        <circle class="na-progress-track" cx="84" cy="84" r="76"/>
        <circle class="na-progress-fill" id="naProgressFill" cx="84" cy="84" r="76"
          stroke-dasharray="477.5"
          stroke-dashoffset="0"/>
      </svg>

      <!-- Main glowing orb -->
      <div class="na-orb" id="naOrb">
        <span class="na-ik-onkar" aria-hidden="true">ੴ</span>
      </div>
    </div>

    <!-- Session chips -->
    <div class="na-session-chips" role="status" aria-live="polite">
      <div class="na-chip">
        <span class="na-chip-dot"></span>
        <span id="naSessionTypeChip">Naam Simran</span>
      </div>
      <div class="na-chip">
        <span id="naSessionTimeChip">—</span>
      </div>
    </div>

    <!-- Session label -->
    <div class="na-session-label" aria-hidden="true">WAHEGURU SIMRAN</div>

    <!-- Countdown -->
    <div class="na-timer-display" id="naTimerDisplay" role="timer" aria-live="off" aria-label="Time remaining">2:00</div>
    <div class="na-timer-label">remaining</div>

    <!-- Actions -->
    <div class="na-actions">
      <!-- Start button (shown before first start) -->
      <button class="na-btn na-btn-primary" id="naStartBtn" aria-label="Start Naam Simran">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        Start Simran
      </button>

      <!-- Pause/Resume button (shown while timer active) -->
      <button class="na-btn na-btn-secondary" id="naPauseBtn" aria-label="Pause" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" y1="4" x2="6" y2="20"/>
          <line x1="18" y1="4" x2="18" y2="20"/>
        </svg>
      </button>
    </div>

  </section>

  <!-- ══════════════════════════════════════════════
       COMPLETION SCREEN
  ══════════════════════════════════════════════ -->
  <section id="naCompletionScreen" class="na-screen hidden" style="display:none;" aria-label="Session complete">

    <div class="na-completion-inner">

      <!-- Animated check -->
      <div class="na-check-wrapper" aria-hidden="true">
        <div class="na-check-glow"></div>
        <div class="na-check-ring"></div>
        <span class="na-check-icon">🙏</span>
      </div>

      <h1 class="na-completion-title">Waheguru Ji</h1>
      <div class="na-completion-gurmukhi">ਵਾਹਿਗੁਰੂ ਜੀ</div>
      <p class="na-completion-sub">
        Session complete. May the Naam<br>carry your mind in peace.
      </p>

      <!-- Stats row -->
      <div class="na-stats-row" role="group" aria-label="Session statistics">

        <div class="na-stat-card" style="--delay:0.1s">
          <span class="na-stat-icon">🙏</span>
          <span class="na-stat-value" id="naStatToday">1</span>
          <span class="na-stat-label">Today</span>
        </div>

        <div class="na-stat-card" style="--delay:0.2s">
          <span class="na-stat-icon"><span class="na-streak-flame">🔥</span></span>
          <span class="na-stat-value" id="naStatStreak">0</span>
          <span class="na-stat-label">Streak</span>
        </div>

        <div class="na-stat-card" style="--delay:0.3s">
          <span class="na-stat-icon">⏱</span>
          <span class="na-stat-value" id="naStatDuration">2m</span>
          <span class="na-stat-label">Duration</span>
        </div>

      </div>

      <!-- Done button -->
      <button class="na-done-btn" id="naDoneBtn" aria-label="Done, return to app">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Done — Waheguru Ji 🙏
      </button>

    </div>

    <div class="na-safe-bottom"></div>
  </section>

  <!-- Pause indicator -->
  <div class="na-pause-indicator" id="naPauseIndicator" role="status" aria-live="polite">
    ⏸ Paused
  </div>

  <!-- Toast -->
  <div class="na-toast" id="naToast" role="alert" aria-live="assertive"></div>

  <!-- Confetti layer (above completion screen) -->
  <div class="na-confetti-layer" id="naConfettiLayer" aria-hidden="true"></div>

</div><!-- /#naamApp -->

<!-- ═══ Global Notification Engine ═══ -->
<script src="../lib/capacitor-notifications-global.js" defer></script>

<!-- ═══ Page Timer Engine ═══ -->
<script src="naam-abhyas.js"></script>

</body>
</html>
