<!DOCTYPE html>
<html lang="en" data-global-theme="force">
<head>
    <!-- CRITICAL: Theme blocker - MUST run before paint -->
  <script>
    (function() {
      try {
        const theme = localStorage.getItem('anhad_theme') || 'auto';
        let effectiveTheme = theme;
        let timeOfDay = localStorage.getItem('anhad_forced_time_of_day');
        if (theme === 'auto') {
          if (timeOfDay && ['morning', 'day', 'evening', 'night'].includes(timeOfDay)) {
            effectiveTheme = (timeOfDay === 'night') ? 'dark' : 'light';
          } else {
            const hour = new Date().getHours();
            effectiveTheme = (hour >= 5 && hour < 20) ? 'light' : 'dark';
            
            if (hour >= 5 && hour < 9) timeOfDay = 'morning';
            else if (hour >= 9 && hour < 16) timeOfDay = 'day';
            else if (hour >= 16 && hour < 20) timeOfDay = 'evening';
            else timeOfDay = 'night';
          }
        }
        document.documentElement.removeAttribute('data-anhad-home');
        document.documentElement.removeAttribute('data-time-of-day');
        document.documentElement.style.removeProperty('--dynamic-bg-url');
        document.documentElement.setAttribute('data-theme', effectiveTheme);
        document.documentElement.setAttribute('data-theme-mode', theme);
        document.documentElement.style.colorScheme = effectiveTheme;
        if (effectiveTheme === 'dark') {
          document.documentElement.classList.add('dark', 'dark-mode');
        } else {
          document.documentElement.classList.remove('dark', 'dark-mode');
        }
        
        document.documentElement.style.backgroundColor = (effectiveTheme === 'dark') ? '#0D0D0F' : '#FAF8F5';
        document.documentElement.classList.add('theme-loaded');

        document.addEventListener('DOMContentLoaded', function() {
          if (effectiveTheme === 'dark') document.body.classList.add('dark-mode');
          document.body.classList.add('theme-loaded');
        }, { once: true });

        if (document.documentElement.hasAttribute('data-anhad-home')) {
          try { sessionStorage.removeItem('gurbaniKhoj_state'); } catch(e) {}
        }
      } catch (e) {}
    })();
  </script>

  <style>
    :root {
      --bg-primary: #FAF8F5;
      --bg-card: #FFFFFF;
      --bg-soft: #F5F0EB;
      --bg-glass: rgba(255, 255, 255, 0.85);
      
      --accent-gold: #D4A03A;
      --accent-gold-dark: #B8860B;
      --gold-gradient: linear-gradient(135deg, #E6B04C 0%, #C88D23 100%);
      --gold-soft-bg: rgba(212, 160, 58, 0.12);
      
      --text-primary: #1A1D26;
      --text-secondary: #5A5F72;
      --text-tertiary: #8E95A5;
      
      --card-border: rgba(0, 0, 0, 0.06);
      --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.04), 0 2px 6px rgba(0, 0, 0, 0.02);
      
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-xl: 28px;
      
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 34px);
    }
    
    html.dark-mode,
    [data-theme="dark"] {
      --bg-primary: #0D0D0F;
      --bg-card: #16161A;
      --bg-soft: #1F1F24;
      --bg-glass: rgba(26, 26, 32, 0.85);
      
      --text-primary: #F5F5F7;
      --text-secondary: #A0A5B5;
      --text-tertiary: #686D7D;
      
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      --gold-soft-bg: rgba(230, 176, 76, 0.15);
    }
    
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: calc(88px + var(--safe-bottom));
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    /* Header matching Insights */
    .insights-header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 100;
      padding: calc(var(--safe-top) + 12px) 20px 14px 20px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: var(--bg-glass);
      border-bottom: 1px solid var(--card-border);
      max-width: 480px;
      margin: 0 auto;
    }
    
    .back-btn {
      position: absolute;
      left: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--bg-card);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--card-shadow);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .back-btn:active {
      transform: scale(0.92);
    }
    
    .insights-header__title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .insights-header__title span {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    /* Main App Container */
    .app {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 20px 24px 20px;
      width: 100%;
    }
    
    /* Hero Treasury Card */
    .fav-hero {
      position: relative;
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      padding: 22px 20px;
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      margin-bottom: 20px;
      overflow: hidden;
    }
    
    .fav-hero-glow {
      position: absolute;
      top: -30px;
      right: -30px;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(212, 160, 58, 0.25) 0%, rgba(212, 160, 58, 0) 70%);
      pointer-events: none;
      filter: blur(20px);
    }
    
    .fav-hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 100px;
      background: var(--gold-soft-bg);
      color: var(--accent-gold);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-bottom: 12px;
    }
    
    .fav-hero-quote {
      font-family: 'Noto Sans Gurmukhi', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.4;
      margin-bottom: 4px;
    }
    
    .fav-hero-meaning {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.4;
      margin-bottom: 18px;
    }
    
    /* Stats Grid */
    .fav-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    
    .fav-stat-card {
      background: var(--bg-soft);
      border-radius: var(--radius-md);
      padding: 10px 8px;
      text-align: center;
      border: 1px solid var(--card-border);
      cursor: pointer;
      transition: all 0.25s ease;
    }
    
    .fav-stat-card:hover {
      transform: translateY(-2px);
      border-color: rgba(212, 160, 58, 0.4);
    }
    
    .fav-stat-card:active {
      transform: scale(0.96);
    }
    
    .fav-stat-icon {
      font-size: 16px;
      margin-bottom: 2px;
    }
    
    .fav-stat-num {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-primary);
      display: block;
      line-height: 1.2;
    }
    
    .fav-stat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
    }
    
    /* Search Bar */
    .fav-search-wrapper {
      margin-bottom: 18px;
    }
    
    .fav-search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 11px 16px;
      box-shadow: var(--card-shadow);
      transition: all 0.2s ease;
    }
    
    .fav-search-bar:focus-within {
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 3px var(--gold-soft-bg);
    }
    
    .fav-search-icon {
      color: var(--text-tertiary);
      font-size: 14px;
    }
    
    .fav-search-input {
      flex: 1;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      outline: none;
    }
    
    .fav-search-input::placeholder {
      color: var(--text-tertiary);
    }
    
    .fav-clear-btn {
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 13px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* Modern Pill Tabs */
    .tabs-container {
      margin-bottom: 20px;
    }
    
    .tabs-pill {
      display: flex;
      gap: 6px;
      background: var(--bg-soft);
      padding: 5px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--card-border);
    }
    
    .tab-btn {
      flex: 1;
      min-width: 0;
      padding: 9px 10px;
      border: none;
      border-radius: 16px;
      background: transparent;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }
    
    .tab-btn i, .tab-btn .tab-btn__icon {
      font-size: 13px;
      flex-shrink: 0;
    }
    
    .tab-btn.active {
      background: var(--bg-card);
      color: var(--text-primary);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      font-weight: 700;
    }
    
    .tab-btn__badge {
      background: var(--gold-soft-bg);
      color: var(--accent-gold);
      padding: 2px 7px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }
    
    .tab-btn.active .tab-btn__badge {
      background: var(--gold-gradient);
      color: #FFFFFF;
    }
    
    /* Content Lists */
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    .favorites-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    /* Favorite Cards */
    .fav-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    
    .fav-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      border-color: rgba(212, 160, 58, 0.3);
    }
    
    .fav-card__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    
    .fav-card__type {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 100px;
      background: var(--gold-soft-bg);
      color: var(--accent-gold);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    
    .fav-card__actions {
      display: flex;
      gap: 8px;
    }
    
    .fav-card__action {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--bg-soft);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s ease;
    }
    
    .fav-card__action:hover {
      background: var(--gold-soft-bg);
      color: var(--accent-gold);
      transform: scale(1.08);
    }
    
    .fav-card__action--delete:hover {
      background: rgba(248, 113, 113, 0.15);
      color: #EF4444;
      border-color: rgba(239, 68, 68, 0.3);
    }
    
    .fav-card__gurmukhi {
      font-family: 'Noto Sans Gurmukhi', serif;
      font-size: 21px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.5;
      margin-bottom: 8px;
    }
    
    .fav-card__translation {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 14px;
    }
    
    .fav-card__meta {
      display: flex;
      gap: 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-tertiary);
      margin-bottom: 14px;
    }
    
    .fav-card__meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .fav-card__read-btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: var(--radius-md);
      background: var(--bg-soft);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--card-border);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .fav-card__read-btn i {
      color: var(--accent-gold);
      transition: transform 0.2s ease;
    }
    
    .fav-card__read-btn:hover {
      background: var(--gold-gradient);
      color: #FFFFFF;
      border-color: transparent;
      transform: translateY(-1px);
    }
    
    .fav-card__read-btn:hover i {
      color: #FFFFFF;
      transform: translateX(3px);
    }
    
    .fav-card__read-btn:active {
      transform: scale(0.98);
    }
    
    /* Notes & Bookmarks specifics */
    .fav-card--note {
      cursor: pointer;
    }
    
    .fav-note-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    
    .fav-note-text {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
      white-space: pre-line;
      margin-bottom: 12px;
    }
    
    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 44px 20px;
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
    }
    
    .empty-state-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(212, 160, 58, 0.15) 0%, transparent 70%);
      pointer-events: none;
      filter: blur(25px);
    }
    
    .empty-state__icon {
      font-size: 40px;
      margin-bottom: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--bg-soft);
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    
    .empty-state__title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    
    .empty-state__desc {
      font-size: 13px;
      color: var(--text-secondary);
      max-width: 280px;
      margin: 0 auto 20px auto;
      line-height: 1.5;
    }
    
    .empty-state__actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    
    .empty-cta-btn {
      padding: 10px 18px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      border: 1px solid var(--card-border);
      background: var(--bg-soft);
      color: var(--text-primary);
      text-decoration: none;
    }
    
    .empty-cta-btn--primary {
      background: var(--gold-gradient);
      color: #FFFFFF;
      border: none;
      box-shadow: 0 4px 12px rgba(212, 160, 58, 0.3);
    }
    
    .empty-cta-btn:hover {
      transform: translateY(-2px);
    }
    
    .empty-cta-btn:active {
      transform: scale(0.96);
    }
    
    /* Floating Action Button for Notes */
    .floating-add-btn {
      position: fixed;
      bottom: calc(96px + var(--safe-bottom));
      right: 24px;
      padding: 14px 20px;
      border-radius: 100px;
      border: none;
      background: var(--gold-gradient);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 25px rgba(212, 160, 58, 0.4);
      z-index: var(--z-fab, 50);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .floating-add-btn:hover {
      transform: scale(1.05) translateY(-2px);
      box-shadow: 0 12px 30px rgba(212, 160, 58, 0.5);
    }
    
    .floating-add-btn:active {
      transform: scale(0.95);
    }
    
    .floating-add-btn.hidden {
      display: none;
    }
    
    /* Custom Note Modal */
    .note-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: var(--z-modal, 500);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    
    .note-modal-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    
    .note-modal-sheet {
      position: relative;
      background: var(--bg-card);
      border-radius: 28px 28px 0 0;
      padding: 20px 24px calc(var(--safe-bottom) + 24px);
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      border-top: 1px solid var(--card-border);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.2);
      animation: sheetSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    @keyframes sheetSlideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    
    .note-modal-handle {
      width: 36px;
      height: 4px;
      background: var(--text-tertiary);
      border-radius: 4px;
      margin: 0 auto 16px auto;
      opacity: 0.4;
    }
    
    .note-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .note-modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }
    
    .note-modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--bg-soft);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    
    .note-input-group {
      margin-bottom: 16px;
    }
    
    .note-input-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-tertiary);
      margin-bottom: 6px;
    }
    
    .note-input-group input,
    .note-input-group textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--card-border);
      background: var(--bg-soft);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    
    .note-input-group input:focus,
    .note-input-group textarea:focus {

    .note-modal-save-btn {
      width: 100%;

    .note-modal-save-btn:active {

    }
    
    /* Custom Toast */
    .fav-toast {
      position: fixed;
      bottom: calc(90px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: rgba(22, 22, 26, 0.95);

      opacity: 0;
      pointer-events: none;

    .fav-toast.show {

    }
  </style>
</head>

    <script src="../lib/overlay-player.js" defer></script>

  <!-- Favorites Page Engine -->
  <script>
    (function() {
      'use strict';
      
      const STORAGE_KEYS = {
        SHABADS: 'gurbani_favorite_shabads',
        BOOKMARKS: 'sehajPaathBookmarks',
        NOTES: 'gurbani_notes_v2'
      };
      
      let currentActiveTab = 'shabads';
      let searchQuery = '';
      
      // DOM Elements
      const tabBtns = document.querySelectorAll('.tab-btn');
      const tabContents = document.querySelectorAll('.tab-content');
      const addNoteBtn = document.getElementById('addNoteBtn');
      const searchInput = document.getElementById('favSearchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');
      const statCards = document.querySelectorAll('.fav-stat-card');
      
      const noteModalOverlay = document.getElementById('noteModalOverlay');
      const noteModalBackdrop = document.getElementById('noteModalBackdrop');
      const closeNoteModalBtn = document.getElementById('closeNoteModalBtn');
      const saveNoteBtn = document.getElementById('saveNoteBtn');
      const noteTitleInput = document.getElementById('noteTitleInput');
      const noteAngInput = document.getElementById('noteAngInput');
      const noteContentInput = document.getElementById('noteContentInput');
      const editingNoteId = document.getElementById('editingNoteId');
      const noteModalTitle = document.getElementById('noteModalTitle');
      const favToast = document.getElementById('favToast');

      function showToast(msg) {
        if (!favToast) return;
        favToast.textContent = msg;
        favToast.classList.add('show');
        setTimeout(() => favToast.classList.remove('show'), 2600);
      }
      
      // Tab switching
      function switchTab(tabId) {
        currentActiveTab = tabId;
        
        tabBtns.forEach(btn => {
          const isActive = btn.dataset.tab === tabId;
          btn.classList.toggle('active', isActive);
          btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
        });
        
        tabContents.forEach(tc => {
          tc.classList.toggle('active', tc.id === `${tabId}Tab`);
        });
        
        if (addNoteBtn) {
          addNoteBtn.classList.toggle('hidden', tabId !== 'notes');
        }
      }
      
      tabBtns.forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });
      
      statCards.forEach(card => {
        card.addEventListener('click', () => switchTab(card.dataset.tabTarget));
      });
      
      // Search / Filter
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          searchQuery = e.target.value.toLowerCase().trim();
          if (clearSearchBtn) clearSearchBtn.style.display = searchQuery ? 'flex' : 'none';
          renderAll();
        });
      }
      
      if (clearSearchBtn) {
        clearSearchBtn.addEventListener('click', () => {
          if (searchInput) searchInput.value = '';
          searchQuery = '';
          clearSearchBtn.style.display = 'none';
          renderAll();
        });
      }
      
      // Format Date Helper
      function formatDate(timestamp) {
        if (!timestamp) return 'Recently';
        const date = new Date(timestamp);
        const now = new Date();
        const diff = now - date;
        
        if (diff < 86400000) return 'Today';
        if (diff < 172800000) return 'Yesterday';
        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }
      
      // Render All Sections
      function renderAll() {
        renderShabads();
        renderBookmarks();
        renderNotes();
      }
      
      // 1. Render Shabads
      function renderShabads() {
        const container = document.getElementById('shabadsList');
        const countBadge = document.getElementById('shabadCount');
        const heroBadge = document.getElementById('heroShabadCount');
        
        try {
          const raw = JSON.parse(localStorage.getItem(STORAGE_KEYS.SHABADS) || '[]');
          if (countBadge) countBadge.textContent = raw.length;
          if (heroBadge) heroBadge.textContent = raw.length;
          
          let filtered = raw;
          if (searchQuery) {
            filtered = raw.filter(s => 
              (s.gurmukhi && s.gurmukhi.toLowerCase().includes(searchQuery)) ||
              (s.translation && s.translation.toLowerCase().includes(searchQuery)) ||
              (s.english && s.english.toLowerCase().includes(searchQuery)) ||
              (s.source && s.source.toLowerCase().includes(searchQuery)) ||
              (s.ang && String(s.ang).includes(searchQuery))
            );
          }
          
          if (filtered.length === 0) {
            container.innerHTML = `
              <div class="empty-state">
                <div class="empty-state-glow"></div>
                <div class="empty-state__icon">🪯</div>
                <h3 class="empty-state__title">${searchQuery ? 'No Matching Shabads' : 'No Saved Shabads Yet'}</h3>
                <p class="empty-state__desc">${searchQuery ? 'Try searching with different keywords or clear your search.' : 'Save inspiring Shabads from Gurbani Khoj to build your personal spiritual sanctuary.'}</p>
                <div class="empty-state__actions">
                  <a href="../GurbaniKhoj/gurbani-khoj.html" class="empty-cta-btn empty-cta-btn--primary">
                    <i class="fas fa-search"></i> Explore Gurbani Khoj
                  </a>
                </div>
              </div>
            `;
            return;
          }
          
          container.innerHTML = filtered.map((shabad, i) => {
            const actualIndex = raw.indexOf(shabad);
            return `
              <div class="fav-card" data-index="${actualIndex}" data-type="shabad">
                <div class="fav-card__header">
                  <span class="fav-card__type">
                    <i class="fas fa-bookmark"></i> ${shabad.source || 'Gurbani'}
                  </span>
                  <div class="fav-card__actions">
                    <button class="fav-card__action" onclick="event.stopPropagation(); shareShabad(${actualIndex})" title="Share Shabad" aria-label="Share">
                      <i class="fas fa-share-nodes"></i>
                    </button>
                    <button class="fav-card__action fav-card__action--delete" onclick="event.stopPropagation(); deleteShabad(${actualIndex})" title="Delete" aria-label="Delete">
                      <i class="fas fa-trash-can"></i>
                    </button>
                  </div>
                </div>
                <div class="fav-card__gurmukhi">${shabad.gurmukhi || ''}</div>
                <div class="fav-card__translation">${shabad.translation || shabad.english || ''}</div>
                <div class="fav-card__meta">
                  <span class="fav-card__meta-item">
                    <i class="fas fa-book-open"></i> Ang ${shabad.ang || '—'}
                  </span>
                  <span class="fav-card__meta-item">
                    <i class="fas fa-clock"></i> ${formatDate(shabad.savedAt)}
                  </span>
                </div>
                <button class="fav-card__read-btn" onclick="openShabad(${actualIndex})">
                  <span>Read Full Shabad</span> <i class="fas fa-arrow-right"></i>
                </button>
              </div>
            `;
          }).join('');
        } catch (e) {
          console.error('Error loading shabads:', e);
        }
      }
      
      // 2. Render Bookmarks
      function renderBookmarks() {
        const container = document.getElementById('bookmarksList');
        const countBadge = document.getElementById('bookmarkCount');
        const heroBadge = document.getElementById('heroBookmarkCount');
        
        try {
          const raw = JSON.parse(localStorage.getItem(STORAGE_KEYS.BOOKMARKS) || '[]');
          if (countBadge) countBadge.textContent = raw.length;
          if (heroBadge) heroBadge.textContent = raw.length;
          
          let filtered = raw;
          if (searchQuery) {
            filtered = raw.filter(b => 
              (b.ang && String(b.ang).includes(searchQuery)) ||
              (b.note && b.note.toLowerCase().includes(searchQuery))
            );
          }
          
          if (filtered.length === 0) {
            container.innerHTML = `
              <div class="empty-state">
                <div class="empty-state-glow"></div>
                <div class="empty-state__icon">📖</div>
                <h3 class="empty-state__title">${searchQuery ? 'No Matching Bookmarks' : 'No Bookmarked Angs'}</h3>
                <p class="empty-state__desc">${searchQuery ? 'Try searching for another Ang number or note.' : 'Bookmark Angs while reading in Sehaj Paath Reader to save your reading journey.'}</p>
                <div class="empty-state__actions">
                  <a href="../SehajPaath/sehaj-paath.html" class="empty-cta-btn empty-cta-btn--primary">
                    <i class="fas fa-book-open"></i> Open Sehaj Paath
                  </a>
                </div>
              </div>
            `;
            return;
          }
          
          container.innerHTML = filtered.map((bm, i) => {
            const actualIndex = raw.indexOf(bm);
            return `
              <div class="fav-card" data-href="../SehajPaath/reader.html?ang=${bm.ang}">
                <div class="fav-card__header">
                  <span class="fav-card__type">
                    <i class="fas fa-book-bookmark"></i> Ang ${bm.ang}
                  </span>
                  <div class="fav-card__actions">
                    <button class="fav-card__action fav-card__action--delete" onclick="event.stopPropagation(); deleteBookmark(${actualIndex})" title="Delete" aria-label="Delete">
                      <i class="fas fa-trash-can"></i>
                    </button>
                  </div>
                </div>
                <div class="fav-note-title">Sri Guru Granth Sahib Ji — Ang ${bm.ang}</div>
                <div class="fav-card__translation">${bm.note || 'Bookmarked page during Sehaj Paath reading'}</div>
                <div class="fav-card__meta">
                  <span class="fav-card__meta-item">
                    <i class="fas fa-clock"></i> ${formatDate(bm.timestamp)}
                  </span>
                </div>
                <button class="fav-card__read-btn" onclick="openBookmarkAng(${bm.ang})">
                  <span>Open Ang ${bm.ang} in Reader</span> <i class="fas fa-arrow-right"></i>
                </button>
              </div>
            `;
          }).join('');
        } catch (e) {
          console.error('Error loading bookmarks:', e);
        }
      }
      
      // 3. Render Notes
      function renderNotes() {
        const container = document.getElementById('notesList');
        const countBadge = document.getElementById('noteCount');
        const heroBadge = document.getElementById('heroNoteCount');
        
        try {
          const raw = JSON.parse(localStorage.getItem(STORAGE_KEYS.NOTES) || '[]');
          if (countBadge) countBadge.textContent = raw.length;
          if (heroBadge) heroBadge.textContent = raw.length;
          
          let filtered = raw;
          if (searchQuery) {
            filtered = raw.filter(n => 
              (n.title && n.title.toLowerCase().includes(searchQuery)) ||
              (n.text && n.text.toLowerCase().includes(searchQuery)) ||
              (n.content && n.content.toLowerCase().includes(searchQuery)) ||
              (n.ang && String(n.ang).includes(searchQuery))
            );
          }
          
          if (filtered.length === 0) {
            container.innerHTML = `
              <div class="empty-state">
                <div class="empty-state-glow"></div>
                <div class="empty-state__icon">✍️ï¸</div>
                <h3 class="empty-state__title">${searchQuery ? 'No Matching Notes' : 'No Notes Yet'}</h3>
                <p class="empty-state__desc">${searchQuery ? 'Try a different search query.' : 'Reflect and write personal thoughts, meanings, and insights on Gurbani.'}</p>
                <div class="empty-state__actions">
                  <button onclick="openAddNoteModal()" class="empty-cta-btn empty-cta-btn--primary">
                    <i class="fas fa-plus"></i> Create First Note
                  </button>
                </div>
              </div>
            `;
            return;
          }
          
          container.innerHTML = filtered.map((note, i) => {
            const noteText = note.text || note.content || '';
            const noteTitle = note.title || (note.ang ? `Note on Ang ${note.ang}` : 'Gurbani Reflection');
            const noteId = note.id || String(note.timestamp || i);
            
            return `
              <div class="fav-card fav-card--note" onclick="editNote('${noteId}')">
                <div class="fav-card__header">
                  <span class="fav-card__type">
                    <i class="fas fa-pen-nib"></i> ${note.ang ? `Ang ${note.ang}` : 'Reflection'}
                  </span>
                  <div class="fav-card__actions">
                    <button class="fav-card__action" onclick="event.stopPropagation(); editNote('${noteId}')" title="Edit Note" aria-label="Edit">
                      <i class="fas fa-pen"></i>
                    </button>
                    <button class="fav-card__action fav-card__action--delete" onclick="event.stopPropagation(); deleteNote('${noteId}')" title="Delete" aria-label="Delete">
                      <i class="fas fa-trash-can"></i>
                    </button>
                  </div>
                </div>
                <h3 class="fav-note-title">${noteTitle}</h3>
                <p class="fav-note-text">${noteText}</p>
                <div class="fav-card__meta">
                  <span class="fav-card__meta-item">
                    <i class="fas fa-clock"></i> ${formatDate(note.modifiedAt || note.timestamp || Date.now())}
                  </span>
                </div>
              </div>
            `;
          }).join('');
        } catch (e) {
          console.error('Error loading notes:', e);
        }
      }
      
      // Global Action Functions
      window.shareShabad = async function(index) {
        const shabads = JSON.parse(localStorage.getItem(STORAGE_KEYS.SHABADS) || '[]');
        const shabad = shabads[index];
        if (!shabad) return;
        
        if (window.AnhadShare) {
          await AnhadShare.showPreview({
            gurmukhi: shabad.gurmukhi,
            transliteration: shabad.transliteration || '',
            translation: shabad.translation || shabad.english,
            source: shabad.ang ? `Ang ${shabad.ang}` : (shabad.source || 'Sri Guru Granth Sahib Ji')
          });
        } else if (navigator.share) {
          navigator.share({
            title: 'Gurbani Shabad',
            text: `${shabad.gurmukhi}\n\n${shabad.translation || shabad.english}\n- ${shabad.source || 'Gurbani'}`
          }).catch(() => {});
        } else {
          showToast('📋 Copied to clipboard!');
        }
      };
      
      window.deleteShabad = function(index) {
        if (!confirm('Remove this Shabad from your favorites?')) return;
        const shabads = JSON.parse(localStorage.getItem(STORAGE_KEYS.SHABADS) || '[]');
        shabads.splice(index, 1);
        localStorage.setItem(STORAGE_KEYS.SHABADS, JSON.stringify(shabads));
        showToast('🗑ï¸ Shabad removed');
        renderShabads();
      };
      
      window.deleteBookmark = function(index) {
        if (!confirm('Remove this bookmark?')) return;
        const bookmarks = JSON.parse(localStorage.getItem(STORAGE_KEYS.BOOKMARKS) || '[]');
        bookmarks.splice(index, 1);
        localStorage.setItem(STORAGE_KEYS.BOOKMARKS, JSON.stringify(bookmarks));
        showToast('🗑ï¸ Bookmark removed');
        renderBookmarks();
      };
      
      window.deleteNote = function(noteId) {
        if (!confirm('Delete this note?')) return;
        const notes = JSON.parse(localStorage.getItem(STORAGE_KEYS.NOTES) || '[]');
        const updated = notes.filter(n => (n.id || String(n.timestamp)) !== noteId);
        localStorage.setItem(STORAGE_KEYS.NOTES, JSON.stringify(updated));
        showToast('🗑ï¸ Note deleted');
        renderNotes();
      };
      
      window.openShabad = function(index) {
        const shabads = JSON.parse(localStorage.getItem(STORAGE_KEYS.SHABADS) || '[]');
        const shabad = shabads[index];
        if (!shabad) return;
        
        const shabadId = shabad.shabadId || shabad.id;
        if (shabadId) {
          const target = `../GurbaniKhoj/shabad-reader.html?shabad=${shabadId}`;
          if (window.navigateTo) window.navigateTo(target);
          else window.location.href = target;
        } else if (shabad.ang) {
          const target = `../SehajPaath/reader.html?ang=${shabad.ang}`;
          if (window.navigateTo) window.navigateTo(target);
          else window.location.href = target;
        }
      };
      
      window.openBookmarkAng = function(ang) {
        const target = `../SehajPaath/reader.html?ang=${ang}`;
        if (window.navigateTo) window.navigateTo(target);
        else window.location.href = target;
      };
      
      // Note Modal Handlers
      window.openAddNoteModal = function() {
        if (editingNoteId) editingNoteId.value = '';
        if (noteTitleInput) noteTitleInput.value = '';
        if (noteAngInput) noteAngInput.value = '';
        if (noteContentInput) noteContentInput.value = '';
        if (noteModalTitle) noteModalTitle.textContent = '✍️ï¸ New Gurbani Note';
        if (noteModalOverlay) noteModalOverlay.style.display = 'flex';
        document.body.classList.add('modal-open');
      };
      
      window.editNote = function(noteId) {
        const notes = JSON.parse(localStorage.getItem(STORAGE_KEYS.NOTES) || '[]');
        const note = notes.find(n => (n.id || String(n.timestamp)) === noteId);
        if (!note) return;
        
        if (editingNoteId) editingNoteId.value = noteId;
        if (noteTitleInput) noteTitleInput.value = note.title || '';
        if (noteAngInput) noteAngInput.value = note.ang || '';
        if (noteContentInput) noteContentInput.value = note.text || note.content || '';
        if (noteModalTitle) noteModalTitle.textContent = '✍️ï¸ Edit Note';
        if (noteModalOverlay) noteModalOverlay.style.display = 'flex';
        document.body.classList.add('modal-open');
      };
      
      function closeNoteModal() {
        if (noteModalOverlay) noteModalOverlay.style.display = 'none';
        // Same signal Insights/Home use so the mini player defers to this
        // modal the same way it defers to theirs (frontend/css/global-mini-player.css).
        document.body.classList.remove('modal-open');
      }
      
      if (closeNoteModalBtn) closeNoteModalBtn.addEventListener('click', closeNoteModal);
      if (noteModalBackdrop) noteModalBackdrop.addEventListener('click', closeNoteModal);
      if (addNoteBtn) addNoteBtn.addEventListener('click', window.openAddNoteModal);
      
      if (saveNoteBtn) {
        saveNoteBtn.addEventListener('click', () => {
          const content = noteContentInput ? noteContentInput.value.trim() : '';
          if (!content) {
            alert('Please write your note content.');
            return;
          }
          
          const title = noteTitleInput ? noteTitleInput.value.trim() : '';
          const ang = noteAngInput && noteAngInput.value ? parseInt(noteAngInput.value) : null;
          const id = editingNoteId && editingNoteId.value ? editingNoteId.value : 'note_' + Date.now();
          
          const notes = JSON.parse(localStorage.getItem(STORAGE_KEYS.NOTES) || '[]');
          const existingIdx = notes.findIndex(n => (n.id || String(n.timestamp)) === id);
          
          const noteObj = {
            id: id,
            title: title || (ang ? `Note on Ang ${ang}` : 'Gurbani Reflection'),
            text: content,
            ang: ang,
            modifiedAt: Date.now(),
            timestamp: existingIdx !== -1 ? (notes[existingIdx].timestamp || Date.now()) : Date.now()
          };
          
          if (existingIdx !== -1) {
            notes[existingIdx] = noteObj;
          } else {
            notes.unshift(noteObj);
          }
          
          localStorage.setItem(STORAGE_KEYS.NOTES, JSON.stringify(notes));
          closeNoteModal();
          showToast('✅ Note saved successfully');
          renderNotes();
        });
      }
      
      // Initial Boot
      renderAll();
    })();
  </script>
</body>
</html>
