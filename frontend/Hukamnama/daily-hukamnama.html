<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <!-- CRITICAL: Theme blocker - MUST run before paint -->
    <script>
(function() {
  try {
    const theme = localStorage.getItem('anhad_theme') || 'auto';
    let effectiveTheme = theme;
    if (theme === 'auto') {
      const hour = new Date().getHours();
      effectiveTheme = (hour >= 5 && hour < 20) ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', effectiveTheme);
    document.documentElement.setAttribute('data-theme-mode', theme);
    // Note: data-time-of-day is NOT set on sub-pages - home page only.
    // Sub-pages use clean light/dark mode. Morning/day/evening/night palette is index.html only.
    document.documentElement.style.colorScheme = effectiveTheme;
    if (effectiveTheme === 'dark') {
      document.documentElement.classList.add('dark', 'dark-mode');
      document.documentElement.style.backgroundColor = '#0D0D0F';
    } else {
      document.documentElement.classList.remove('dark', 'dark-mode');
      document.documentElement.style.backgroundColor = '#FAF8F5';
    }
  } catch (e) {}
})();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Daily Hukamnama | ANHAD</title>
    
    <!-- Core Frameworks -->
    <link rel="stylesheet" href="../css/anhad-core.css">
    <link rel="stylesheet" href="../css/theme-variables.css">
    <link rel="stylesheet" href="../css/nav-glass.css">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --hukam-gold: #FFB347;
            --hukam-gold-rgb: 255, 179, 71;
            --hukam-accent: #B8860B;
            --ios-bg: #000000;
            --card-bg: rgba(28, 28, 30, 0.75);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --safe-top: env(safe-area-inset-top, 0px);
            --header-height: calc(64px + var(--safe-top));
        }

        [data-theme="light"] {
            --ios-bg: #F2F2F7;
            --card-bg: rgba(255, 255, 255, 0.85);
            --glass-bg: rgba(0, 0, 0, 0.04);
            --text-primary: #1C1C1E;
            --text-secondary: rgba(60, 60, 67, 0.6);
        }

        body {
            background-color: var(--ios-bg);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Hide Scrollbar */
        #mainScroll::-webkit-scrollbar {
            display: none;
        }
        #mainScroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* ═══════════════════════════════════════════════════════════════
           HERO SECTION
           ═══════════════════════════════════════════════════════════════ */
        .hero {
            position: relative;
            width: 100%;
            height: 42vh;
            min-height: 320px;
            overflow: hidden;
            background-color: #000;
        }

        .hero-image-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: opacity 0.8s ease;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
            filter: brightness(0.7) contrast(1.1);
            transform: scale(1.05);
            transition: transform 12s cubic-bezier(0.1, 0, 0.9, 1);
        }

        [data-theme="light"] .hero-image {
            filter: brightness(0.9) contrast(1.0);
        }

        .hero.panning .hero-image {
            transform: scale(1.25) translateX(2%);
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, 
                rgba(0,0,0,0.25) 0%, 
                rgba(0,0,0,0) 100%);
            z-index: 2;
        }



        [data-theme="light"] .hero-overlay {
            background: linear-gradient(to bottom, 
                rgba(0,0,0,0.1) 0%, 
                rgba(0,0,0,0) 100%);
        }

        /* ═══════════════════════════════════════════════════════════════
           HEADER
           ═══════════════════════════════════════════════════════════════ */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            padding-top: var(--safe-top);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 16px;
            padding-right: 16px;
            box-sizing: border-box;
            z-index: 1000;
            transition: background 0.4s ease, backdrop-filter 0.4s ease;
        }

        .app-header.scrolled {
            background: var(--card-bg);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border-bottom: 0.5px solid rgba(128,128,128,0.2);
        }

        .header-btn {
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: rgba(0,0,0,0.3);
            border: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transition: all 0.2s ease;
        }

        [data-theme="light"] .header-btn {
            background: rgba(255,255,255,0.6);
            color: #000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .header-btn:active {
            transform: scale(0.85);
            opacity: 0.7;
        }

        .header-title-small {
            font-weight: 700;
            font-size: 1.05rem;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            color: var(--text-primary);
            transform: translateY(5px);
        }

        .app-header.scrolled .header-title-small {
            opacity: 1;
            transform: translateY(0);
        }

        /* ═══════════════════════════════════════════════════════════════
           CONTENT
           ═══════════════════════════════════════════════════════════════ */
        .content-container {
            position: relative;
            z-index: 10;
            margin-top: -60px;
            background-color: var(--ios-bg);
            border-radius: 40px 40px 0 0;
            padding-bottom: 150px;
            box-shadow: 0 -20px 40px rgba(0,0,0,0.15);
            transition: background-color 0.4s ease, margin-top 0.3s ease;
        }

        [data-theme="light"] .content-container {
            box-shadow: 0 -15px 30px rgba(0,0,0,0.05);
        }

        .meta-strip {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 30px 16px;
            border-bottom: 0.5px solid rgba(128,128,128,0.15);
        }

        .meta-item {
            text-align: center;
        }

        .meta-value {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--hukam-gold);
            display: block;
        }

        .meta-label {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            opacity: 0.5;
            letter-spacing: 0.5px;
        }

        .hukamnama-body {
            padding: 32px 24px;
            max-width: 800px;
            margin: 0 auto;
        }

        .verse-container {
            margin-bottom: 40px;
            text-align: center;
        }

        .verse-gurmukhi {
            font-family: 'Noto Sans Gurmukhi', sans-serif;
            font-size: 1.5rem;
            line-height: 1.8;
            color: var(--text-primary);
            margin-bottom: 16px;
            font-weight: 500;
            word-wrap: break-word;
        }

        .verse-translit {
            font-size: 0.95rem;
            font-style: italic;
            color: var(--text-secondary);
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .verse-translation {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--hukam-gold);
            opacity: 0.95;
        }

        .verse-punjabi {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #34C759;
            margin-top: 8px;
            font-weight: 500;
        }

        /* ═══════════════════════════════════════════════════════════════
           SKELETON LOADER
           ═══════════════════════════════════════════════════════════════ */
        .skeleton-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            background: var(--ios-bg);
            display: flex;
            flex-direction: column;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .skeleton-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .skeleton-hero {
            height: 42vh;
            background: linear-gradient(110deg, #1c1c1e 8%, #2c2c2e 18%, #1c1c1e 33%);
            background-size: 200% 100%;
            animation: skeleton-shine 1.5s linear infinite;
        }

        [data-theme="light"] .skeleton-hero {
            background: linear-gradient(110deg, #e5e5ea 8%, #f2f2f7 18%, #e5e5ea 33%);
        }

        .skeleton-content {
            flex: 1;
            padding: 40px 24px;
            background: var(--ios-bg);
            border-radius: 40px 40px 0 0;
            margin-top: -60px;
        }

        .skeleton-line {
            height: 20px;
            background: rgba(128,128,128,0.1);
            margin-bottom: 15px;
            border-radius: 10px;
            background: linear-gradient(110deg, #2c2c2e 8%, #3a3a3c 18%, #2c2c2e 33%);
            background-size: 200% 100%;
            animation: skeleton-shine 1.5s linear infinite;
        }

        [data-theme="light"] .skeleton-line {
            background: linear-gradient(110deg, #f2f2f7 8%, #ffffff 18%, #f2f2f7 33%);
        }

        @keyframes skeleton-shine {
            to { background-position-x: -200%; }
        }

        /* ═══════════════════════════════════════════════════════════════
           TAB BAR / ACTIONS
           ═══════════════════════════════════════════════════════════════ */
        .action-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(28, 28, 30, 0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 14px 28px;
            border-radius: 40px;
            display: flex;
            gap: 24px;
            border: 0.5px solid rgba(255,255,255,0.1);
            z-index: 1000;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] .action-bar {
            background: rgba(255, 255, 255, 0.85);
            border: 0.5px solid rgba(0,0,0,0.1);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }

        .action-btn {
            background: none;
            border: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.85;
            transition: all 0.2s ease;
        }

        [data-theme="light"] .action-btn {
            color: #000;
        }

        .action-btn:active {
            transform: scale(0.9);
            opacity: 1;
        }

        .action-btn span {
            display: none; /* Removed text for cleaner look */
        }

        .action-btn svg {
            width: 26px;
            height: 26px;
        }

        /* ═══════════════════════════════════════════════════════════════
           HUKAMNAMA MINI PLAYER BAR
           ═══════════════════════════════════════════════════════════════ */
        .hukam-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(18, 18, 18, 0.96);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border-top: 0.5px solid rgba(255,179,71,0.2);
            padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
            box-sizing: border-box;
            z-index: 1100;
            transform: translateY(100%);
            transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 -8px 40px rgba(0,0,0,0.6);
        }

        [data-theme="light"] .hukam-player {
            background: rgba(248, 248, 250, 0.96);
            border-top: 0.5px solid rgba(255,179,71,0.3);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
        }

        .hukam-player.visible {
            transform: translateY(0);
        }

        .hukam-player-top {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .hukam-player-info {
            flex: 1;
            min-width: 0;
        }

        .hukam-player-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hukam-player-sub {
            font-size: 0.72rem;
            color: var(--hukam-gold);
            margin-top: 2px;
            font-weight: 500;
        }

        .hukam-play-btn {
            width: 48px;
            height: 48px;
            border-radius: 24px;
            background: var(--hukam-gold);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(255,179,71,0.4);
        }

        .hukam-play-btn:active { transform: scale(0.9); }

        .hukam-play-btn svg { color: #000; width: 22px; height: 22px; }

        .hukam-close-btn {
            width: 32px;
            height: 32px;
            border-radius: 16px;
            background: rgba(128,128,128,0.15);
            border: none;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .hukam-close-btn:active { transform: scale(0.85); }

        /* Progress bar */
        .hukam-progress-wrap {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hukam-time {
            font-size: 0.68rem;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            min-width: 36px;
        }

        .hukam-progress-track {
            flex: 1;
            height: 4px;
            background: rgba(128,128,128,0.2);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .hukam-progress-fill {
            height: 100%;
            background: var(--hukam-gold);
            border-radius: 2px;
            width: 0%;
            transition: width 0.5s linear;
        }

        /* Waveform loading indicator */
        .hukam-loading {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 22px;
        }

        .hukam-loading span {
            display: block;
            width: 3px;
            background: var(--hukam-gold);
            border-radius: 2px;
            animation: waveBar 1.2s ease-in-out infinite;
        }

        .hukam-loading span:nth-child(1) { height: 8px; animation-delay: 0s; }
        .hukam-loading span:nth-child(2) { height: 16px; animation-delay: 0.15s; }
        .hukam-loading span:nth-child(3) { height: 22px; animation-delay: 0.3s; }
        .hukam-loading span:nth-child(4) { height: 14px; animation-delay: 0.45s; }
        .hukam-loading span:nth-child(5) { height: 10px; animation-delay: 0.6s; }

        @keyframes waveBar {
            0%, 100% { transform: scaleY(0.5); opacity: 0.5; }
            50% { transform: scaleY(1); opacity: 1; }
        }

        /* Push action bar up when player is visible */
        .action-bar.player-open {
            transform: translateX(-50%) translateY(-90px);
        }

        /* ═══════════════════════════════════════════════════════════════
           MODALS
           ═══════════════════════════════════════════════════════════════ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: none;
            align-items: flex-end;
        }

        .modal-content {
            width: 100%;
            background: #1c1c1e;
            border-radius: 35px 35px 0 0;
            padding: 30px 24px;
            padding-bottom: calc(30px + env(safe-area-inset-bottom));
            box-sizing: border-box;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.1, 0, 0, 1);
            color: #fff;
        }

        [data-theme="light"] .modal-content {
            background: #FFFFFF;
            color: #000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .settings-grid {
            display: grid;
            gap: 28px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .setting-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        .theme-toggle-strip {
            display: flex;
            background: rgba(128,128,128,0.1);
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
            margin-bottom: 5px;
        }

        .theme-pill {
            flex: 1;
            padding: 8px;
            border-radius: 10px;
            border: none;
            background: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .theme-pill.active {
            background: var(--hukam-gold);
            color: #000;
            box-shadow: 0 2px 8px rgba(var(--hukam-gold-rgb), 0.3);
        }

        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #3a3a3c;
            border-radius: 3px;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 12px;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ═══════════════════════════════════════════════════════════════
           UTILITIES
           ═══════════════════════════════════════════════════════════════ */
        .hidden { display: none !important; }
        .pa { font-family: 'Noto Sans Gurmukhi', sans-serif; }
    </style>
</head>
<body>

    <!-- Loading Skeleton -->
    <div id="skeletonLoader" class="skeleton-container">
        <div class="skeleton-hero"></div>
        <div class="skeleton-content">
            <div class="skeleton-line" style="width: 60%; margin: 0 auto 30px;"></div>
            <div class="skeleton-line" style="width: 90%;"></div>
            <div class="skeleton-line" style="width: 85%;"></div>
            <div class="skeleton-line" style="width: 80%;"></div>
            <div class="skeleton-line" style="width: 95%; margin-top: 40px;"></div>
            <div class="skeleton-line" style="width: 90%;"></div>
        </div>
    </div>

    <!-- Header -->
    <header class="app-header" id="header">
        <button class="header-btn" id="backBtn" onclick="if(window.anhadGoBack) window.anhadGoBack('../index.html'); else window.location.href='../index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </button>
        <span class="header-title-small" id="headerTitleSmall">Daily Hukamnama</span>
        <button class="header-btn" id="settingsBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </button>
    </header>

    <!-- Main Content Scroll Area -->
    <div id="mainScroll" style="height: 100vh; overflow-y: auto; scroll-behavior: smooth;">
        
        <!-- Hero Section -->
        <section class="hero" id="hero">
            <div class="hero-image-container">
                <img id="guruImage" src="../guruimages/gurugranthsahebji.jpeg" class="hero-image" alt="Guru Image">
            </div>
            <div class="hero-overlay"></div>
        </section>

        <!-- Content Area -->
        <div class="content-container">

            
            <!-- Meta Strip -->
            <div class="meta-strip">
                <div class="meta-item">
                    <span class="meta-value" id="metaDate">--</span>
                    <span class="meta-label">Date</span>
                </div>
                <div class="meta-item">
                    <span class="meta-value" id="metaAng">--</span>
                    <span class="meta-label">Ang</span>
                </div>
                <div class="meta-item">
                    <span class="meta-value" id="metaRaag">--</span>
                    <span class="meta-label">Raag</span>
                </div>
                <div class="meta-item">
                    <span class="meta-value" id="metaWriter">--</span>
                    <span class="meta-label">Writer</span>
                </div>
            </div>

            <!-- Hukamnama Content -->
            <main class="hukamnama-body" id="hukamContent">
                <!-- Verses will be injected here -->
            </main>
        </div>
    </div>

    <!-- Action Bar -->
    <nav class="action-bar" id="actionBar">
        <button class="action-btn" id="shareBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
            </svg>
            <span>Share</span>
        </button>
        <button class="action-btn" id="calendarBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span>History</span>
        </button>
        <button class="action-btn" id="audioBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            </svg>
            <span>Listen</span>
        </button>
    </nav>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
                <h2 style="margin:0; font-size:1.5rem;">Display Settings</h2>
                <button id="closeSettings" style="background:none; border:none; color:var(--hukam-gold); font-weight:700;">Done</button>
            </div>
            
            <div class="settings-grid">
                <div class="setting-group">
                    <label class="setting-label">App Theme</label>
                    <div class="theme-toggle-strip">
                        <button class="theme-pill" data-theme-val="light">Light</button>
                        <button class="theme-pill" data-theme-val="dark">Dark</button>
                        <button class="theme-pill" data-theme-val="auto">Auto</button>
                    </div>
                </div>

                <div class="setting-group">
                    <div style="display:flex; justify-content:space-between;">
                        <span class="setting-label">Font Size</span>
                        <span id="fontSizeDisplay">24px</span>
                    </div>
                    <input type="range" class="slider" id="fontSizeSlider" min="16" max="42" value="24">
                </div>

                <div class="setting-group">
                    <div class="toggle-container">
                        <span class="setting-label">Transliteration</span>
                        <input type="checkbox" id="translitToggle" checked>
                    </div>
                </div>

                <div class="setting-group">
                    <div class="toggle-container">
                        <span class="setting-label">English Translation</span>
                        <input type="checkbox" id="englishToggle" checked>
                    </div>
                </div>

                <div class="setting-group">
                    <div class="toggle-container">
                        <span class="setting-label">Punjabi Translation</span>
                        <input type="checkbox" id="punjabiToggle" checked>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hukamnama Mini Audio Player -->
    <div class="hukam-player" id="hukamPlayer">
        <div class="hukam-player-top">
            <!-- Waveform (loading/playing indicator) -->
            <div class="hukam-loading" id="hukamWave">
                <span></span><span></span><span></span><span></span><span></span>
            </div>
            <!-- Info -->
            <div class="hukam-player-info">
                <div class="hukam-player-title">Daily Hukamnama</div>
                <div class="hukam-player-sub" id="hukamPlayerSub">Sachkhand Sri Harmandir Sahib</div>
            </div>
            <!-- Play/Pause -->
            <button class="hukam-play-btn" id="hukamPlayBtn" aria-label="Play/Pause">
                <!-- Pause icon (shown when playing) -->
                <svg id="hukamPauseIcon" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>
                </svg>
                <!-- Play icon (shown when paused) -->
                <svg id="hukamPlayIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                    <polygon points="5,3 19,12 5,21"/>
                </svg>
            </button>
            <!-- Close -->
            <button class="hukam-close-btn" id="hukamCloseBtn" aria-label="Close player">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
        <!-- Progress -->
        <div class="hukam-progress-wrap">
            <span class="hukam-time" id="hukamCurrent">0:00</span>
            <div class="hukam-progress-track" id="hukamProgressTrack">
                <div class="hukam-progress-fill" id="hukamProgressFill"></div>
            </div>
            <span class="hukam-time" id="hukamDuration">--:--</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../lib/smart-back.js?v=2.1"></script>
    <script src="../lib/anhad-audio-singleton.js?v=2.5"></script>
    <script src="daily-hukamnama.js?v=2.6"></script>
</body>
</html>
