<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <!-- CRITICAL: Theme blocker - MUST run before paint -->
  <script>
    (function() {
      try {
        const theme = localStorage.getItem('anhad_theme') || 'auto';
        let effectiveTheme = theme;
        let timeOfDay = localStorage.getItem('anhad_forced_time_of_day');
        if (theme === 'auto') {
          if (timeOfDay && ['morning', 'day', 'evening', 'night'].includes(timeOfDay)) {
            effectiveTheme = (timeOfDay === 'night') ? 'dark' : 'light';
          } else {
            const hour = new Date().getHours();
            effectiveTheme = (hour >= 5 && hour < 20) ? 'light' : 'dark';
            
            if (hour >= 5 && hour < 9) timeOfDay = 'morning';
            else if (hour >= 9 && hour < 16) timeOfDay = 'day';
            else if (hour >= 16 && hour < 20) timeOfDay = 'evening';
            else timeOfDay = 'night';
          }
        }
        document.documentElement.setAttribute('data-theme', effectiveTheme);
        document.documentElement.setAttribute('data-theme-mode', theme);
        if (theme === 'auto') {
          document.documentElement.setAttribute('data-time-of-day', timeOfDay);
        }
        document.documentElement.style.colorScheme = effectiveTheme;
        if (effectiveTheme === 'dark') {
          document.documentElement.classList.add('dark', 'dark-mode');
        } else {
          document.documentElement.classList.remove('dark', 'dark-mode');
        }
        
        let bg = (effectiveTheme === 'dark') ? '#0D0D0F' : '#FAF8F5';
        if (theme === 'auto') {
          if (timeOfDay === 'morning') bg = '#FFF5EC';
          else if (timeOfDay === 'day') bg = '#FFFDF9';
          else if (timeOfDay === 'evening') bg = '#FFF8E7';
          else if (timeOfDay === 'night') bg = '#0F0F12';
        }
        document.documentElement.style.backgroundColor = bg;
        document.documentElement.classList.add('theme-loaded');

        document.addEventListener('DOMContentLoaded', function() {
          if (effectiveTheme === 'dark') document.body.classList.add('dark-mode');
          document.body.classList.add('theme-loaded');
        }, { once: true });

        if (document.documentElement.hasAttribute('data-anhad-home')) {
          try { sessionStorage.removeItem('gurbaniKhoj_state'); } catch(e) {}
        }
      } catch (e) {}
    })();
  </script>
  <meta name="color-scheme" content="light dark">
  <script>
    (function() {
      try {
        const theme = localStorage.getItem('anhad_theme') || 'light';
        const html = document.documentElement;
        if (theme === 'dark') {
          html.classList.add('dark', 'dark-mode');
          html.setAttribute('data-theme', 'dark');
          html.style.colorScheme = 'dark';
        } else {
          html.classList.remove('dark', 'dark-mode');
          html.setAttribute('data-theme', 'light');
          html.style.colorScheme = 'light';
        }
      } catch (e) {}
    })();
  </script>

<body>

  <!-- Background Ornaments -->
  <div class="bg-ornaments" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Grain Texture Overlay -->
  <div class="grain-overlay" aria-hidden="true"></div>

  <!-- Loader -->
  <div id="loader">
    <div class="loader-content">
      <div class="loader-ring">
        <div class="loader-ring-inner"></div>
      </div>
      <div class="loader-icon">☬</div>
      <div class="loader-text">Gurpurab Calendar</div>
      <div class="loader-sub">Loading sacred dates”¦</div>
    </div>
  </div>

  <!-- Navigation -->
  <header class="nav-bar" id="navBar">
    <div class="nav-bar-inner">
      <button class="nav-btn" id="btnBack" type="button" aria-label="Back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 12H6M12 18l-6-6 6-6"/>
        </svg>
      </button>
      <div class="nav-title-group">
        <h1 class="nav-title">Gurpurab Calendar</h1>
        <span class="nav-subtitle" id="navSubtitle">Sacred Sikh Dates</span>
      </div>
      <button class="nav-btn nav-btn-today" id="btnToday" type="button" aria-label="Today">
        <span class="today-dot"></span>
        Today
      </button>
    </div>
    <div class="nav-bar-glow"></div>
  </header>

  <main class="container">

    <!-- Today Section -->
    <section class="section today-section">
      <div class="section-header">
        <div class="section-header-inner">
          <span class="section-icon">☬</span>
          <span class="section-title">Today</span>
        </div>
        <div class="section-header-line"></div>
      </div>
      <div class="today-card glass-card">
        <div class="today-card-bg"></div>
        <div class="today-card-content">
          <div class="today-nk" id="todayNk">—</div>
          <div class="today-g" id="todayG">—</div>
        </div>
        <div class="today-card-shimmer"></div>
      </div>
    </section>

    <!-- Calendar Section -->
    <section class="section calendar-section">
      <div class="calendar-header">
        <div class="section-header">
          <div class="section-header-inner">
            <span class="section-icon">📅</span>
            <span class="section-title">Calendar</span>
          </div>
        </div>
        <div class="month-nav-container">
          <div class="month-nav glass-card">
            <button class="month-btn" id="btnPrev" type="button" aria-label="Previous month">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6"/>
              </svg>
            </button>
            <div class="month-label" id="monthLabel">—</div>
            <button class="month-btn" id="btnNext" type="button" aria-label="Next month">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18l6-6-6-6"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="weekday-header" aria-hidden="true">
        <div class="weekday-label">Mon</div>
        <div class="weekday-label">Tue</div>
        <div class="weekday-label">Wed</div>
        <div class="weekday-label">Thu</div>
        <div class="weekday-label">Fri</div>
        <div class="weekday-label">Sat</div>
        <div class="weekday-label">Sun</div>
      </div>

      <div class="calendar-grid" id="calendarGrid" role="grid" aria-label="Calendar"></div>
    </section>

    <!-- Upcoming Events Section -->
    <section class="section upcoming-section">
      <div class="section-header">
        <div class="section-header-inner">
          <span class="section-icon">✍️¨</span>
          <span class="section-title" id="upcomingTitle">Upcoming</span>
        </div>
        <div class="section-header-line"></div>
      </div>
      <div class="upcoming-list glass-card" id="upcomingList" role="list"></div>
    </section>

  </main>

  <!-- Scripts -->
  <script src="../lib/global-theme.js"></script>
  <script src="gurpurab-calendar-ios.js?v=1"></script>

    <!-- Global Alarm/Notification Engine + Back Button + Widget Bridge -->
    <script src="../lib/capacitor-notifications-global.js"></script>
