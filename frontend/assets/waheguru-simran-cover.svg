<svg width="560" height="560" viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Divine Golden Gradient -->
    <radialGradient id="divineGradient" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#D2691E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
    </radialGradient>
    
    <!-- Spiritual Light Gradient -->
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8DC;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.4" />
    </linearGradient>
    
    <!-- Divine Glow Filter -->
    <filter id="divineGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Soft Shadow -->
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background with divine gradient -->
  <rect width="560" height="560" fill="url(#divineGradient)"/>
  
  <!-- Subtle spiritual rays -->
  <g opacity="0.3">
    <path d="M280 140 L320 60 L340 140 Z" fill="url(#lightGradient)"/>
    <path d="M280 140 L240 60 L220 140 Z" fill="url(#lightGradient)"/>
    <path d="M280 140 L380 100 L360 180 Z" fill="url(#lightGradient)"/>
    <path d="M280 140 L180 100 L200 180 Z" fill="url(#lightGradient)"/>
    <path d="M280 140 L420 180 L400 260 Z" fill="url(#lightGradient)"/>
    <path d="M280 140 L140 180 L160 260 Z" fill="url(#lightGradient)"/>
  </g>
  
  <!-- Central divine circle -->
  <circle cx="280" cy="280" r="120" fill="url(#lightGradient)" opacity="0.6" filter="url(#softShadow)"/>
  <circle cx="280" cy="280" r="100" fill="none" stroke="#FFD700" stroke-width="3" opacity="0.8"/>
  <circle cx="280" cy="280" r="80" fill="none" stroke="#FFA500" stroke-width="2" opacity="0.6"/>
  
  <!-- Ek Onkar Symbol (simplified representation) -->
  <g transform="translate(280, 280)" filter="url(#divineGlow)">
    <!-- Main character -->
    <path d="M-30 -20 Q-20 -25, -10 -20 L-10 0 Q-10 10, -20 15 L-25 15 L-25 25 L-15 25 L-15 15 L-5 15 L-5 25 L5 25 L5 15 L15 15 L15 25 L25 25 L25 15 L20 15 Q10 10, 10 0 L10 -20 Q20 -25, 30 -20" 
          fill="none" stroke="#8B4513" stroke-width="4" stroke-linecap="round"/>
    <!-- Decorative elements -->
    <circle cx="-40" cy="-30" r="3" fill="#FFD700"/>
    <circle cx="40" cy="-30" r="3" fill="#FFD700"/>
    <circle cx="-40" cy="30" r="3" fill="#FFD700"/>
    <circle cx="40" cy="30" r="3" fill="#FFD700"/>
  </g>
  
  <!-- Decorative mandala pattern -->
  <g transform="translate(280, 280)" opacity="0.4">
    <g transform="rotate(0)">
      <rect x="-2" y="-140" width="4" height="20" fill="#FFD700"/>
      <circle cx="0" cy="-150" r="6" fill="#FFA500"/>
    </g>
    <g transform="rotate(45)">
      <rect x="-2" y="-140" width="4" height="20" fill="#FFD700"/>
      <circle cx="0" cy="-150" r="6" fill="#FFA500"/>
    </g>
    <g transform="rotate(90)">
      <rect x="-2" y="-140" width="4" height="20" fill="#FFD700"/>
      <circle cx="0" cy="-150" r="6" fill="#FFA500"/>
    </g>
    <g transform="rotate(135)">
      <rect x="-2" y="-140" width="4" height="20" fill="#FFD700"/>
      <circle cx="0" cy="-150" r="6" fill="#FFA500"/>
    </g>
    <g transform="rotate(180)">
      <rect x="-2" y="-140" width="4" height="20" fill="#FFD700"/>
      <circle cx="0" cy="-150" r="6" fill="#FFA500"/>
    </g>
    <g transform="rotate(225)">
      <rect x="-2" y="-140" width="4" height="20" fill="#FFD700"/>
      <circle cx="0" cy="-150" r="6" fill="#FFA500"/>
    </g>
    <g transform="rotate(270)">
      <rect x="-2" y="-140" width="4" height="20" fill="#FFD700"/>
      <circle cx="0" cy="-150" r="6" fill="#FFA500"/>
    </g>
    <g transform="rotate(315)">
      <rect x="-2" y="-140" width="4" height="20" fill="#FFD700"/>
      <circle cx="0" cy="-150" r="6" fill="#FFA500"/>
    </g>
  </g>
  
  <!-- Bottom decorative elements -->
  <g transform="translate(280, 450)" opacity="0.6">
    <path d="M-60 0 Q-30 -20, 0 0 Q30 -20, 60 0" fill="none" stroke="#FFD700" stroke-width="2"/>
    <circle cx="-30" cy="-10" r="4" fill="#FFA500"/>
    <circle cx="0" cy="-15" r="4" fill="#FFA500"/>
    <circle cx="30" cy="-10" r="4" fill="#FFA500"/>
  </g>
  
  <!-- Subtle texture overlay -->
  <rect width="560" height="560" fill="url(#lightGradient)" opacity="0.1"/>
</svg>
