    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {

      background: #0A0A0C;
      color: #FAF8F5;
      min-height: 100vh;
      padding: 0 0 100px 0;
      overflow-x: hidden;
      background-image: radial-gradient(ellipse at 50% 0%, rgba(212, 148, 58, 0.06) 0%, transparent 70%);
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(212, 148, 58, 0.3); border-radius: 99px; }

    /* HEADER */
    .guide-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10, 10, 12, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding: 16px 20px;
      display: flex; align-items: center; gap: 12px;
    }
    .guide-header h1 {
      font-size: 20px; font-weight: 800; flex: 1;
      background: linear-gradient(135deg, #D4943A 0%, #B8860B 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .back-btn {
      width: 40px; height: 40px; border-radius: 12px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
      color: #FAF8F5; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease; text-decoration: none;
    }
    .back-btn:active { transform: scale(0.92); background: rgba(212,148,58,0.2); }

    /* LANGUAGE TOGGLE */
    .lang-bar {
      display: flex; gap: 8px; padding: 12px 20px;
      background: rgba(10,10,12,0.5); flex-shrink: 0;
    }
    .lang-btn {
      padding: 6px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
      background: transparent; color: rgba(255,255,255,0.5); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.2s ease;
    }
    .lang-btn.active {
      background: rgba(212,148,58,0.2); border-color: #D4943A; color: #D4943A;
    }
    .lang-btn:active { transform: scale(0.95); }

    .section-title {
      font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
      color: rgba(255,255,255,0.3); padding: 24px 20px 12px;
    }

    /* FEATURE CARD */
    .feature-card {
      margin: 0 16px 10px; padding: 16px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .feature-card:active { transform: scale(0.98); background: rgba(255,255,255,0.07); }
    .feature-card-header {
      display: flex; align-items: center; gap: 12px;
    }
    .feature-icon {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .feature-name {
      font-size: 16px; font-weight: 700; color: #FAF8F5;
    }
    .feature-chevron {
      margin-left: auto; color: rgba(255,255,255,0.2); font-size: 14px;
      transition: transform 0.3s ease;
    }
    .feature-card.open .feature-chevron { transform: rotate(180deg); }

    .feature-details {
      max-height: 0; overflow: hidden;
      transition: max-height 0.35s ease, opacity 0.25s ease, margin 0.25s ease;
      opacity: 0; margin-top: 0;
    }
    .feature-card.open .feature-details {
      max-height: 600px; opacity: 1; margin-top: 14px;
    }
    .feature-desc {
      font-size: 13.5px; line-height: 1.6; color: rgba(255,255,255,0.7);
      margin-bottom: 12px;
    }
    .feature-desc strong { color: #D4943A; }
    .feature-tip {
      background: rgba(212,148,58,0.08); border-left: 3px solid #D4943A;
      padding: 10px 14px; border-radius: 0 10px 10px 0;
      font-size: 13px; line-height: 1.5; color: rgba(255,255,255,0.75);
      margin-bottom: 10px;
    }
    .feature-tip strong { color: #D4943A; }
    .feature-purpose {
      font-size: 13px; line-height: 1.5; color: rgba(255,255,255,0.55);
      font-style: italic;
    }
    .feature-purpose strong { color: #D4943A; font-style: normal; }

    /* COLOR THEMES FOR ICONS */
    .icon-gold { background: rgba(212,148,58,0.15); }
    .icon-green { background: rgba(52,199,89,0.15); }
    .icon-blue { background: rgba(0,122,255,0.15); }

    .icon-rose { background: rgba(255,69,120,0.15); }

    .icon-indigo { background: rgba(94,92,230,0.15); }

    /* Empty state */

      padding: 2px 8px; border-radius: 6px; margin-left: 8px;
    }

    @media (min-width: 640px) {
      .feature-card { margin: 0 auto 10px; max-width: 600px; }
      body { padding: 0 0 40px; }
    }
  </style>
</head>

  var currentLang = 'en';
  var container = document.getElementById('featuresContainer');

  function render(lang) {
    currentLang = lang;
    var data = content[lang];
    document.getElementById('guideTitle').textContent = data.title;
    document.getElementById('sectionEssential').textContent = data.essentials;
    document.querySelectorAll('.lang-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });

    var html = '';
    data.features.forEach(function(f, idx) {
      html += '<div class="feature-card" data-index="' + idx + '">';
      html += '<div class="feature-card-header">';
      html += '<div class="feature-icon ' + f.iconClass + '">' + f.icon + '</div>';
      html += '<div><div class="feature-name">' + f.name + '</div></div>';
      html += '<div class="feature-chevron">▼</div>';
      html += '</div>';
      html += '<div class="feature-details">';
      html += '<div class="feature-desc">' + f.desc + '</div>';
      html += '<div class="feature-tip"><strong>💡 How to use:</strong> ' + f.tip + '</div>';
      html += '<div class="feature-purpose"><strong>🎯 Main purpose:</strong> ' + f.purpose + '</div>';
      html += '</div></div>';
    });
    container.innerHTML = html;

    // click to toggle
    container.querySelectorAll('.feature-card').forEach(function(card) {
      card.addEventListener('click', function(e) {
        // don't toggle if user selected text
        if (window.getSelection().toString().length > 0) return;
        var wasOpen = card.classList.contains('open');
        // close all others
        container.querySelectorAll('.feature-card.open').forEach(function(c) {
          c.classList.remove('open');
        });
        if (!wasOpen) card.classList.add('open');
      });
    });
  }

  // language switcher
  document.getElementById('langBar').addEventListener('click', function(e) {
    var btn = e.target.closest('.lang-btn');
    if (btn) render(btn.dataset.lang);
  });

  // detect saved tour language, else default to English
  var savedLang = localStorage.getItem('anhad_tour_lang') || 'en';
  if (['en','hi','pa'].indexOf(savedLang) === -1) savedLang = 'en';
  render(savedLang);
</script>
