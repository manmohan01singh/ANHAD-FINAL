<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="color-scheme" content="light dark">
  <script>
    (function() {
      try {
        const theme = localStorage.getItem('anhad_theme') || 'auto';
        let effectiveTheme = theme;
        let timeOfDay = localStorage.getItem('anhad_forced_time_of_day');
        if (theme === 'auto') {
          if (timeOfDay && ['morning', 'day', 'evening', 'night'].includes(timeOfDay)) {
            effectiveTheme = (timeOfDay === 'night') ? 'dark' : 'light';
          } else {
            const hour = new Date().getHours();
            effectiveTheme = (hour >= 5 && hour < 20) ? 'light' : 'dark';
            if (hour >= 5 && hour < 9) timeOfDay = 'morning';
            else if (hour >= 9 && hour < 16) timeOfDay = 'day';
            else if (hour >= 16 && hour < 20) timeOfDay = 'evening';
            else timeOfDay = 'night';
          }
        }
        document.documentElement.setAttribute('data-theme', effectiveTheme);
        document.documentElement.setAttribute('data-theme-mode', theme);
        if (theme === 'auto') {
          document.documentElement.setAttribute('data-time-of-day', timeOfDay);
        }
        document.documentElement.style.colorScheme = effectiveTheme;
        if (effectiveTheme === 'dark') {
          document.documentElement.classList.add('dark', 'dark-mode');
        } else {
          document.documentElement.classList.remove('dark', 'dark-mode');
        }
        
        let bg = (effectiveTheme === 'dark') ? '#0D0D0F' : '#FAF8F5';
        if (theme === 'auto') {
          if (timeOfDay === 'morning') bg = '#FFF5EC';
          else if (timeOfDay === 'day') bg = '#FFFDF9';
          else if (timeOfDay === 'evening') bg = '#FFF8E7';
          else if (timeOfDay === 'night') bg = '#0F0F12';
        }
        document.documentElement.style.backgroundColor = bg;
        document.documentElement.classList.add('theme-loaded');

        document.addEventListener('DOMContentLoaded', function() {
          if (effectiveTheme === 'dark') document.body.classList.add('dark-mode');
          document.body.classList.add('theme-loaded');
        }, { once: true });
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Spiritual Notifications - ANHAD</title>
  <link rel="stylesheet" href="../css/anhad-core.css">
  <link rel="stylesheet" href="../css/theme-variables.css">
  <link rel="stylesheet" href="../css/nav-glass.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-primary, #FAF8F5);
      color: var(--text-primary, #1C1C1E);
      min-height: 100vh;
      padding-bottom: 120px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    [data-theme="dark"] body {
      background: var(--bg-primary, #0D0D0F);
      color: var(--text-primary, #F5F5F7);
    }

    .settings-container {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 20px;
    }

    .header-info {
      margin-bottom: 24px;
      text-align: center;
      padding: 12px 0 6px;
    }

    .header-info h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: var(--text-primary, #1C1C1E);
    }

    [data-theme="dark"] .header-info h1 {
      color: #FFFFFF;
    }

    .header-info p {
      font-size: 14px;
      color: var(--text-secondary, #8E8E93);
      line-height: 1.4;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Top Quick Action Buttons */
    .quick-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .quick-btn {
      flex: 1;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid rgba(242, 154, 46, 0.25);
      background: rgba(242, 154, 46, 0.08);
      color: var(--text-primary, #1C1C1E);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    [data-theme="dark"] .quick-btn {
      color: #F5F5F7;
      background: rgba(242, 154, 46, 0.12);
      border-color: rgba(242, 154, 46, 0.3);
    }

    .quick-btn:active {
      transform: scale(0.97);
      background: rgba(242, 154, 46, 0.2);
    }

    /* Section Cards */
    .section-group {
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #F29A2E;
      margin-bottom: 12px;
      padding-left: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .setting-card {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 20px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.25s ease;
    }

    [data-theme="dark"] .setting-card {
      background: rgba(28, 28, 30, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .card-main {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .card-icon {
      font-size: 24px;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(242, 154, 46, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-text {
      flex: 1;
      min-width: 0;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary, #1C1C1E);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    [data-theme="dark"] .card-title {
      color: #FFFFFF;
    }

    .card-subtitle {
      font-size: 12px;
      color: var(--text-secondary, #8E8E93);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .time-input-wrap {
      position: relative;
    }

    .time-input {
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      padding: 6px 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary, #1C1C1E);
      font-family: inherit;
      outline: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    [data-theme="dark"] .time-input {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
      color: #F5F5F7;
    }

    .time-input:focus {
      border-color: #F29A2E;
      background: rgba(242, 154, 46, 0.1);
    }

    /* Test Button */
    .test-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 1px solid rgba(242, 154, 46, 0.3);
      background: rgba(242, 154, 46, 0.1);
      color: #F29A2E;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
    }

    .test-btn:active {
      transform: scale(0.9);
      background: #F29A2E;
      color: #FFFFFF;
    }

    /* iOS Clay Toggle Switch */
    .toggle {
      width: 48px;
      height: 28px;
      background: rgba(120, 120, 128, 0.25);
      border-radius: 14px;
      position: relative;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      flex-shrink: 0;
    }

    .toggle.active {
      background: #F29A2E;
      box-shadow: 0 2px 10px rgba(242, 154, 46, 0.4);
    }

    .toggle-knob {
      width: 24px;
      height: 24px;
      background: #FFFFFF;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    .toggle.active .toggle-knob {
      transform: translateX(20px);
    }

    /* Sticky Save Bar */
    .save-bar-container {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      padding: 0 20px;
      z-index: 999;
      pointer-events: none;
    }

    .save-btn {
      pointer-events: auto;
      background: linear-gradient(135deg, #F29A2E 0%, #D8821C 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 28px;
      padding: 16px 36px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(242, 154, 46, 0.45);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(242, 154, 46, 0.55);
    }

    .save-btn:active {
      transform: scale(0.96);
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(30, 30, 32, 0.95);
      color: #FFFFFF;
      padding: 14px 24px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      z-index: 10000;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>

  <script src="../lib/spiritual-notifications.js"></script>
</head>

<body>
  <!-- Navigation Header -->
  <nav class="glass-nav">
    <button class="glass-nav__back" onclick="history.back()">
      <svg class="back-chevron" viewBox="0 0 9 16"><path d="M8 1L1 8L8 15" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="back-label">Settings</span>
    </button>
    <span class="glass-nav__title">Spiritual Notifications</span>
    <div class="glass-nav__action"></div>
  </nav>

  <div class="settings-container">
    <div class="header-info">
      <h1>Spiritual Notifications</h1>
      <p>Receive peaceful, timely reminders throughout the day for Nitnem banis, Daily Hukamnama, Simran, and Kirtan.</p>
    </div>

    <div class="quick-actions">
      <button class="quick-btn" onclick="toggleAllNotifications(true)">
        <span>✅</span> Enable All
      </button>
      <button class="quick-btn" onclick="toggleAllNotifications(false)">
        <span>⏸️️</span> Pause All
      </button>
      <button class="quick-btn" onclick="resetToDefaults()">
        <span>🔄</span> Reset Times
      </button>
    </div>

    <div id="sectionsContainer"></div>
  </div>

  <div class="save-bar-container">
    <button class="save-btn" id="saveBtn" onclick="saveAllSettings()">
      <span>💾</span> Save & Schedule Notifications
    </button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SECTIONS = [
      {
        id: 'morning',
        title: '🌅 Morning Nitnem & Prayers',
        categories: [
          'amritvela',
          'japji_sahib',
          'jaap_sahib',
          'tav_prasad_swaye',
          'hukamnama',
          'chaupai_sahib',
          'anand_sahib'
        ]
      },
      {
        id: 'day',
        title: '🎧 Daytime Inspiration, Simran & Paath',
        categories: [
          'gurbani_radio',
          'simran',
          'midday_peace',
          'sehaj_paath',
          'random_spiritual_reminders'
        ]
      },
      {
        id: 'evening',
        title: '🌇 Evening & Night Prayers',
        categories: [
          'evening_peace',
          'rehras_sahib',
          'aarti',
          'nitnem_missed',
          'streak_milestone',
          'kirtan_sohila',
          'bedtime'
        ]
      }
    ];

    function showToast(message) {
      const t = document.getElementById('toast');
      t.innerHTML = message;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    function renderUI() {
      const container = document.getElementById('sectionsContainer');
      const manager = window.SpiritualNotifications;
      if (!manager) return;

      const config = manager.getConfig();
      const meta = manager.getMeta();

      let html = '';

      SECTIONS.forEach(sec => {
        html += `<div class="section-group">`;
        html += `<div class="section-title">${sec.title}</div>`;
        html += `<div class="card-list">`;

        sec.categories.forEach(catKey => {
          const itemMeta = meta[catKey];
          const itemConf = config[catKey] || {};
          if (!itemMeta) return;

          const isEnabled = itemConf.enabled !== false;
          const timeVal = itemConf.time || itemMeta.defaultTime || '06:00';
          const hasTime = catKey !== 'random_spiritual_reminders';

          html += `
            <div class="setting-card" id="card_${catKey}">
              <div class="card-main">
                <div class="card-icon">${itemMeta.icon}</div>
                <div class="card-text">
                  <div class="card-title">${itemMeta.label}</div>
                  <div class="card-subtitle">${itemMeta.subtitle}</div>
                </div>
              </div>
              
              <div class="card-controls">
                ${hasTime ? `
                  <div class="time-input-wrap">
                    <input type="time" class="time-input" 
                           id="time_${catKey}" 
                           value="${timeVal}" 
                           onchange="onTimeChange('${catKey}', this.value)">
                  </div>
                ` : ''}

                <button class="test-btn" title="Test this notification" onclick="testNotification('${catKey}')">
                  🔔
                </button>

                <div class="toggle ${isEnabled ? 'active' : ''}" 
                     id="toggle_${catKey}" 
                     onclick="onToggleChange('${catKey}')">
                  <div class="toggle-knob"></div>
                </div>
              </div>
            </div>
          `;
        });

        html += `</div></div>`;
      });

      container.innerHTML = html;
    }

    function onToggleChange(categoryKey) {
      const manager = window.SpiritualNotifications;
      const config = manager.getConfig();
      const current = config[categoryKey] ? config[categoryKey].enabled !== false : true;
      const next = !current;

      manager.updateSetting(categoryKey, { enabled: next });
      
      const toggleEl = document.getElementById(`toggle_${categoryKey}`);
      if (toggleEl) {
        toggleEl.classList.toggle('active', next);
      }
    }

    function onTimeChange(categoryKey, newTime) {
      const manager = window.SpiritualNotifications;
      manager.updateSetting(categoryKey, { time: newTime });
    }

    function toggleAllNotifications(enable) {
      const manager = window.SpiritualNotifications;
      const meta = manager.getMeta();
      Object.keys(meta).forEach(k => {
        manager.updateSetting(k, { enabled: enable });
      });
      renderUI();
      showToast(enable ? '✅ All 15 notifications enabled' : '⏸️️ All notifications paused');
    }

    function resetToDefaults() {
      const manager = window.SpiritualNotifications;
      const meta = manager.getMeta();
      Object.keys(meta).forEach(k => {
        const defaultT = meta[k].defaultTime;
        if (defaultT) {
          manager.updateSetting(k, { enabled: true, time: defaultT });
        } else {
          manager.updateSetting(k, { enabled: true });
        }
      });
      renderUI();
      showToast('🔄 Notification times reset to recommended defaults');
    }

    async function testNotification(categoryKey) {
      const manager = window.SpiritualNotifications;
      showToast(`🔔 Triggering test for ${manager.getMeta()[categoryKey]?.label || 'Notification'}...`);
      const success = await manager.testNotification(categoryKey);
      if (success) {
        showToast('✨ Test notification fired! Check your notification tray.');
      } else {
        showToast('⚠️ Please allow notification permission in your system settings.');
      }
    }

    async function saveAllSettings() {
      const manager = window.SpiritualNotifications;
      const meta = manager.getMeta();

      // Collect all current input values
      Object.keys(meta).forEach(k => {
        const timeInput = document.getElementById(`time_${k}`);
        if (timeInput) {
          manager.updateSetting(k, { time: timeInput.value });
        }
      });

      manager.saveConfig();

      const btn = document.getElementById('saveBtn');
      btn.innerHTML = '<span>⏳</span> Scheduling...';
      btn.disabled = true;

      try {
        const scheduled = await manager.scheduleAll();
        showToast(`✨ Saved! Scheduled ${scheduled.length} notifications for the week.`);
      } catch (e) {
        showToast('✅ Saved settings successfully.');
      } finally {
        btn.innerHTML = '<span>💾</span> Save & Schedule Notifications';
        btn.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderUI();
    });
  </script>
</body>
</html>
